function renderWardGuide(lang){
  document.getElementById('sp-title-text').textContent='분만실 입원생활 안내';
  const d = WARD[lang]||WARD['en'];
  const kr = WARD['kr'];
  let html='<div class="sp-card">';
  // s1
  html+=`<div class="sp-sec"><div class="ward-sec-title"><span class="ward-num">1</span>${kr.s1.name}</div>`;
  html+=`<div style="font-size:13px;color:var(--pk600);margin-bottom:6px;">${d.s1.name}</div>`;
  kr.s1.items.forEach((item,i)=>{html+=`<div class="sp-text">${item}</div><div style="font-size:13px;color:#999;padding-left:10px;margin-bottom:4px;">${d.s1.items[i]}</div>`;});
  html+='</div>';
  // s2
  html+=`<div class="sp-sec"><div class="ward-sec-title"><span class="ward-num">2</span>${kr.s2.name}</div>`;
  html+=`<div style="font-size:13px;color:var(--pk600);margin-bottom:6px;">${d.s2.name}</div>`;
  html+=`<div class="sp-sub">면회 시간 / ${d.s2.time.split(':')[0]}</div><div class="sp-text">${kr.s2.time}</div><div style="font-size:13px;color:#999;padding-left:10px;margin-bottom:6px;">${d.s2.time}</div>`;
  const visitLimitTitles={'en':'Visiting Restrictions','vi':'Hạn chế thăm bệnh','ar':'قيود الزيارة','ru':'Ограничения посещений','th':'ข้อจำกัดการเยี่ยม','zh':'探视限制'};
  const visitProcTitles={'en':'Visiting Procedure','vi':'Quy trình thăm bệnh','ar':'إجراءات الزيارة','ru':'Порядок посещения','th':'ขั้นตอนการเยี่ยม','zh':'探视程序'};
  html+=`<div class="sp-sub">면회 제한 / ${visitLimitTitles[lang]||visitLimitTitles['en']}</div>`;
  kr.s2.limits.forEach((item,i)=>{html+=`<div class="sp-sub-text">${item}</div><div style="font-size:13px;color:#999;padding-left:20px;margin-bottom:3px;">${d.s2.limits[i]}</div>`;});
  html+=`<div class="sp-sub">면회 절차 / ${visitProcTitles[lang]||visitProcTitles['en']}</div>`;
  kr.s2.proc.forEach((item,i)=>{html+=`<div class="sp-sub-text">${item}</div><div style="font-size:13px;color:#999;padding-left:20px;margin-bottom:3px;">${d.s2.proc[i]}</div>`;});
  html+=`<div class="sp-highlight">${kr.s2.highlight.replace(/\n/g,'<br>')}</div>`;
  html+=`<div style="font-size:13px;color:#999;margin-top:4px;">${d.s2.highlight.replace(/\n/g,'<br>')}</div>`;
  html+='</div>';
  // s3
  html+=`<div class="sp-sec"><div class="ward-sec-title"><span class="ward-num">3</span>${kr.s3.name}</div>`;
  html+=`<div style="font-size:13px;color:var(--pk600);margin-bottom:6px;">${d.s3.name}</div>`;
  html+='<div class="time-grid">';
  kr.s3.times.forEach((t,i)=>{html+=`<div class="time-card"><div class="time-label">${t[0]}<br><span style="font-size:10px;color:#aaa;">${d.s3.times[i][0]}</span></div><div class="time-val">${t[1]}</div></div>`;});
  html+='</div>';
  const mealCancelTitles={'en':'Meal Cancellation','vi':'Hủy bữa ăn','ar':'إلغاء الوجبة','ru':'Отмена питания','th':'ยกเลิกอาหาร','zh':'取消餐食'};
  const normalTitles={'en':'Cancellation Deadline (Regular)','vi':'Hạn hủy (Thức ăn thường)','ar':'موعد الإلغاء (عادية)','ru':'Срок отмены (обычное)','th':'กำหนดยกเลิก (ปกติ)','zh':'取消截止（普通餐）'};
  const diabeticTitles={'en':'Cancellation Deadline (Diabetic)','vi':'Hạn hủy (Tiểu đường)','ar':'موعد الإلغاء (سكري)','ru':'Срок отмены (диабет)','th':'กำหนดยกเลิก (เบาหวาน)','zh':'取消截止（糖尿病餐）'};
  html+=`<div class="sp-sub">식사 취소 / ${mealCancelTitles[lang]||mealCancelTitles['en']}</div><div class="sp-text">${kr.s3.cancel}</div><div style="font-size:13px;color:#999;padding-left:10px;margin-bottom:4px;">${d.s3.cancel}</div>`;
  html+=`<div class="sp-sub">취소 가능 (일반식) / ${normalTitles[lang]||normalTitles['en']}</div><div class="sp-sub-text">${kr.s3.normal}</div><div style="font-size:13px;color:#999;padding-left:20px;margin-bottom:4px;">${d.s3.normal}</div>`;
  html+=`<div class="sp-sub">취소 가능 (당뇨치료식) / ${diabeticTitles[lang]||diabeticTitles['en']}</div><div class="sp-sub-text">${kr.s3.diabetic}</div><div style="font-size:13px;color:#999;padding-left:20px;margin-bottom:4px;">${d.s3.diabetic}</div>`;
  html+='</div>';
  // s4
  html+=`<div class="sp-sec"><div class="ward-sec-title"><span class="ward-num">4</span>${kr.s4.name}</div>`;
  html+=`<div style="font-size:13px;color:var(--pk600);margin-bottom:6px;">${d.s4.name}</div>`;
  kr.s4.items.forEach((item,i)=>{html+=`<div class="sp-text">${item}</div><div style="font-size:13px;color:#999;padding-left:10px;margin-bottom:4px;">${d.s4.items[i]}</div>`;});
  html+='</div>';
  // s5
  html+=`<div class="sp-sec"><div class="ward-sec-title"><span class="ward-num">5</span>${kr.s5.name}</div>`;
  html+=`<div style="font-size:13px;color:var(--pk600);margin-bottom:6px;">${d.s5.name}</div>`;
  kr.s5.items.forEach((item,i)=>{html+=`<div class="sp-text">${item}</div><div style="font-size:13px;color:#999;padding-left:10px;margin-bottom:4px;">${d.s5.items[i]}</div>`;});
  html+='</div></div>';
  document.getElementById('sp-content').innerHTML=html;
  go('special');

function renderIO(lang){

  document.getElementById('sp-content').innerHTML='<div class="sp-card" style="padding:6px;">'+html+'</div>';
  go('special');
}


function renderPad(lang){
  document.getElementById('sp-title-text').textContent='Pad Count';
  const kr=PAD.kr; const t=PAD[lang]||PAD.en;
  document.getElementById('sp-content').innerHTML=`
    <div class="sp-card">

  go('special');
}

let S={lang:null,cat:null};
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+id).classList.add('active');}

function selectLang(code,name,native){
  const d=document.getElementById('ai-disclaimer');
  if(d) d.textContent=AI_DISCLAIMER[code]||AI_DISCLAIMER['ko'];
  S.lang=code;
  document.getElementById('hdr-sub').textContent=name;
  document.getElementById('back-area').innerHTML='<button class="back-btn" onclick="backLang()">← 언어 선택</button>';
  document.getElementById('breadcrumb').textContent=native;
  renderCats();go('cat');
}

function renderCats(){
  const l=document.getElementById('cat-list');l.innerHTML='';
  Object.entries(CAT).forEach(([name,data])=>{
    const d=document.createElement('div');d.className='cat-btn';
    d.innerHTML=`<div class="cat-icon">${data.icon}</div><div class="cat-label">${name}</div>`;
    d.onclick=()=>pickCat(name,data);l.appendChild(d);
  });
}

function pickCat(name,data){
  S.cat=name;
  const bc=document.getElementById('breadcrumb').textContent.split(' > ')[0];
  document.getElementById('breadcrumb').textContent=bc+' > '+name;
  if(data.special==='io'){
    document.getElementById('back-area').innerHTML=`<button class="back-btn" onclick="backCat()">← 카테고리</button>`;
    renderIO(S.lang);return;
  }
  if(data.msgs){
    document.getElementById('back-area').innerHTML=`<button class="back-btn" onclick="backCat()">← 카테고리</button>`;
    renderMsgs(data.msgs,name);return;
  }
  if(data.subs){
    document.getElementById('back-area').innerHTML=`<button class="back-btn" onclick="backCat()">← 카테고리</button>`;
    document.getElementById('sub-title').textContent=name+' 세부 항목';
    const l=document.getElementById('sub-list');l.innerHTML='';
    Object.entries(data.subs).forEach(([k,val])=>{
      const b=document.createElement('button');
      b.style.cssText='display:block;width:100%;background:#fff;color:#555;border:1.5px solid #FFB3CC;border-radius:10px;padding:13px 14px;font-size:14px;font-weight:500;text-align:left;cursor:pointer;-webkit-appearance:none;appearance:none;margin-bottom:0;';
      b.textContent=k;
      b.onmouseover=function(){this.style.background='#FFF0F5';this.style.color='#7A1F3D';};
      b.onmouseout=function(){this.style.background='#fff';this.style.color='#555';};
      b.onclick=()=>{
        const bc2=document.getElementById('breadcrumb').textContent.split(' > ').slice(0,2).join(' > ');
        document.getElementById('breadcrumb').textContent=bc2+' > '+k;
        document.getElementById('back-area').innerHTML=`<button class="back-btn" onclick="pickCat('${name}',CAT['${name}'])">← ${name}</button>`;
        if(val&&val.special==='io'){renderIO(S.lang);}
        else if(val&&val.special==='pad'){renderPad(S.lang);}
        else if(val&&val.special==='ward'){renderWardGuide(S.lang);}
        else if(val&&val.special==='nrs'){renderNRS(S.lang);}
        else{renderMsgs(val,k);}
      };
      l.appendChild(b);
    });
    go('sub');
  }else{
    document.getElementById('back-area').innerHTML=`<button class="back-btn" onclick="backCat()">← 카테고리</button>`;
    renderMsgs(data.msgs,name);
  }
}

function renderNRS(lang){
  document.getElementById('sp-title-text').textContent='NRS (통증 점수)';
  const q='통증이 어떻게 되세요? 0은 통증 없음, 10은 극심한 통증입니다.';
  const tl=(TRANS[q]&&TRANS[q][lang])||q;
  document.getElementById('sp-content').innerHTML=`
    <div class="sp-card">
      <img class="sp-img" src="${IMG_NRS}" alt="NRS 통증 척도">
      <div style="font-size:13px;color:#555;line-height:1.6;margin-top:8px;">${q}</div>
      <div style="font-size:13px;font-weight:500;color:var(--pk800);line-height:1.6;margin-top:6px;background:var(--pk50);border-radius:8px;padding:8px 10px;">${tl}</div>
    </div>`;
  go('special');
}

function renderMsgs(msgs,title){
  document.getElementById('msgs-title').textContent=title;
  const l=document.getElementById('msg-list');l.innerHTML='';
  msgs.forEach((kr,i)=>{
    const tl=(TRANS[kr]&&TRANS[kr][S.lang])||'';
    const c=document.createElement('div');
    c.style.cssText='background:white;border:1px solid #FFB3CC;border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;';
    const numSpan=`<span style="display:inline-flex;align-items:center;justify-content:center;background:#FF6699;color:white;border-radius:50%;width:22px;height:22px;font-size:11px;font-weight:500;margin-bottom:8px;">${i+1}</span>`;
    const krDiv=`<div style="font-size:13px;color:#666;line-height:1.6;margin-bottom:6px;">${kr}</div>`;
    const tlDiv=tl?`<div style="font-size:14px;font-weight:500;color:#CC3366;line-height:1.6;">${tl}</div>`:'';
    c.innerHTML=numSpan+krDiv+tlDiv;
    c.onclick=()=>{if(navigator.clipboard)navigator.clipboard.writeText(tl||kr).then(()=>showToast('복사됨!'));};
    l.appendChild(c);
  });
  go('msgs');
}



function backLang(){
  const d=document.getElementById('ai-disclaimer');
  if(d) d.textContent=AI_DISCLAIMER['ko'];S.lang=null;document.getElementById('back-area').innerHTML='';document.getElementById('breadcrumb').textContent='';document.getElementById('hdr-sub').textContent='외국인 환자 소통 도우미';go('lang');}
function backCat(){document.getElementById('back-area').innerHTML=`<button class="back-btn" onclick="backLang()">← 언어 선택</button>`;const bc=document.getElementById('breadcrumb').textContent.split(' > ')[0];document.getElementById('breadcrumb').textContent=bc;go('cat');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
</script>
