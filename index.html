<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--pk50:#FFF0F5;--pk100:#FFD6E7;--pk200:#FFB3CC;--pk400:#FF6699;--pk600:#CC3366;--pk800:#7A1F3D;}
.app{max-width:100%;width:100%;min-height:100vh;background:var(--pk50);display:flex;flex-direction:column;}
.hdr{background:linear-gradient(135deg,#E91E8C,#FF6699);padding:16px 16px 12px;}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
.logo{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid white;}
.logo img{width:100%;height:100%;object-fit:cover;}
.hdr h1{font-size:17px;font-weight:500;color:white;}
.hdr-sub{font-size:14px;color:rgba(255,255,255,0.85);}
.breadcrumb{font-size:13px;color:rgba(255,255,255,0.75);margin-top:3px;}
.back-btn{background:none;border:none;cursor:pointer;color:white;font-size:15px;opacity:0.9;margin-bottom:3px;padding:0;}
.screen{flex:1;padding:14px;display:none;overflow-y:auto;}
.screen.active{display:block;}
.scr-title{font-size:17px;font-weight:500;color:var(--pk800);margin-bottom:12px;}

/* 언어 선택 */
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.lang-btn{background:white;border:1.5px solid var(--pk200);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;}
.lang-btn:hover{border-color:var(--pk400);}
.flag-img{width:60px;height:40px;object-fit:cover;border-radius:6px;border:1px solid #eee;display:block;margin:0 auto 7px;}
.lang-name{font-size:15px;font-weight:500;color:var(--pk800);}
.lang-native{font-size:13px;color:var(--pk600);margin-top:2px;}

/* 카테고리 */
.cat-list{display:flex;flex-direction:column;gap:9px;}
.cat-btn{background:white;border:1.5px solid var(--pk200);border-radius:12px;padding:14px;cursor:pointer;display:flex;align-items:center;gap:10px;}
.cat-btn:hover{border-color:var(--pk400);}
.cat-icon{width:38px;height:38px;background:var(--pk100);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.cat-label{font-size:16px;font-weight:500;color:#333;}

/* 세부항목 */
.sub-list{display:flex;flex-direction:column;gap:7px;}

/* 메시지 카드 - 클릭시 확대 */
.msg-list{display:flex;flex-direction:column;gap:10px;}
.msg-item{background:white;border:1px solid var(--pk200);border-radius:12px;overflow:hidden;cursor:pointer;}
.msg-header{display:flex;align-items:center;gap:10px;padding:12px 14px;}
.msg-num{background:var(--pk400);color:white;border-radius:50%;width:22px;height:22px;font-size:11px;font-weight:500;text-align:center;line-height:22px;flex-shrink:0;}
.msg-kr{font-size:15px;color:#555;flex:1;line-height:1.5;}
.msg-arrow{color:var(--pk400);font-size:14px;flex-shrink:0;transition:transform 0.2s;}
.msg-body{display:none;padding:0 14px 14px 46px;}
.msg-body.open{display:block;}
.msg-tl{font-size:16px;font-weight:500;color:var(--pk800);line-height:1.6;background:var(--pk50);border-radius:8px;padding:10px 12px;}

/* NRS 이미지 */
.nrs-img{width:100%;border-radius:8px;margin:8px 0;}

/* special 화면 (I/O, Pad, 입원생활안내) */
.sp-card{background:white;border:1px solid var(--pk200);border-radius:12px;padding:14px;margin-bottom:10px;}
.sp-sec{margin-bottom:14px;}
.sp-title{font-size:15px;font-weight:500;color:var(--pk800);margin-bottom:7px;padding-bottom:6px;border-bottom:0.5px solid var(--pk100);}
.sp-sub{font-size:14px;font-weight:500;color:var(--pk600);margin:10px 0 4px;}
.sp-text{font-size:14px;color:#555;line-height:1.7;padding-left:10px;position:relative;margin-bottom:2px;}
.sp-text::before{content:"•";position:absolute;left:0;color:var(--pk400);}
.sp-sub-text{font-size:14px;color:#777;line-height:1.7;padding-left:20px;position:relative;margin-bottom:2px;}
.sp-sub-text::before{content:"-";position:absolute;left:10px;color:#bbb;}
.sp-highlight{background:var(--pk50);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:14px;color:var(--pk800);line-height:1.7;white-space:pre-line;}
.sp-img{width:100%;border-radius:8px;margin:8px 0;border:0.5px solid var(--pk100);}
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0;}
.time-card{background:var(--pk50);border-radius:7px;padding:8px;text-align:center;}
.time-label{font-size:13px;color:var(--pk600);font-weight:500;margin-bottom:3px;}
.time-val{font-size:13px;color:var(--pk800);font-weight:500;}
.ward-num{display:inline-flex;align-items:center;justify-content:center;background:var(--pk100);color:var(--pk800);border-radius:50%;width:24px;height:24px;font-size:13px;font-weight:500;flex-shrink:0;margin-right:6px;}
.ward-sec-title{display:flex;align-items:center;font-size:15px;font-weight:500;color:var(--pk800);margin-bottom:8px;padding-bottom:6px;border-bottom:0.5px solid var(--pk100);}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:8px 18px;border-radius:18px;font-size:12px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;}

.ai-disclaimer {
  display: block;
  padding: 8px 12px 12px;
  font-size: 11pt;
  color: #aaa;
  pointer-events: none;
}

</style>

const TRANS={"초음파 검사를 위해 소변을 봐야합니다. 저를 따라오면 화장실을 안내해 드릴게요.": {"en": "You need to urinate before the ultrasound. Please follow me to the restroom.", "vi": "Bạn cần đi tiểu trước khi siêu âm. Vui lòng theo tôi đến nhà vệ sinh.", "ar": "تحتاجين للتبول قبل الفحص. تفضلي معي إلى الحمام.", "ru": "Перед УЗИ нужно помочиться. Следуйте за мной в туалет.", "th": "คุณต้องปัสสาวะก่อนอัลตราซาวนด์ กรุณาตามฉันไปห้องน้ำ", "zh": "超声检查前需先排尿，请跟我去卫生间。"}, "속옷을 벗고 이 치마를 입고 나오세요.": {"en": "Remove your underwear and put on this gown.", "vi": "Vui lòng cởi đồ lót và mặc váy này vào.", "ar": "اخلعي ملابسك الداخلية والبسي هذا الرداء.", "ru": "Снимите нижнее бельё и наденьте этот халат.", "th": "ถอดชุดชั้นในแล้วสวมเสื้อคลุมนี้", "zh": "脱下内衣，穿上这件检查服。"}, "침대에 누워서 기다리면 의사가 와서 진료를 볼 거예요.": {"en": "Please lie on the bed and wait. The doctor will come to examine you.", "vi": "Vui lòng nằm xuống giường và chờ. Bác sĩ sẽ đến khám.", "ar": "استلقي على السرير وانتظري. سيأتي الطبيب لفحصك.", "ru": "Лягте на кровать и подождите. Врач придёт вас осмотреть.", "th": "นอนบนเตียงและรอ แพทย์จะมาตรวจ", "zh": "请躺在床上等候，医生会来为您诊察。"}, "옷 갈아입고 나오세요. 침대에서 대기하시면 이송요원이 오실 거예요.": {"en": "Please change and wait on the bed. A transport staff will come for you.", "vi": "Vui lòng thay đồ và chờ trên giường. Nhân viên vận chuyển sẽ đến đón quý vị.", "ar": "غيري ملابسك وانتظري على السرير. سيأتي موظف النقل.", "ru": "Переоденьтесь и подождите на кровати. Придёт транспортировщик.", "th": "เปลี่ยนเสื้อผ้าแล้วรออยู่บนเตียงนะคะ เจ้าหน้าที่จะมารับ", "zh": "请更衣后在床上等候，转运人员会来接您。"}, "1층 응급실 내 응급 원무과에서 입원 수속 후 환자팔찌를 받아서 올라와 대기해 주세요.": {"en": "Complete admission at the ER admin office (1F), receive your patient wristband, then come back up and wait.", "vi": "Vui lòng làm thủ tục nhập viện tại phòng hành chính tầng 1, nhận vòng tay bệnh nhân rồi lên chờ.", "ar": "يرجى إكمال إجراءات الدخول في مكتب الطوارئ (الطابق 1)، واستلام سوار المريض ثم العودة والانتظار.", "ru": "Оформите госпитализацию в приёмном отделении (1 этаж), получите браслет пациента и поднимитесь ждать.", "th": "ดำเนินการรับเข้าที่แผนกฉุกเฉินชั้น 1 รับสายรัดข้อมือผู้ป่วย แล้วขึ้นมารอ", "zh": "请在1楼急诊行政办公室完成入院手续，领取患者腕带后上来等候。"}, "국가에서 지원해주는 병상입니다. 입실 시 동의서 서명이 필요합니다. 하루 입원료는 약 59,000원입니다.": {"en": "This is a government-subsidized room. Consent form required upon admission. Daily charge approx. 59,000 KRW.", "vi": "Đây là giường được nhà nước hỗ trợ. Vui lòng ký giấy đồng ý khi nhập phòng. Phí hàng ngày khoảng 59.000 won.", "ar": "هذا سرير مدعوم حكومياً. يلزم توقيع نموذج موافقة عند الدخول. الرسوم اليومية حوالي 59,000 وون.", "ru": "Это место с государственной субсидией. При заселении нужна подпись на согласии. Стоимость в день ~59 000 вон.", "th": "เตียงนี้ได้รับการสนับสนุนจากรัฐ ต้องเซ็นใบยินยอมเมื่อเข้าพัก ค่าห้องต่อวันประมาณ 59,000 วอน", "zh": "这是政府补贴病床，入住时需签署同意书，每日住院费约59,000韩元。"}, "3인실입니다.": {"en": "This is a 3-bed room.", "vi": "Đây là phòng 3 người.", "ar": "هذه غرفة ثلاثية.", "ru": "Это трёхместная палата.", "th": "นี่คือห้อง 3 เตียง", "zh": "这是三人间病房。"}, "화장실은 가족분만실 1에서 사용하시면 됩니다.": {"en": "Please use the restroom in Family Delivery Room 1.", "vi": "Vui lòng sử dụng nhà vệ sinh tại Phòng sinh gia đình số 1.", "ar": "يرجى استخدام الحمام في غرفة الولادة العائلية 1.", "ru": "Пожалуйста, пользуйтесь туалетом в семейной родильной палате №1.", "th": "กรุณาใช้ห้องน้ำในห้องคลอดครอบครัว 1", "zh": "请使用家庭分娩室1的卫生间。"}, "7층 4인실 입원료를 내고, 분만실 안에 있는 2인실 병실을 사용할 것입니다.": {"en": "You will pay the 7F 4-bed room rate and use the 2-bed room inside the delivery ward.", "vi": "Bạn trả phí phòng 4 người tầng 7 và sử dụng phòng 2 người trong khu sinh.", "ar": "ستدفعين رسوم الغرفة الرباعية في الطابق السابع، وستستخدمين غرفة مزدوجة داخل جناح الولادة.", "ru": "Вы платите за четырёхместную палату (7 этаж) и используете двухместную палату в родильном отделении.", "th": "คุณชำระค่าห้อง 4 เตียงชั้น 7 และใช้ห้อง 2 เตียงในหอผู้ป่วยคลอด", "zh": "您支付7楼四人间费用，使用分娩室内的二人间病房。"}, "고위험 임산부 집중치료실 자리가 생기면 그쪽으로 병실 변경 예정입니다.": {"en": "You will be transferred to the High-Risk Maternity ICU when a bed becomes available.", "vi": "Bạn sẽ được chuyển đến ICU sản phụ nguy cơ cao khi có chỗ trống.", "ar": "سيتم نقلك إلى وحدة العناية المركزة للحوامل ذوات الخطورة العالية عند توفر سرير.", "ru": "При появлении места вас переведут в реанимацию для беременных высокого риска.", "th": "เมื่อมีเตียงว่างในห้อง ICU สูติกรรมความเสี่ยงสูง คุณจะถูกย้ายไป", "zh": "一旦高危孕妇重症监护室有床位，将为您转室。"}, "주치의 회진은 오전, 오후 1일 1~2회 이루어집니다.": {"en": "The attending physician makes rounds 1–2 times daily, morning and afternoon.", "vi": "Bác sĩ điều trị thăm khám 1–2 lần mỗi ngày vào buổi sáng và chiều.", "ar": "يقوم الطبيب المعالج بجولة 1-2 مرات يومياً صباحاً ومساءً.", "ru": "Лечащий врач обходит 1–2 раза в день, утром и днём.", "th": "แพทย์ประจำตรวจเยี่ยมวันละ 1–2 ครั้ง ทั้งตอนเช้าและบ่าย", "zh": "主治医生每天上下午各查房1～2次。"}, "면회시간: 평일 18:00~20:00, 보호자 1명만 출입 가능합니다.": {"en": "Visiting hours: Weekdays 18:00–20:00. Only 1 guardian is allowed.", "vi": "Giờ thăm bệnh: Ngày thường 18:00–20:00. Chỉ 1 người thân được vào.", "ar": "ساعات الزيارة: أيام الأسبوع 18:00–20:00. يُسمح بشخص مرافق واحد فقط.", "ru": "Часы посещения: будни 18:00–20:00. Разрешён только 1 сопровождающий.", "th": "เวลาเยี่ยม: วันธรรมดา 18:00–20:00 อนุญาตผู้ดูแล 1 คนเท่านั้น", "zh": "探视时间：平日18:00–20:00，只允许1名家属进入。"}, "아침 07:30, 점심 12:30, 저녁 17:50에 식사가 제공됩니다.": {"en": "Meals are provided at 07:30 (breakfast), 12:30 (lunch), and 17:50 (dinner).", "vi": "Bữa ăn được phục vụ lúc 07:30 (sáng), 12:30 (trưa) và 17:50 (tối).", "ar": "تُقدَّم الوجبات في 07:30 (فطور) و12:30 (غداء) و17:50 (عشاء).", "ru": "Питание в 07:30 (завтрак), 12:30 (обед) и 17:50 (ужин).", "th": "อาหารเสิร์ฟเวลา 07:30 (เช้า), 12:30 (เที่ยง) และ 17:50 (เย็น)", "zh": "餐食时间：早餐07:30，午餐12:30，晚餐17:50。"}, "화재위험이 있는 전열기구 반입 불가, 렌즈·화장·매니큐어·장신구 제거해 주세요.": {"en": "No heating appliances allowed. Please remove contact lenses, makeup, nail polish, and jewelry.", "vi": "Không được mang thiết bị sưởi. Vui lòng tháo kính áp tròng, trang điểm, sơn móng và trang sức.", "ar": "ممنوع إدخال الأجهزة الكهربائية. يرجى إزالة العدسات والمكياج وطلاء الأظافر والمجوهرات.", "ru": "Нагревательные приборы запрещены. Снимите контактные линзы, макияж, лак и украшения.", "th": "ห้ามนำเครื่องทำความร้อน กรุณาถอดคอนแทคเลนส์ เครื่องสำอาง ยาทาเล็บ และเครื่องประดับ", "zh": "禁止携带电热设备，请取下隐形眼镜、卸妆、去除指甲油并摘掉饰品。"}, "태동검사를 할 거예요. 똑바로 누운 자세로 20분 정도 걸립니다.": {"en": "We are going to perform a fetal movement test. The test is done while lying flat on your back and takes about 20 minutes. Do you need to use the restroom?", "vi": "Chúng tôi sẽ kiểm tra cử động thai nhi. Nằm ngửa, khoảng 20 phút.", "ar": "سنجري اختبار حركة الجنين. استلقي على ظهرك — يستغرق حوالي 20 دقيقة.", "ru": "Будем проводить тест движений плода. Лягте на спину — займёт около 20 минут.", "th": "เราจะทำการทดสอบการเคลื่อนไหวของทารก นอนหงาย ประมาณ 20 นาที", "zh": "我们将进行胎动检测，请平躺，大约需要20分钟。"}, "태동이 있을 때 이 버튼을 눌러주세요.": {"en": "Please press this button whenever you feel fetal movement.", "vi": "Vui lòng nhấn nút này khi cảm thấy thai nhi cử động.", "ar": "اضغطي على هذا الزر عند الشعور بحركة الجنين.", "ru": "Нажмите эту кнопку, когда почувствуете движение ребёнка.", "th": "กรุณากดปุ่มนี้เมื่อรู้สึกว่าลูกดิ้น", "zh": "感到胎动时请按此按钮。"}, "배뭉침이 있을 때 복부통증이 있었나요?": {"en": "Did you have abdominal pain when your abdomen tightened?", "vi": "Bạn có đau bụng khi co thắt không?", "ar": "هل شعرتِ بألم في البطن أثناء الانقباضات؟", "ru": "Были ли боли в животе во время схваток?", "th": "เวลาที่ท้องแข็ง คุณมีอาการปวดท้องด้วยไหม?", "zh": "宫缩时有腹痛吗？"}, "초음파 검사 시행할 거예요. 소변 보고 병실 밖으로 나오면 안내해드릴게요.": {"en": "We will do an ultrasound. Please use the restroom first, then come outside your room.", "vi": "Chúng tôi sẽ siêu âm. Vui lòng đi vệ sinh trước rồi ra ngoài phòng.", "ar": "سنجري فحصاً بالموجات فوق الصوتية. اذهبي للحمام أولاً ثم اخرجي من الغرفة.", "ru": "Будем делать УЗИ. Сходите в туалет и выйдите из палаты.", "th": "เราจะทำอัลตราซาวนด์ กรุณาเข้าห้องน้ำก่อนแล้วออกมารอหน้าห้อง", "zh": "我们将进行超声检查，请先上厕所，然后出到病房外。"}, "누워 계시면 선생님이 와서 봐주십니다. 기다려주세요.": {"en": "Please lie down and wait. The doctor will come to you.", "vi": "Vui lòng nằm xuống và chờ. Bác sĩ sẽ đến khám.", "ar": "استلقي وانتظري. سيأتي الطبيب إليك.", "ru": "Лягте и подождите. Врач придёт к вам.", "th": "กรุณานอนรอ แพทย์จะมาตรวจคุณ", "zh": "请躺下等候，医生会来找您。"}, "피검사를 시행하겠습니다.": {"en": "We are going to draw blood for a blood test.", "vi": "Chúng tôi sẽ lấy máu xét nghiệm.", "ar": "سنأخذ عينة دم للفحص.", "ru": "Будем брать кровь на анализ.", "th": "เราจะเจาะเลือดเพื่อตรวจ", "zh": "我们要为您抽血化验。"}, "주사 없는 팔에서 시행하겠습니다.": {"en": "We will use the arm without an IV line.", "vi": "Chúng tôi sẽ lấy từ cánh tay không có IV.", "ar": "سنأخذ العينة من الذراع غير المتصلة بالمحلول الوريدي.", "ru": "Возьмём из руки без капельницы.", "th": "เราจะใช้แขนที่ไม่มีสาย IV", "zh": "我们将从没有静脉注射的手臂采血。"}, "소변검사를 시행하겠습니다.": {"en": "We are going to collect a urine sample.", "vi": "Chúng tôi sẽ lấy mẫu nước tiểu.", "ar": "سنأخذ عينة بول.", "ru": "Будем собирать анализ мочи.", "th": "เราจะเก็บตัวอย่างปัสสาวะ", "zh": "我们要采集尿液样本。"}, "소변 보기 전 소독솜으로 요도 부위를 소독해주세요.": {"en": "Before urinating, please clean the urethral area with the disinfectant wipe.", "vi": "Trước khi đi tiểu, vui lòng lau vùng niệu đạo bằng gạc khử trùng.", "ar": "قبل التبول، نظفي منطقة مجرى البول بمسحة مطهرة.", "ru": "Перед мочеиспусканием протрите область уретры дезинфицирующей салфеткой.", "th": "ก่อนปัสสาวะ กรุณาเช็ดบริเวณท่อปัสสาวะด้วยผ้าฆ่าเชื้อ", "zh": "排尿前请用消毒棉片清洁尿道区域。"}, "첫 소변은 버리고, 중간 소변을 종이컵에 받아주시면 됩니다.": {"en": "Discard the first stream, then collect the midstream urine in the paper cup.", "vi": "Vui lòng bỏ phần đầu và lấy phần giữa vào cốc giấy.", "ar": "تخلصي من الجزء الأول من البول، ثم اجمعي عينة من منتصف البول في الكوب الورقي.", "ru": "Первую порцию вылейте, среднюю соберите в бумажный стакан.", "th": "ทิ้งปัสสาวะส่วนแรก แล้วเก็บส่วนกลางในถ้วยกระดาษ", "zh": "丢弃初段尿，将中段尿收集在纸杯中。"}, "파란뚜껑이 있는 통에 옮겨 담아서 통만 저에게 주세요.": {"en": "Transfer the urine to the blue-lid container and give me just the container.", "vi": "Vui lòng chuyển nước tiểu vào hộp nắp xanh và đưa hộp cho tôi.", "ar": "انقلي البول إلى الوعاء ذي الغطاء الأزرق وأعطيني الوعاء فقط.", "ru": "Перелейте мочу в контейнер с синей крышкой и отдайте мне только контейнер.", "th": "เทปัสสาวะลงในภาชนะฝาสีน้ำเงินแล้วส่งภาชนะให้ฉัน", "zh": "将尿液转入蓝色瓶盖的容器中，只把容器交给我。"}, "심전도 검사를 시행하겠습니다.": {"en": "We are going to perform an ECG.", "vi": "Chúng tôi sẽ thực hiện điện tâm đồ.", "ar": "سنجري تخطيط القلب الكهربائي.", "ru": "Будем проводить ЭКГ.", "th": "เราจะทำการตรวจคลื่นไฟฟ้าหัวใจ", "zh": "我们要为您做心电图检查。"}, "검사 중 움직이지 말고, 말을 하지 말아주세요. 상의를 벗어야 합니다.": {"en": "Please do not move or speak during the test. You will need to remove your top.", "vi": "Vui lòng không cử động hay nói chuyện trong khi kiểm tra. Cần cởi áo trên.", "ar": "لا تتحركي أو تتكلمي أثناء الفحص. ستحتاجين لخلع الجزء العلوي.", "ru": "Не двигайтесь и не говорите во время процедуры. Нужно снять верх.", "th": "อย่าขยับหรือพูดระหว่างการตรวจ กรุณาถอดเสื้อด้านบน", "zh": "检查期间请勿移动或说话，需要脱去上衣。"}, "흉부엑스레이 검사를 시행하겠습니다.": {"en": "We are going to take a chest X-ray.", "vi": "Chúng tôi sẽ chụp X-quang ngực.", "ar": "سنجري صورة أشعة سينية للصدر.", "ru": "Будем делать рентген грудной клетки.", "th": "เราจะทำการเอกซเรย์ทรวงอก", "zh": "我们要为您拍胸部X光片。"}, "목걸이, 귀걸이, 속옷은 제거해주세요.": {"en": "Please remove your necklace, earrings, and bra.", "vi": "Vui lòng tháo vòng cổ, bông tai và áo ngực.", "ar": "يرجى إزالة العقد والأقراط والحمالة.", "ru": "Снимите ожерелье, серьги и бюстгальтер.", "th": "กรุณาถอดสร้อยคอ ต่างหู และชุดชั้นใน", "zh": "请取下项链、耳环和内衣。"}, "배는 가리고 찍어서 태아에게 문제가 되지 않습니다.": {"en": "Your abdomen will be shielded, so it is safe for your baby.", "vi": "Bụng sẽ được che chắn nên không ảnh hưởng đến thai nhi.", "ar": "سيتم تغطية البطن لذا فهو آمن للجنين.", "ru": "Живот будет защищён, поэтому это безопасно для ребёнка.", "th": "ท้องจะถูกป้องกัน จึงปลอดภัยสำหรับทารก", "zh": "腹部会有遮挡保护，对胎儿安全。"}, "자궁수축을 줄여주는 주사약입니다.": {"en": "This is an injection to reduce uterine contractions.", "vi": "Đây là thuốc tiêm để giảm co thắt tử cung.", "ar": "هذا دواء يُحقن لتقليل انقباضات الرحم.", "ru": "Это инъекция для снижения маточных сокращений.", "th": "นี่คือยาฉีดเพื่อลดการหดตัวของมดลูก", "zh": "这是减少子宫收缩的注射药物。"}, "투약 후 1시간 후에 자궁수축 모니터링을 시행합니다.": {"en": "Uterine contraction monitoring will be done one hour after administration.", "vi": "Sẽ theo dõi co thắt tử cung 1 giờ sau khi tiêm.", "ar": "سيتم مراقبة انقباضات الرحم بعد ساعة من بدء التسريب.", "ru": "Маточные сокращения будут контролироваться через 1 час после инъекции.", "th": "จะติดตามการหดตัวของมดลูก 1 ชั่วโมงหลังการฉีดยา", "zh": "给药1小时后，我们将监测子宫收缩情况。"}, "부작용: 가슴두근거림, 맥박 상승이 있을 수 있으므로 불편감이 있을 시 콜벨을 눌러주세요.": {"en": "Side effects may include palpitations and an increased pulse, so please press the call bell if you feel uncomfortable.", "vi": "Tác dụng phụ: đánh trống ngực, tăng nhịp tim. Vui lòng nhấn chuông nếu khó chịu.", "ar": "الآثار الجانبية: خفقان وارتفاع معدل ضربات القلب. اضغطي الجرس إذا شعرتِ بعدم ارتياح.", "ru": "Побочные эффекты: сердцебиение, учащённый пульс. Нажмите кнопку вызова при дискомфорте.", "th": "ผลข้างเคียงอาจมีอาการใจสั่น หรืออัตราการเต้นของหัวใจเพิ่มขึ้น หากรู้สึกไม่สบาย กรุณากดกริ่งเรียกพยาบาล", "zh": "可能出现心悸、心率加快等副作用，如有不适请按呼叫铃。"}, "자궁수축을 줄여주는 주사제입니다.": {"en": "This injection reduces uterine contractions.", "vi": "Thuốc tiêm này giảm co thắt tử cung.", "ar": "هذا الحقن يقلل انقباضات الرحم.", "ru": "Этот препарат снижает маточные сокращения.", "th": "ยาฉีดนี้ลดการหดตัวของมดลูก", "zh": "此注射剂可减少子宫收缩。"}, "주입 초기에는 얼굴 열감, 주사 부위 불편감이 있을 수 있습니다.": {"en": "At the beginning of the infusion, you may feel facial flushing or discomfort at the injection site, so please press the call bell if you feel uncomfortable.", "vi": "Ban đầu có thể cảm thấy nóng mặt hoặc khó chịu tại chỗ tiêm.", "ar": "قد تشعرين في البداية بحرارة في الوجه أو انزعاج في موضع الحقن.", "ru": "Вначале возможны приливы жара к лицу или дискомфорт в месте инъекции.", "th": "อาจรู้สึกร้อนที่ใบหน้าหรือไม่สบายที่บริเวณฉีดยาในช่วงแรก", "zh": "初期可能出现面部潮热或注射部位不适。"}, "주입 시작 4시간 이후에 마그네슘 농도 확인을 위해 피검사를 시행합니다.": {"en": "A blood test will be done 4 hours after infusion starts to check magnesium levels.", "vi": "Xét nghiệm máu sẽ được thực hiện 4 giờ sau khi bắt đầu truyền để kiểm tra nồng độ magiê.", "ar": "سيُجرى فحص دم بعد 4 ساعات من بدء التسريب للتحقق من مستويات المغنيسيوم.", "ru": "Анализ крови на уровень магния будет проведён через 4 часа после начала инфузии.", "th": "จะทำการตรวจเลือดเพื่อตรวจระดับแมกนีเซียม 4 ชั่วโมงหลังเริ่มการให้สารน้ำ", "zh": "开始输注4小时后将进行血液检测以检查镁浓度。"}, "자궁수축을 감소시키는 약으로 특별한 부작용은 없습니다.": {"en": "This medication reduces contractions with no significant side effects.", "vi": "Thuốc này giảm co thắt và không có tác dụng phụ đáng kể.", "ar": "هذا الدواء يقلل انقباضات الرحم ولا توجد له آثار جانبية تُذكر.", "ru": "Этот препарат снижает сокращения, значимых побочных эффектов нет.", "th": "ยานี้ลดการหดตัวโดยไม่มีผลข้างเคียงที่สำคัญ", "zh": "此药可减少宫缩，无明显副作用。"}, "자궁수축을 감소시키는 경구약으로 혈압저하가 있을 수 있어 어지러움 증상이 있을 경우 즉시 알리도록 합니다.": {"en": "This oral medication reduces contractions. It may lower blood pressure — notify us immediately if dizzy.", "vi": "Thuốc uống này giảm co thắt. Có thể hạ huyết áp — báo ngay nếu chóng mặt.", "ar": "هذا دواء فموي يقلل انقباضات الرحم. قد يسبب انخفاضاً في ضغط الدم، لذا أبلغي فوراً إذا شعرتِ بالدوار.", "ru": "Таблетки снижают сокращения. Возможно снижение давления — немедленно сообщите, если кружится голова.", "th": "ยาเม็ดนี้ลดการหดตัว อาจทำให้ความดันต่ำ แจ้งทันทีหากรู้สึกเวียนหัว", "zh": "此口服药可减少宫缩，可能导致血压下降，如有头晕请立即通知。"}, "자궁수축을 유발하는 주사제로 유도분만이나 분만 후 질출혈이 있을 경우 사용합니다.": {"en": "This injection induces contractions, used for labor induction or postpartum vaginal bleeding.", "vi": "Thuốc tiêm này gây co thắt, dùng cho khởi phát chuyển dạ hoặc chảy máu sau sinh.", "ar": "هذا الحقن يحفز الانقباضات، يُستخدم لتحريض المخاض أو النزيف المهبلي بعد الولادة.", "ru": "Препарат вызывает сокращения — применяется для индукции родов или при послеродовом кровотечении.", "th": "ยาฉีดนี้กระตุ้นการหดตัว ใช้สำหรับการชักนำการคลอดหรือเลือดออกทางช่องคลอดหลังคลอด", "zh": "此注射剂可诱发宫缩，用于引产或产后阴道出血。"}, "사용할 항생제에 알러지 반응 유무를 확인하는 검사로 팔 안쪽에 소량의 약물을 주입하는 검사입니다.": {"en": "This test checks for antibiotic allergy by injecting a small amount into the inner arm.", "vi": "Kiểm tra dị ứng kháng sinh bằng cách tiêm một lượng nhỏ vào mặt trong cánh tay.", "ar": "اختبار لتحديد الحساسية للمضاد الحيوي بحقن كمية صغيرة في الجزء الداخلي من الذراع.", "ru": "Тест на аллергию к антибиотику: небольшое количество вводится во внутреннюю поверхность руки.", "th": "ทดสอบการแพ้ยาปฏิชีวนะโดยฉีดยาจำนวนเล็กน้อยที่ด้านในของแขน", "zh": "通过在手臂内侧注射少量药物来检测抗生素过敏反应。"}, "조산의 가능성이 있는 경우 태어날 아기의 폐성숙을 도와주는 약으로 엉덩이 근육에 하루에 한번 총 2일 동안 투여합니다.": {"en": "If preterm birth is possible, this injection matures the baby's lungs — given once daily for 2 days in the buttock.", "vi": "Nếu có nguy cơ sinh non, thuốc này giúp phổi bé trưởng thành — tiêm bắp mông 1 lần/ngày trong 2 ngày.", "ar": "إذا كانت الولادة المبكرة محتملة، يساعد هذا الحقن على نضوج رئتي الطفل. يُحقن في عضلة الأرداف مرة يومياً لمدة يومين.", "ru": "При риске преждевременных родов препарат ускоряет созревание лёгких — вводится в ягодицу раз в день 2 дня.", "th": "หากมีความเสี่ยงคลอดก่อนกำหนด ยานี้ช่วยพัฒนาปอดทารก ฉีดที่กล้ามเนื้อสะโพกวันละครั้ง 2 วัน", "zh": "如有早产风险，此药可促进胎儿肺成熟，每天在臀部肌肉注射一次，共注射2天。"}, "아침식사 전에 소변본 뒤 체중을 재주세요.": {"en": "Please weigh yourself after urinating, before breakfast.", "vi": "Vui lòng cân sau khi đi tiểu, trước bữa sáng.", "ar": "زني وزنك بعد التبول وقبل الإفطار.", "ru": "Взвеситесь после мочеиспускания, до завтрака.", "th": "กรุณาชั่งน้ำหนักหลังปัสสาวะก่อนอาหารเช้า", "zh": "请在排尿后、早餐前称体重。"}, "배뭉침이 있나요?": {"en": "Are you having contractions?", "vi": "Bạn có cảm thấy co thắt không?", "ar": "هل تشعرين بانقباضات؟", "ru": "Есть ли схватки?", "th": "คุณมีอาการเจ็บครรภ์ไหม?", "zh": "您有宫缩吗？"}, "복부통증이 있나요?": {"en": "Do you have abdominal pain?", "vi": "Bạn có đau bụng không?", "ar": "هل تشعرين بألم في البطن؟", "ru": "Есть ли боли в животе?", "th": "คุณมีอาการปวดท้องไหม?", "zh": "您有腹痛吗？"}, "태동 있나요?": {"en": "Are you feeling the baby move?", "vi": "Bạn có cảm nhận thai nhi cử động không?", "ar": "هل تشعرين بحركة الجنين؟", "ru": "Чувствуете движение ребёнка?", "th": "คุณรู้สึกว่าลูกดิ้นไหม?", "zh": "您感到胎动吗？"}, "불편하면 콜벨을 눌러주세요.": {"en": "If uncomfortable, please press the call bell.", "vi": "Nếu khó chịu, hãy nhấn chuông gọi y tá.", "ar": "إذا شعرتِ بعدم ارتياح، اضغطي جرس الاستدعاء.", "ru": "При дискомфорте нажмите кнопку вызова.", "th": "ถ้ารู้สึกไม่สบาย กรุณากดกริ่งเรียกพยาบาล", "zh": "如有不适请按呼叫铃。"}, "통증이 어떻게 되세요? 0은 통증 없음, 10은 극심한 통증입니다.": {"en": "How is your pain? 0 = no pain, 10 = worst pain possible.", "vi": "Mức độ đau của bạn? 0 = không đau, 10 = đau nhất.", "ar": "ما درجة الألم لديكِ؟ 0 = لا ألم، 10 = أشد ألم يمكن تخيله.", "ru": "Какова ваша боль? 0 = нет боли, 10 = сильнейшая боль.", "th": "ความเจ็บปวดของคุณเป็นอย่างไร? 0 = ไม่เจ็บ, 10 = เจ็บมากที่สุด", "zh": "您的疼痛程度如何？0=无痛，10=最剧烈的疼痛。"}, "두통, 상복부통증, 시야흐림이 있나요?": {"en": "Do you have a headache, upper abdominal pain, or blurred vision?", "vi": "Bạn có đau đầu, đau bụng trên hoặc mờ mắt không?", "ar": "هل تعانين من صداع أو ألم في البطن العلوي أو ضبابية في الرؤية؟", "ru": "Есть ли головная боль, боль в верхней части живота или нарушение зрения?", "th": "คุณมีอาการปวดหัว ปวดท้องส่วนบน หรือตามัวไหม?", "zh": "您有头痛、上腹痛或视力模糊吗？"}, "양수색은 원래 무색입니다. 색의 변화(빨강, 녹색 등)가 있으면 바로 말해주세요.": {"en": "Amniotic fluid is normally clear. Tell us immediately if you notice any color change (red, green, etc.).", "vi": "Nước ối bình thường không màu. Xin vui lòng báo ngay nếu có thay đổi màu (đỏ, xanh, v.v.).", "ar": "السائل الأمنيوسي شفاف طبيعياً. أبلغي فوراً إذا لاحظتِ أي تغير في اللون (مثل الأحمر أو الأخضر).", "ru": "Амниотическая жидкость в норме бесцветная. Если появится изменение цвета (красный, зелёный и т.д.), немедленно сообщите об этом.", "th": "น้ำคร่ำปกติจะไม่มีสี แจ้งทันทีหากสีเปลี่ยน (แดง เขียว ฯลฯ)", "zh": "羊水正常为无色，如发现颜色变化（红色、绿色等）请立即告知。"}, "30분 이내에 pad 1장이 젖을 정도의 출혈이나 덩어리로 질출혈이 있으면 바로 말해주세요.": {"en": "Tell us immediately if a pad becomes soaked within 30 minutes or if you pass blood clots.", "vi": "Xin vui lòng báo ngay nếu một miếng lót thấm đẫm trong 30 phút hoặc có cục máu.", "ar": "أبلغي فوراً إذا حدث نزيف مهبلي يبلل فوطة كاملة خلال 30 دقيقة أو إذا خرجت جلطات دموية.", "ru": "Немедленно сообщите, если прокладка промокает за 30 минут или выходят сгустки крови.", "th": "แจ้งทันทีหากผ้าอนามัยเปียกภายใน 30 นาที หรือมีก้อนเลือดออก", "zh": "如果30分钟内卫生巾完全湿透或排出血块，请立即告知。"}, "투약 후 불편한 점은 없나요?": {"en": "Any discomfort after the medication?", "vi": "Có khó chịu gì sau khi dùng thuốc không?", "ar": "هل تشعرين بأي انزعاج بعد الدواء؟", "ru": "Есть ли дискомфорт после приёма лекарства?", "th": "มีความไม่สบายหลังจากใช้ยาไหม?", "zh": "用药后有任何不适吗？"}, "진통, 출산, 회복을 할 수 있는 가족분만실 사용을 원하시나요? 출생 당일만 입원료가 10만원입니다. 사용하신다면 동의서 서명 부탁드립니다.": {"en": "Would you like to use the Family Delivery Room (for labor, delivery, and recovery)? There is an additional fee of 100,000 KRW on the day of delivery. If so, please sign the consent form.", "vi": "Bạn có muốn sử dụng Phòng sinh gia đình (cho chuyển dạ, sinh và hồi phục)? Phí thêm 100.000 won vào ngày sinh. Nếu có, vui lòng ký giấy đồng ý.", "ar": "هل ترغبين في استخدام غرفة الولادة العائلية (للمخاض والولادة والتعافي)؟ توجد رسوم إضافية قدرها 100,000 وون في يوم الولادة فقط. إذا رغبتِ في استخدامها، يرجى التوقيع على نموذج الموافقة.", "ru": "Хотите использовать семейную родильную палату? Дополнительная плата 100 000 вон в день родов. Пожалуйста, подпишите согласие.", "th": "คุณต้องการใช้ห้องคลอดครอบครัวไหม? ค่าเพิ่มเติม 100,000 วอนในวันคลอด ถ้าต้องการกรุณาเซ็นใบยินยอม", "zh": "您是否想使用家庭分娩室（用于分娩、生产和恢复）？分娩当天额外收费100,000韩元，如需使用请签署同意书。"}, "보호자는 내일 보호자 출입증을 발급 받고 7층 분만실로 오시면 됩니다. 제가 내일 아침에 문자 보내드릴게요.": {"en": "Your guardian should obtain a visitor pass tomorrow and come to the delivery ward on the 7th floor. I will send a text message tomorrow morning.", "vi": "Người thân cần lấy thẻ ra vào vào ngày mai và đến khu sinh tầng 7. Tôi sẽ nhắn tin vào sáng mai.", "ar": "يجب على المرافق الحصول على تصريح الدخول غداً والقدوم إلى جناح الولادة في الطابق السابع. سأرسل رسالة نصية صباح الغد.", "ru": "Сопровождающий должен получить пропуск завтра и прийти в родильное отделение на 7-м этаже. Завтра утром пришлю сообщение.", "th": "ผู้ดูแลควรรับบัตรผ่านพรุ่งนี้และมาที่หอผู้ป่วยคลอดชั้น 7 ฉันจะส่งข้อความในเช้าวันพรุ่งนี้", "zh": "家属明天领取探视证后请来7楼分娩室，我明天早上会发短信通知。"}, "제대혈 있으신가요?": {"en": "Do you have a cord blood banking kit?", "vi": "Bạn có bộ kit lưu trữ máu cuống rốn không?", "ar": "هل لديكِ خدمة حفظ دم الحبل السري؟", "ru": "Есть ли у вас набор для банкирования пуповинной крови?", "th": "คุณมีชุดเก็บเลือดจากสายสะดือไหม?", "zh": "您有脐带血储存套装吗？"}, "항생제 반응검사, 회음부 부위 면도 시행 예정입니다.": {"en": "An antibiotic skin test and perineal shaving will be performed.", "vi": "Sẽ thực hiện kiểm tra dị ứng kháng sinh và cạo lông vùng đáy chậu.", "ar": "سيتم إجراء اختبار جلدي للمضادات الحيوية وحلاقة منطقة العجان.", "ru": "Будет проведён кожный тест на антибиотик и бритьё промежности.", "th": "จะทำการทดสอบผิวหนังสำหรับยาปฏิชีวนะและโกนขนบริเวณฝีเย็บ", "zh": "将进行抗生素皮试和会阴部剃毛。"}, "무통주사를 원하시나요? 원하시면 무통주사도 삽입할 예정입니다.": {"en": "Would you like an epidural? If so, we will administer it.", "vi": "Bạn có muốn gây tê ngoài màng cứng không? Nếu có, chúng tôi sẽ thực hiện.", "ar": "هل ترغبين في التخدير فوق الجافية؟ إذا رغبتِ بذلك، فسنقوم بإجرائه.", "ru": "Хотите эпидуральную анестезию? Если да, мы её сделаем.", "th": "คุณต้องการยาระงับปวดฉีดไหม? ถ้าต้องการเราจะดำเนินการ", "zh": "您需要无痛分娩（硬膜外麻醉）吗？如需要我们将为您实施。"}, "내진 시행 후, 자궁경부를 부드럽게 해주는 질정을 삽입할 예정입니다.": {"en": "After the pelvic exam, we will insert a vaginal suppository to help soften the cervix.", "vi": "Sau khi khám âm đạo, chúng tôi sẽ đặt viên đặt âm đạo để làm mềm cổ tử cung.", "ar": "بعد الفحص الداخلي، سنضع تحميلة مهبلية لتليين عنق الرحم.", "ru": "После внутреннего осмотра введём вагинальный суппозиторий для размягчения шейки матки.", "th": "หลังการตรวจภายใน จะใส่ยาเหน็บทางช่องคลอดเพื่อทำให้ปากมดลูกนุ่ม", "zh": "内诊后，将插入阴道栓剂以软化宫颈。"}, "밤 12시부터 물 포함해서 금식해주세요.": {"en": "Please fast from midnight, including water.", "vi": "Nhịn ăn uống từ nửa đêm, kể cả nước.", "ar": "الرجاء الامتناع عن الطعام والشراب بما في ذلك الماء من منتصف الليل.", "ru": "С полуночи ничего не есть и не пить, включая воду.", "th": "กรุณางดอาหารและน้ำตั้งแต่เที่ยงคืน รวมถึงน้ำเปล่า", "zh": "请从午夜起禁食禁水，包括水在内。"}, "내일 5시에 자궁 수축 검사 및 내진을 할 것입니다. 이후 관장을 시행 예정입니다.": {"en": "At 5 AM tomorrow, we will perform a contraction test and internal exam, followed by an enema.", "vi": "Vào 5 giờ sáng mai, chúng tôi sẽ kiểm tra co thắt và khám âm đạo, sau đó thụt tháo.", "ar": "في الساعة 5 صباح الغد، سنجري اختبار انقباضات وفحصاً داخلياً، يتبعه حقنة شرجية.", "ru": "Завтра в 5:00 проведём тест на сокращения и внутренний осмотр, затем клизму.", "th": "เช้าพรุ่งนี้ 5 โมง จะทำการทดสอบการหดตัวและตรวจภายใน จากนั้นสวนอุจจาระ", "zh": "明天5点将进行宫缩检测和内诊，之后进行灌肠。"}, "자궁 수축제를 정맥주사로 주입 시작하겠습니다. 주입 속도를 20분-30분 간격으로 증량할 예정입니다.": {"en": "We will start administering a uterine contraction agent by IV. The infusion rate will be increased every 20–30 minutes.", "vi": "Chúng tôi sẽ bắt đầu truyền tĩnh mạch thuốc co thắt tử cung. Tốc độ truyền sẽ tăng dần mỗi 20–30 phút.", "ar": "سنبدأ إعطاء عامل انقباض الرحم عبر الوريد. سيزيد معدل التسريب كل 20–30 دقيقة.", "ru": "Начнём внутривенное введение утеротонического препарата. Скорость будет увеличиваться каждые 20–30 минут.", "th": "เราจะเริ่มให้ยากระตุ้นการหดตัวของมดลูกทางหลอดเลือดดำ อัตราการให้จะเพิ่มทุก 20–30 นาที", "zh": "我们将开始静脉注射子宫收缩剂，每20–30分钟增加一次输注速度。"}, "분만 진행 동안 내진을 자주 시행 할 것입니다. 팬티를 벗고 있으세요.": {"en": "Internal exams will be performed frequently during labor. Please remove your underwear.", "vi": "Sẽ thực hiện khám âm đạo thường xuyên trong quá trình chuyển dạ. Vui lòng tháo quần lót.", "ar": "سيتم إجراء فحوصات داخلية متكررة أثناء المخاض. يرجى خلع الملابس الداخلية.", "ru": "Во время родов будут часто проводиться внутренние осмотры. Снимите нижнее бельё.", "th": "จะทำการตรวจภายในบ่อยครั้งระหว่างการคลอด กรุณาถอดกางเกงชั้นใน", "zh": "分娩过程中将频繁进行内诊，请脱去内裤。"}, "양수 흐르는 느낌, 대변 마려운 느낌, 진통 증가 시 콜벨 누르세요.": {"en": "Press the call bell if you feel amniotic fluid leaking, feel the urge to defecate, or if contractions increase.", "vi": "Vui lòng nhấn chuông nếu cảm thấy nước ối chảy, buồn đại tiện hoặc cơn đau tăng.", "ar": "اضغطي الجرس إذا شعرتِ بتسرب السائل الأمنيوسي أو رغبة في التبرز أو زيادة الانقباضات.", "ru": "Нажмите кнопку, если чувствуете вытекание вод, позыв к дефекации или усиление схваток.", "th": "กดกริ่งหากรู้สึกน้ำคร่ำไหล อยากถ่าย หรือเจ็บครรภ์มากขึ้น", "zh": "如感到羊水流出、想排便或阵痛加剧，请按呼叫铃。"}, "태아에게 산소공급을 위해 산소마스크를 해드릴게요.": {"en": "We will place an oxygen mask on you to supply oxygen to the baby.", "vi": "Chúng tôi sẽ đeo mặt nạ oxy cho bạn để cung cấp oxy cho bé.", "ar": "سنضع قناع الأكسجين لتزويد الجنين بالأكسجين.", "ru": "Мы наденем кислородную маску для подачи кислорода ребёнку.", "th": "เราจะสวมหน้ากากออกซิเจนให้คุณเพื่อส่งออกซิเจนให้ทารก", "zh": "我们将为您戴上氧气面罩以向胎儿供氧。"}, "자궁수축이 있을 때 들이쉬고 내쉬고 심호흡 하세요. -> 3초 동안 코로 들이마시고, 3초간 입으로 내쉬세요.": {"en": "When you have a contraction, breathe deeply in and out. → Inhale through your nose for 3 seconds, exhale through your mouth for 3 seconds.", "vi": "Khi có cơn co, hít thở sâu vào và ra. → Hít vào bằng mũi 3 giây, thở ra bằng miệng 3 giây.", "ar": "عند الانقباضات، خذي شهيقاً وزفيراً عميقين. استنشقي من الأنف لمدة 3 ثوانٍ، ثم أخرجي الزفير من الفم لمدة 3 ثوانٍ.", "ru": "При схватке дышите глубоко. → Вдох через нос 3 секунды, выдох через рот 3 секунды.", "th": "เมื่อมีการหดตัว ให้หายใจเข้าออกลึกๆ → หายใจเข้าทางจมูก 3 วินาที หายใจออกทางปาก 3 วินาที", "zh": "宫缩时请深呼吸：用鼻子吸气3秒，用嘴呼气3秒。"}, "힘주기 설명 첨부 -> 배가 뭉치면 깊게 호흡 두 번한 후 숨을 참고 10초 동안 길게 대변보듯이 힘주세요.": {"en": "Pushing instructions: When you feel a contraction, take two deep breaths, hold, then push hard for 10 seconds as if having a bowel movement.", "vi": "Hướng dẫn rặn: Khi co thắt, hít sâu hai lần, nín thở rồi rặn mạnh 10 giây như khi đại tiện.", "ar": "تعليمات الدفع: عند الانقباض، خذي نفسين عميقين، احبسي النفس ثم ادفعي بقوة 10 ثوانٍ كما لو كنتِ تتبرزين.", "ru": "Инструкция по потугам: при схватке два глубоких вдоха, задержите дыхание и тужьтесь 10 секунд как при дефекации.", "th": "วิธีเบ่ง: เมื่อมีการหดตัว หายใจลึก 2 ครั้ง กลั้นหายใจแล้วเบ่งแรง 10 วินาทีเหมือนถ่ายอุจจาระ", "zh": "用力说明：宫缩时深呼吸两次，屏气后像排便一样用力10秒。"}, "아기 만출시> 힘주지 말고 짧게 짧게 호흡하세요. 저를 따라서 호흡하세요.": {"en": "As the baby is coming out, stop pushing and take short, quick breaths. Follow my breathing.", "vi": "Khi bé ra: ngừng rặn và thở ngắn nhanh. Vui lòng thở theo tôi.", "ar": "عند خروج الطفل: لا تدفعي، وتنفسي بأنفاس قصيرة وسريعة. اتبعي تنفسي.", "ru": "При рождении ребёнка: не тужьтесь, дышите короткими частыми вдохами. Дышите за мной.", "th": "เมื่อทารกออก หยุดเบ่งและหายใจสั้นๆ เร็วๆ หายใจตามฉัน", "zh": "胎儿娩出时：停止用力，做短促呼吸，跟着我一起呼吸。"}, "2시간 동안 금식 유지해주세요.": {"en": "Please fast for 2 hours.", "vi": "Vui lòng nhịn ăn trong 2 giờ.", "ar": "الرجاء الصيام لمدة ساعتين.", "ru": "Пожалуйста, не ешьте и не пейте 2 часа.", "th": "กรุณางดอาหารและน้ำ 2 ชั่วโมง", "zh": "请禁食2小时。"}, "분만 후 4시간 이내로 소변 보셔야합니다. 화장실 가고 싶으면 콜벨 누르세요.": {"en": "You must urinate within 4 hours after delivery. Press the call bell when you need to use the restroom.", "vi": "Bạn phải đi tiểu trong vòng 4 giờ sau sinh. Vui lòng nhấn chuông khi cần đi vệ sinh.", "ar": "يجب التبول خلال 4 ساعات من الولادة. اضغطي الجرس عند الحاجة للحمام.", "ru": "Необходимо помочиться в течение 4 часов после родов. Нажмите кнопку, когда нужно в туалет.", "th": "ต้องปัสสาวะภายใน 4 ชั่วโมงหลังคลอด กดกริ่งเมื่อต้องการไปห้องน้ำ", "zh": "分娩后4小时内必须排尿，需要上厕所时请按呼叫铃。"}, "오로가 나오는 것은 정상입니다. 피덩어리가 나오거나, 계속 피가 흐르는 느낌이 있으면 콜벨 누르세요.": {"en": "Postpartum discharge (lochia) is normal. Press the call bell if you pass blood clots or feel continuous bleeding.", "vi": "Dịch hậu sản là bình thường. Vui lòng nhấn chuông nếu có cục máu hoặc cảm thấy chảy máu liên tục.", "ar": "الإفرازات النفاسية طبيعية. اضغطي الجرس إذا خرجت جلطات أو شعرتِ بنزيف مستمر.", "ru": "Послеродовые выделения (лохии) — это нормально. Нажмите кнопку при сгустках или непрерывном кровотечении.", "th": "น้ำคาวปลาเป็นเรื่องปกติ กดกริ่งหากมีก้อนเลือดหรือรู้สึกเลือดไหลต่อเนื่อง", "zh": "恶露是正常现象，如排出血块或感到持续出血请按呼叫铃。"}, "2시간 동안 지켜보고, 괜찮으면 일반병동 퇴실 예정입니다.": {"en": "We will monitor you for 2 hours, and if all is well, you will be transferred to the general ward.", "vi": "Chúng tôi sẽ theo dõi 2 giờ, nếu ổn sẽ chuyển về khoa thường.", "ar": "سنراقبك لمدة ساعتين، وإذا كان كل شيء على ما يرام ستُنقلين إلى الجناح العام.", "ru": "Понаблюдаем 2 часа, и при всём в порядке переведём в общую палату.", "th": "จะเฝ้าดูคุณ 2 ชั่วโมง ถ้าทุกอย่างปกติจะย้ายไปหอผู้ป่วยทั่วไป", "zh": "观察2小时，如无异常将转至普通病房。"}, "퇴원 할 때까지, 자궁 저부를 자주 확인 할 예정입니다.": {"en": "We will frequently check your uterine fundus until discharge.", "vi": "Chúng tôi sẽ kiểm tra đáy tử cung thường xuyên cho đến khi xuất viện.", "ar": "سنتحقق من قاع الرحم بشكل متكرر حتى الخروج.", "ru": "Будем регулярно проверять дно матки до выписки.", "th": "จะตรวจยอดมดลูกบ่อยๆ จนกว่าจะออกจากโรงพยาบาล", "zh": "直到出院前将定期检查子宫底部。"}, "병동 퇴실하시면, 좌욕 하세요.": {"en": "Once you are transferred to the ward, please take a sitz bath.", "vi": "Khi chuyển về khoa, vui lòng ngâm bồn.", "ar": "عند انتقالك إلى الجناح، يرجى عمل حمام المقعدة.", "ru": "При переводе в палату принимайте сидячую ванну.", "th": "เมื่อย้ายไปหอผู้ป่วย กรุณาแช่น้ำนั่ง", "zh": "转至病房后请进行坐浴。"}, "물을 포함하여 아무것도 먹지마세요.": {"en": "Do not eat or drink anything, including water.", "vi": "Không ăn uống bất cứ thứ gì, kể cả nước.", "ar": "لا تأكلي أو تشربي أي شيء بما في ذلك الماء.", "ru": "Ничего не ешьте и не пейте, включая воду.", "th": "อย่ากินหรือดื่มอะไรทั้งนั้น รวมถึงน้ำเปล่า", "zh": "请勿进食或饮水，包括水在内。"}, "흔들리는 치아, 임플란트, 교정기가 있나요?": {"en": "Do you have any loose teeth, dental implants, or braces?", "vi": "Bạn có răng lung lay, implant hoặc niềng răng không?", "ar": "هل لديك أسنان متحركة أو زرعات أسنان أو تقويم؟", "ru": "Есть ли шатающиеся зубы, импланты или брекеты?", "th": "คุณมีฟันโยก ฟันปลอม หรือเหล็กจัดฟันไหม?", "zh": "您是否有松动的牙齿、牙齿种植体或牙套？"}, "안경이나 렌즈 착용하나요?": {"en": "Do you wear glasses or contact lenses?", "vi": "Bạn đeo kính hay kính áp tròng không?", "ar": "هل تلبسين نظارات أو عدسات لاصقة؟", "ru": "Носите ли очки или контактные линзы?", "th": "คุณสวมแว่นตาหรือคอนแทคเลนส์ไหม?", "zh": "您是否佩戴眼镜或隐形眼镜？"}, "귀걸이, 목걸이, 반지 등의 장신구를 착용하고 있나요?": {"en": "Are you wearing any earrings, necklaces, rings, or other jewelry?", "vi": "Bạn có đang đeo khuyên tai, vòng cổ, nhẫn hay trang sức nào không?", "ar": "هل ترتدين أقراطاً أو قلائد أو خواتم أو مجوهرات أخرى؟", "ru": "Есть ли на вас серьги, цепочки, кольца или другие украшения?", "th": "คุณสวมต่างหู สร้อยคอ แหวน หรือเครื่องประดับอื่นๆ ไหม?", "zh": "您是否佩戴耳环、项链、戒指等饰品？"}, "손톱, 발톱, 매니큐어가 있나요?": {"en": "Do you have nail polish on your fingernails or toenails?", "vi": "Bạn có sơn móng tay hoặc móng chân không?", "ar": "هل لديك أظافر صناعية أو طلاء أظافر على اليدين أو القدمين؟", "ru": "Есть ли лак на ногтях рук или ног?", "th": "คุณมีการทาเล็บมือหรือเล็บเท้าไหม?", "zh": "您的手指甲或脚趾甲上有指甲油吗？"}, "자정부터 물 포함해서 아무것도 먹지마세요.": {"en": "Do not eat or drink anything from midnight, including water.", "vi": "Không ăn uống từ nửa đêm, kể cả nước.", "ar": "لا تأكلي أو تشربي شيئاً من منتصف الليل بما في ذلك الماء.", "ru": "С полуночи ничего не есть и не пить, включая воду.", "th": "อย่ากินหรือดื่มอะไรตั้งแต่เที่ยงคืน รวมถึงน้ำ", "zh": "从午夜起禁止进食饮水，包括水在内。"}, "귀걸이, 목걸이, 반지 등의 장신구 제거하세요.": {"en": "Please remove all jewelry including earrings, necklaces, and rings.", "vi": "Vui lòng tháo tất cả trang sức bao gồm khuyên tai, vòng cổ và nhẫn.", "ar": "يرجى إزالة جميع المجوهرات بما في ذلك الأقراط والقلائد والخواتم.", "ru": "Снимите все украшения: серьги, цепочки, кольца.", "th": "กรุณาถอดเครื่องประดับทั้งหมด รวมถึงต่างหู สร้อยคอ และแหวน", "zh": "请取下所有饰品，包括耳环、项链和戒指。"}, "손톱, 발톱의 매니큐어와 화장은 지워주세요.": {"en": "Please remove nail polish and makeup.", "vi": "Vui lòng tẩy sơn móng và trang điểm.", "ar": "يرجى إزالة طلاء الأظافر والمكياج.", "ru": "Снимите лак с ногтей и смойте макияж.", "th": "กรุณาล้างยาทาเล็บและเครื่องสำอาง", "zh": "请去除指甲油和妆容。"}, "수술실 갈 때에는 속옷 포함해서 다 벗고 수술복만 입어야 해요.": {"en": "When going to the operating room, remove all clothing including underwear and wear only the surgical gown.", "vi": "Khi vào phòng mổ, vui lòng cởi tất cả kể cả đồ lót và chỉ mặc áo phẫu thuật.", "ar": "عند الذهاب لغرفة العمليات، اخلعي كل شيء بما في ذلك الملابس الداخلية والبسي ثوب الجراحة فقط.", "ru": "В операционную идите, сняв всё включая нижнее бельё, в одном хирургическом халате.", "th": "เมื่อเข้าห้องผ่าตัด ถอดทุกอย่างรวมถึงชุดชั้นในและสวมเฉพาะชุดผ่าตัด", "zh": "前往手术室时，脱去包括内衣在内的所有衣物，只穿手术服。"}, "금식해주세요.": {"en": "Please fast (no food or drink).", "vi": "Vui lòng nhịn ăn uống.", "ar": "يرجى الصيام (لا طعام ولا شراب).", "ru": "Пожалуйста, соблюдайте голодание.", "th": "กรุณางดอาหารและน้ำ", "zh": "请禁食（不得进食饮水）。"}, "30분 이내에 pad 1장이 젖을 정도의 질출혈이 있으면 말해주세요.": {"en": "Please tell us if a pad becomes soaked within 30 minutes.", "vi": "Xin vui lòng báo cho chúng tôi nếu một miếng lót thấm đẫm trong 30 phút.", "ar": "أخبرينا إذا حدث نزيف مهبلي يبلل فوطة كاملة خلال 30 دقيقة.", "ru": "Сообщите нам, если прокладка промокает за 30 минут.", "th": "แจ้งเราหากผ้าอนามัยเปียกภายใน 30 นาที", "zh": "如果30分钟内卫生巾完全湿透，请告知我们。"}, "무통주사가 지속적으로 들어가고 있어요. 통증 증가 시 버튼을 누르면 약물이 더 들어갑니다.": {"en": "Pain relief medication is continuously infusing. Press the button for an extra dose if pain increases.", "vi": "Thuốc giảm đau đang được truyền liên tục. Vui lòng nhấn nút để thêm liều nếu đau tăng.", "ar": "دواء تخفيف الألم يُعطى باستمرار. اضغطي الزر للحصول على جرعة إضافية إذا زاد الألم.", "ru": "Обезболивающее поступает непрерывно. Нажмите кнопку для дополнительной дозы при усилении боли.", "th": "ยาแก้ปวดกำลังให้อยู่ต่อเนื่อง กดปุ่มเพื่อเพิ่มขนาดยาหากอาการปวดเพิ่มขึ้น", "zh": "止痛药正在持续输注，如疼痛加剧请按按钮追加剂量。"}, "(척수마취 시) 6시간 동안 고개를 들지 마세요.": {"en": "(Spinal anesthesia) Do not lift your head for 6 hours.", "vi": "(Gây tê tủy sống) Không nhấc đầu trong 6 giờ.", "ar": "(تخدير نخاع العمود الفقري) لا ترفعي رأسك لمدة 6 ساعات.", "ru": "(Спинальная анестезия) Не поднимайте голову 6 часов.", "th": "(การระงับความรู้สึกทางไขสันหลัง) อย่ายกหัวเป็นเวลา 6 ชั่วโมง", "zh": "（脊髓麻醉）6小时内请勿抬头。"}, "(전신마취 시) 2시간 동안 자지 말고 심호흡을 자주하시고, 가래가 있다면 뱉으세요.": {"en": "(General anesthesia) Stay awake for 2 hours, breathe deeply frequently, and cough up any phlegm.", "vi": "(Gây mê toàn thân) Thức 2 giờ, hít thở sâu thường xuyên và khạc đờm nếu có.", "ar": "(تخدير عام) ابقي مستيقظة لساعتين، تنفسي بعمق بشكل متكرر، وابصقي أي بلغم.", "ru": "(Общая анестезия) Не спите 2 часа, часто дышите глубоко и откашливайте мокроту.", "th": "(การดมยาสลบ) ตื่นอยู่ 2 ชั่วโมง หายใจลึกบ่อยๆ และบ้วนเสมหะออก", "zh": "（全身麻醉）2小时内保持清醒，频繁深呼吸，有痰请咳出。"}, "퇴원계에서 수납안내 연락을 받으면 핸드폰으로 문자가 발송됩니다.": {"en": "You will receive a text message when it is time to pay at the discharge counter.", "vi": "Bạn sẽ nhận tin nhắn khi đến lúc thanh toán tại quầy xuất viện.", "ar": "ستتلقين رسالة نصية عندما يحين وقت الدفع في مكتب الخروج.", "ru": "Вы получите смс, когда придёт время оплаты у стойки выписки.", "th": "คุณจะได้รับข้อความเมื่อถึงเวลาชำระเงินที่เคาน์เตอร์จำหน่าย", "zh": "到收费时您将收到短信通知。"}, "1층 퇴원계에서 진료비를 수납합니다.": {"en": "Pay your medical bill at the discharge desk on the 1st floor.", "vi": "Thanh toán viện phí tại quầy xuất viện tầng 1.", "ar": "ادفعي الفاتورة الطبية في مكتب الخروج بالطابق الأول.", "ru": "Оплатите счёт у стойки выписки на 1-м этаже.", "th": "ชำระค่ารักษาพยาบาลที่เคาน์เตอร์ออกจากโรงพยาบาลชั้น 1", "zh": "请在1楼出院窗口缴纳医疗费用。"}, "1층 퇴원약 받는 곳에서 퇴원약을 받고 약 설명을 듣습니다.": {"en": "Collect your discharge medication and receive instructions at the 1st floor pharmacy.", "vi": "Nhận thuốc ra viện và nghe hướng dẫn tại nhà thuốc tầng 1.", "ar": "احصلي على دواء الخروج واستمعي للتعليمات في صيدلية الطابق الأول.", "ru": "Получите лекарства при выписке и инструкции в аптеке на 1-м этаже.", "th": "รับยาออกจากโรงพยาบาลและรับคำแนะนำที่ร้านขายยาชั้น 1", "zh": "在1楼药房领取出院药并听取用药说明。"}, "퇴원 당일 8시간 무료주차, 지하 1층 주차정산소에서 확인하고 귀가합니다.": {"en": "Free parking for 8 hours on discharge day. Validate at the B1 parking payment office.", "vi": "Miễn phí đỗ xe 8 giờ vào ngày xuất viện. Xác nhận tại trạm thanh toán đỗ xe tầng B1.", "ar": "مواقف السيارات مجانية لمدة 8 ساعات في يوم الخروج. يرجى التأكد من ذلك في مكتب تسوية رسوم مواقف السيارات بالطابق B1 قبل المغادرة.", "ru": "Бесплатная парковка 8 часов в день выписки. Подтвердите на стойке оплаты парковки B1.", "th": "จอดฟรี 8 ชั่วโมงในวันออกจากโรงพยาบาล ยืนยันที่สถานีชำระค่าจอดรถชั้น B1", "zh": "出院当天停车8小时免费，在地下1层停车结算处确认后离开。"}, "자궁수축이 규칙적으로 있을 때, 통증이 동반될 때 병원에 와야합니다.": {"en": "Come to the hospital if you have regular contractions accompanied by pain.", "vi": "Đến bệnh viện khi có cơn co đều đặn kèm đau.", "ar": "تعالي إلى المستشفى عند وجود انقباضات منتظمة مصحوبة بألم.", "ru": "Приходите в больницу при регулярных схватках с болью.", "th": "มาโรงพยาบาลเมื่อมีการหดตัวสม่ำเสมอพร้อมกับความเจ็บปวด", "zh": "如有规律宫缩并伴有疼痛，请来医院。"}, "맑은 분비물이 흐를 때 병원을 방문해야합니다.": {"en": "Visit the hospital if you have clear fluid leaking.", "vi": "Đến bệnh viện nếu có dịch trong chảy ra.", "ar": "زوري المستشفى إذا كان هناك سائل شفاف يتسرب.", "ru": "Обратитесь в больницу при вытекании прозрачной жидкости.", "th": "มาโรงพยาบาลหากมีของเหลวใสไหลออก", "zh": "如有清澈液体流出，请来医院就诊。"}, "태동이 1시간에 2-3번도 안느껴질 때 병원에 와야합니다.": {"en": "Come to the hospital if you feel fewer than 2–3 fetal movements per hour.", "vi": "Đến bệnh viện nếu cảm thấy ít hơn 2–3 cử động thai nhi mỗi giờ.", "ar": "تعالي إلى المستشفى إذا شعرتِ بأقل من 2–3 حركات جنينية في الساعة.", "ru": "Обратитесь в больницу, если менее 2–3 движений плода в час.", "th": "มาโรงพยาบาลหากรู้สึกทารกดิ้นน้อยกว่า 2–3 ครั้งต่อชั่วโมง", "zh": "如果每小时感到的胎动少于2-3次，请来医院。"}, "질출혈이 있을 때 병원에 와야합니다.": {"en": "Come to the hospital if you have vaginal bleeding.", "vi": "Đến bệnh viện nếu có chảy máu âm đạo.", "ar": "تعالي إلى المستشفى إذا كان هناك نزيف مهبلي.", "ru": "Обратитесь в больницу при вагинальном кровотечении.", "th": "มาโรงพยาบาลหากมีเลือดออกทางช่องคลอด", "zh": "如有阴道出血，请来医院。"}, "검사 중 배뭉침이 몇 번 있었는지 세어주시고, 검사가 끝나면 알려주세요.": {"en": "During the test, please count how many times your abdomen tightens, and let me know when the test is finished.", "vi": "Trong khi kiểm tra, hãy đếm số lần bụng căng và cho tôi biết khi xong.", "ar": "أثناء الاختبار، عدي عدد مرات شدّ البطن وأخبريني عند الانتهاء.", "ru": "Во время теста считайте сколько раз напрягается живот и сообщите мне по окончании.", "th": "ระหว่างการตรวจ กรุณานับจำนวนครั้งที่ท้องแข็ง และแจ้งให้ทราบเมื่อการตรวจเสร็จสิ้น", "zh": "检测期间请数腹部绷紧的次数，检测结束后告诉我。"}, "배뭉침이 몇 번 있으셨나요?": {"en": "How many times did you feel abdominal tightening?", "vi": "Bạn cảm thấy bụng căng bao nhiêu lần?", "ar": "كم مرة شعرتِ بشد البطن؟", "ru": "Сколько раз напрягался живот?", "th": "คุณรู้สึกท้องแข็งกี่ครั้ง?", "zh": "您感到腹部绷紧了几次？"}, "분만실 입원생활 안내": {"en": "Delivery Ward Life Guide", "vi": "Hướng dẫn nội trú khu sinh", "ar": "دليل الإقامة في جناح الولادة", "ru": "Руководство по жизни в родильном отделении", "th": "คู่มือการพักในหอผู้ป่วยคลอด", "zh": "分娩室住院生活须知"}, "소변량이 감소할 수 있어 소변량 모니터링이 필요합니다.": {"en": "Urine output may decrease, so urine output monitoring is necessary.", "vi": "Lượng nước tiểu có thể giảm, cần theo dõi lượng nước tiểu.", "ar": "قد ينخفض إدرار البول لذا من الضروري مراقبته.", "ru": "Количество мочи может уменьшиться, необходим её мониторинг.", "th": "ปริมาณปัสสาวะอาจลดลง จึงจำเป็นต้องติดตามปริมาณปัสสาวะ", "zh": "尿量可能减少，因此需要监测尿量。"}, "임신성 고혈압의 경우 경련 예방을 위해 사용될 수 있습니다.": {"en": "In cases of pregnancy-induced hypertension, it may be used to prevent seizures.", "vi": "Trong trường hợp tăng huyết áp thai kỳ, có thể dùng để ngăn ngừa co giật.", "ar": "في حالات ارتفاع ضغط الدم الحملي قد يُستخدم لمنع النوبات.", "ru": "При гестационной гипертензии может применяться для профилактики судорог.", "th": "ในกรณีความดันโลหิตสูงขณะตั้งครรภ์อาจใช้เพื่อป้องกันอาการชัก", "zh": "妊娠期高血压时，可用于预防惊厥。"}, "입원 수속 안내": {"en": "Admission Procedure Guide", "vi": "Hướng dẫn thủ tục nhập viện", "ar": "دليل إجراءات الدخول", "ru": "Руководство по госпитализации", "th": "คู่มือขั้นตอนการรับเข้า", "zh": "入院手续指南"}, "주입 초기에는 얼굴 열감, 주사 부위 불편감이 있을 수 있으므로 불편감이 있을 시 콜벨을 눌러주세요.": {"en": "At the beginning of the infusion, you may feel facial flushing or discomfort at the injection site, so please press the call bell if you feel uncomfortable.", "vi": "Lúc đầu truyền có thể cảm thấy nóng mặt hoặc khó chịu tại chỗ tiêm, hãy nhấn chuông nếu không thoải mái.", "ar": "في بداية التسريب قد تشعرين بحرارة في الوجه أو انزعاج في موضع الحقن، اضغطي الجرس إذا شعرتِ بعدم ارتياح.", "ru": "В начале инфузии возможны приливы жара и дискомфорт - нажмите кнопку вызова при дискомфорте.", "th": "ช่วงแรกอาจรู้สึกร้อนที่ใบหน้าหรือไม่สบายที่บริเวณฉีดยา กดกริ่งถ้าไม่สบาย", "zh": "输注初期可能出现面部潮热或注射部位不适，如有不适请按呼叫铃。"}, "태동검사를 할 거예요. 똑바로 누운 자세로 20분 정도 걸립니다. 소변 보고 오실 필요 있으신가요?": {"en": "We are going to perform a fetal movement test. The test is done while lying flat on your back and takes about 20 minutes. Do you need to use the restroom?", "vi": "Chúng tôi sẽ thực hiện kiểm tra cử động thai nhi. Nằm ngửa khoảng 20 phút. Bạn có cần đi vệ sinh không?", "ar": "سنجري اختبار حركة الجنين. يستغرق 20 دقيقة. هل تحتاجين للحمام؟", "ru": "Мы проведём тест на движения плода. Лёжа на спине около 20 минут. Вам нужно в туалет?", "th": "เราจะทำการทดสอบการเคลื่อนไหวของทารก นอนหงายประมาณ 20 นาที คุณต้องใช้ห้องน้ำไหม?", "zh": "我们将进行胎动检测，请平躺约20分钟。您需要先去洗手间吗？"}, "태동이 있을 때마다 이 버튼을 눌러주세요.": {"en": "Please press this button whenever you feel fetal movement.", "vi": "Vui lòng nhấn nút này mỗi khi cảm thấy thai nhi cử động.", "ar": "اضغطي هذا الزر كلما شعرتِ بحركة الجنين.", "ru": "Нажимайте кнопку каждый раз, когда чувствуете движение плода.", "th": "กรุณากดปุ่มนี้ทุกครั้งที่รู้สึกว่าลูกดิ้น", "zh": "每次感到胎动时请按此按钮。"}, "항생제반응검사": {"en": "Antibiotic skin test", "vi": "Kiểm tra phản ứng kháng sinh", "ar": "اختبار تفاعل المضاد الحيوي", "ru": "Кожный тест на антибиотик", "th": "ทดสอบปฏิกิริยายาปฏิชีวนะ", "zh": "抗生素皮试"}, "배가 뭉치면 깊게 호흡 두 번한 후 숨을 참고 10초 동안 길게 대변보듯이 힘주세요.": {"en": "When you feel a contraction, take two deep breaths, hold your breath, and push hard for 10 seconds as if having a bowel movement.", "vi": "Khi co thắt, hít sâu hai lần, nín thở rồi rặn mạnh 10 giây như khi đại tiện.", "ar": "عند الانقباض خذي نفسين عميقين احبسي النفس ثم ادفعي بقوة 10 ثوانٍ كما لو كنتِ تتبرزين.", "ru": "При схватке два глубоких вдоха, задержите дыхание и тужьтесь 10 секунд как при дефекации.", "th": "เมื่อมีการหดตัว หายใจลึก 2 ครั้ง กลั้นหายใจแล้วเบ่งแรง 10 วินาทีเหมือนถ่ายอุจจาระ", "zh": "宫缩时深呼吸两次，屏气后像排便一样用力10秒。"}};

(function(){
  const g=document.getElementById('lang-grid');
  LANGS.forEach(l=>{
    const d=document.createElement('div');d.className='lang-btn';
    d.innerHTML=`<img class="flag-img" src="${l.img}" alt="${l.native}"><div class="lang-name">${l.name}</div><div class="lang-native">${l.native}</div>`;
    d.onclick=()=>selectLang(l.code,l.name,l.native);
    g.appendChild(d);
  });
})();

,'배가 뭉치면 깊게 호흡 두 번한 후 숨을 참고 10초 동안 길게 대변보듯이 힘주세요.':{'en':'When you feel a contraction, take two deep breaths, hold your breath, and push hard for 10 seconds as if having a bowel movement.','vi':'Khi co thắt, hít sâu hai lần, nín thở rồi rặn mạnh 10 giây như khi đại tiện.','ar':'عند الانقباض خذي نفسين عميقين احبسي النفس ثم ادفعي بقوة 10 ثوانٍ.','ru':'При схватке два глубоких вдоха, задержите дыхание и тужьтесь 10 секунд.','th':'เมื่อมีการหดตัว หายใจลึก 2 ครั้ง กลั้นหายใจแล้วเบ่งแรง 10 วินาที','zh':'宫缩时深呼吸两次，屏气后像排便一样用力10秒。'}

,'1층 응급실 내 응급 원무과에서 입원 수속 후 환자팔찌를 받아서 올라와 대기해 주세요.':{'en':'Complete admission at the ER admin office (1F), receive your patient wristband, then come back up and wait.','vi':'Làm thủ tục nhập viện tại phòng hành chính tầng 1, nhận vòng tay bệnh nhân rồi lên chờ.','ar':'أكملي إجراءات الدخول في مكتب الطوارئ (الطابق 1)، استلمي سوار المريض ثم ارجعي وانتظري.','ru':'Оформите госпитализацию в приёмном отделении (1 этаж), получите браслет и поднимитесь ждать.','th':'ดำเนินการรับเข้าที่แผนกฉุกเฉินชั้น 1 รับสายรัดข้อมือผู้ป่วย แล้วขึ้นมารอ','zh':'请在1楼急诊行政办公室完成入院手续，领取患者腕带后上来等候。'}
,'오로가 나오는 것은 정상입니다. 피덩어리가 나오거나, 계속 피가 흐르는 느낌이 있으면 콜벨 누르세요.':{'en':'Postpartum discharge (lochia) is normal. Press the call bell if you pass blood clots or feel continuous bleeding.','vi':'Sản dịch là bình thường. Nhấn chuông nếu có cục máu hoặc cảm thấy chảy máu liên tục.','ar':'الإفرازات النفاسية طبيعية. اضغطي الجرس إذا خرجت جلطات أو شعرتِ بنزيف مستمر.','ru':'Послеродовые выделения — норма. Нажмите кнопку при сгустках или непрерывном кровотечении.','th':'น้ำคาวปลาเป็นเรื่องปกติ กดกริ่งหากมีก้อนเลือดหรือรู้สึกเลือดไหลต่อเนื่อง','zh':'恶露是正常现象，如排出血块或感到持续出血请按呼叫铃。'}

,'자궁 수축제를 정맥주사로 주입 시작하겠습니다. 주입 속도를 20분-30분 간격으로 증량할 예정입니다.':{'en':'We will start administering a uterine contraction agent by IV. The infusion rate will be increased every 20-30 minutes.','vi':'Chúng tôi sẽ bắt đầu truyền tĩnh mạch thuốc co thắt tử cung. Tốc độ truyền sẽ tăng mỗi 20-30 phút.','ar':'سنبدأ إعطاء عامل انقباض الرحم عبر الوريد. سيزيد معدل التسريب كل 20-30 دقيقة.','ru':'Начнём внутривенное введение утеротонического препарата. Скорость увеличивается каждые 20-30 минут.','th':'เราจะเริ่มให้ยากระตุ้นการหดตัวของมดลูกทางหลอดเลือดดำ อัตราการให้จะเพิ่มทุก 20-30 นาที','zh':'我们将开始静脉注射子宫收缩剂，每20-30分钟增加一次输注速度。'}
,'자궁수축이 있을 때 들이쉬고 내쉬고 심호흡 하세요. -> 3초 동안 코로 들이마시고, 3초간 입으로 내쉬세요.':{'en':'When you have a contraction, breathe deeply in and out. Inhale through your nose for 3 seconds, exhale through your mouth for 3 seconds.','vi':'Khi có cơn co, hít thở sâu. Hít vào bằng mũi 3 giây, thở ra bằng miệng 3 giây.','ar':'عند الانقباض تنفسي بعمق. شهيق من الأنف 3 ثوانٍ، زفير من الفم 3 ثوانٍ.','ru':'При схватке дышите глубоко. Вдох через нос 3 секунды, выдох через рот 3 секунды.','th':'เมื่อมีการหดตัว ให้หายใจเข้าออกลึกๆ หายใจเข้าทางจมูก 3 วินาที หายใจออกทางปาก 3 วินาที','zh':'宫缩时请深呼吸：用鼻子吸气3秒，用嘴呼气3秒。'}
,'보호자는 내일 보호자 출입증을 발급 받고 7층 분만실로 오시면 됩니다. 제가 내일 아침에 문자 보내드릴게요.':{'en':'Your guardian should obtain a visitor pass tomorrow and come to the delivery ward on the 7th floor. I will send a text message tomorrow morning.','vi':'Người thân cần lấy thẻ ra vào vào ngày mai và đến khu sinh tầng 7. Tôi sẽ nhắn tin vào sáng mai.','ar':'يجب على المرافق الحصول على تصريح الدخول غداً والقدوم إلى جناح الولادة في الطابق السابع. سأرسل رسالة نصية صباح الغد.','ru':'Сопровождающий должен получить пропуск завтра и прийти в родильное отделение на 7-м этаже. Завтра утром пришлю сообщение.','th':'ผู้ดูแลควรรับบัตรผ่านพรุ่งนี้และมาที่หอผู้ป่วยคลอดชั้น 7 ฉันจะส่งข้อความในเช้าวันพรุ่งนี้','zh':'家属明天领取探视证后请来7楼分娩室，我明天早上会发短信通知。'}
,'조산의 가능성이 있는 경우 태어날 아기의 폐성숙을 도와주는 약으로 엉덩이 근육에 하루에 한번 총 2일 동안 투여합니다.':{'en':'If preterm birth is possible, this injection matures the baby\'s lungs. Given once daily for 2 days in the buttock.','vi':'Nếu có nguy cơ sinh non, thuốc này giúp phổi bé trưởng thành. Tiêm bắp mông 1 lần/ngày trong 2 ngày.','ar':'إذا كانت الولادة المبكرة محتملة يساعد هذا الحقن على نضوج رئتي الطفل. حقن في عضلة الأرداف مرة يومياً لمدة يومين.','ru':'При риске преждевременных родов препарат ускоряет созревание лёгких. Вводится в ягодицу раз в день 2 дня.','th':'หากมีความเสี่ยงคลอดก่อนกำหนด ยานี้ช่วยพัฒนาปอดทารก ฉีดที่กล้ามเนื้อสะโพกวันละครั้ง 2 วัน','zh':'如有早产风险，此药可促进胎儿肺成熟，每天在臀部肌肉注射一次，共注射2天。'}
,'국가에서 지원해주는 병상입니다. 입실 시 동의서 서명이 필요합니다. 하루 입원료는 약 59,000원입니다.':{'en':'This is a government-subsidized room. Consent form required upon admission. Daily charge approx. 59,000 KRW.','vi':'Đây là giường được nhà nước hỗ trợ. Cần ký giấy đồng ý khi nhập phòng. Phí hàng ngày khoảng 59.000 won.','ar':'هذا سرير مدعوم حكومياً. يلزم توقيع نموذج موافقة عند الدخول. الرسوم اليومية حوالي 59,000 وون.','ru':'Место с государственной субсидией. При заселении нужна подпись на согласии. Стоимость в день ~59 000 вон.','th':'เตียงนี้ได้รับการสนับสนุนจากรัฐ ต้องเซ็นใบยินยอมเมื่อเข้าพัก ค่าห้องต่อวันประมาณ 59,000 วอน','zh':'这是政府补贴病床，入住时需签署同意书，每日住院费约59,000韩元。'}
,'진통, 출산, 회복을 할 수 있는 가족분만실 사용을 원하시나요? 출생 당일만 입원료가 10만원입니다. 사용하신다면 동의서 서명 부탁드립니다.':{'en':'Would you like to use the Family Delivery Room (for labor, delivery, and recovery)? There is an additional fee of 100,000 KRW on the day of delivery. If so, please sign the consent form.','vi':'Bạn có muốn sử dụng Phòng sinh gia đình không? Phí thêm 100.000 won vào ngày sinh. Nếu có, vui lòng ký giấy đồng ý.','ar':'هل تريدين استخدام غرفة الولادة العائلية؟ رسوم إضافية 100,000 وون يوم الولادة. يرجى التوقيع على نموذج الموافقة.','ru':'Хотите использовать семейную родильную палату? Дополнительная плата 100 000 вон в день родов. Пожалуйста, подпишите согласие.','th':'คุณต้องการใช้ห้องคลอดครอบครัวไหม? ค่าเพิ่มเติม 100,000 วอนในวันคลอด ถ้าต้องการกรุณาเซ็นใบยินยอม','zh':'您是否想使用家庭分娩室？分娩当天额外收费100,000韩元，如需使用请签署同意书。'}
,'사용할 항생제에 알러지 반응 유무를 확인하는 검사로 팔 안쪽에 소량의 약물을 주입하는 검사입니다.':{'en':'This test checks for antibiotic allergy by injecting a small amount into the inner arm.','vi':'Kiểm tra dị ứng kháng sinh bằng cách tiêm một lượng nhỏ vào mặt trong cánh tay.','ar':'اختبار لتحديد الحساسية للمضاد الحيوي بحقن كمية صغيرة في الجزء الداخلي من الذراع.','ru':'Тест на аллергию к антибиотику: небольшое количество вводится во внутреннюю поверхность руки.','th':'ทดสอบการแพ้ยาปฏิชีวนะโดยฉีดยาจำนวนเล็กน้อยที่ด้านในของแขน','zh':'通过在手臂内侧注射少量药物来检测抗生素过敏反应。'}
,'수술실 갈 때에는 속옷 포함해서 다 벗고 수술복만 입어야 해요.':{'en':'When going to the operating room, remove all clothing including underwear and wear only the surgical gown.','vi':'Khi vào phòng mổ, cởi tất cả kể cả đồ lót và chỉ mặc áo phẫu thuật.','ar':'عند الذهاب لغرفة العمليات اخلعي كل شيء بما في ذلك الملابس الداخلية والبسي ثوب الجراحة فقط.','ru':'В операционную идите сняв всё включая нижнее бельё в одном хирургическом халате.','th':'เมื่อเข้าห้องผ่าตัด ถอดทุกอย่างรวมถึงชุดชั้นในและสวมเฉพาะชุดผ่าตัด','zh':'前往手术室时，脱去包括内衣在内的所有衣物，只穿手术服。'}
,'7층 4인실 입원료를 내고, 분만실 안에 있는 2인실 병실을 사용할 것입니다.':{'en':'You will pay the 7F 4-bed room rate and use the 2-bed room inside the delivery ward.','vi':'Bạn trả phí phòng 4 người tầng 7 và sử dụng phòng 2 người trong khu sinh.','ar':'ستدفعين رسوم غرفة الأربعة أسرة في الطابق 7 وتستخدمين غرفة سريرين داخل جناح الولادة.','ru':'Вы платите за четырёхместную палату (7 этаж) и используете двухместную палату в родильном отделении.','th':'คุณชำระค่าห้อง 4 เตียงชั้น 7 และใช้ห้อง 2 เตียงในหอผู้ป่วยคลอด','zh':'您支付7楼四人间费用，使用分娩室内的二人间病房。'}
,'무통주사가 지속적으로 들어가고 있어요. 통증 증가 시 버튼을 누르면 약물이 더 들어갑니다.':{'en':'Pain relief medication is continuously infusing. Press the button for an extra dose if pain increases.','vi':'Thuốc giảm đau đang được truyền liên tục. Nhấn nút để thêm liều nếu đau tăng.','ar':'دواء تخفيف الألم يُعطى باستمرار. اضغطي الزر للحصول على جرعة إضافية إذا زاد الألم.','ru':'Обезболивающее поступает непрерывно. Нажмите кнопку для дополнительной дозы при усилении боли.','th':'ยาแก้ปวดกำลังให้อยู่ต่อเนื่อง กดปุ่มเพื่อเพิ่มขนาดยาหากอาการปวดเพิ่มขึ้น','zh':'止痛药正在持续输注，如疼痛加剧请按按钮追加剂量。'}
,'퇴원 당일 8시간 무료주차, 지하 1층 주차정산소에서 확인하고 귀가합니다.':{'en':'Free parking for 8 hours on discharge day. Validate at the B1 parking payment office.','vi':'Miễn phí đỗ xe 8 giờ vào ngày xuất viện. Xác nhận tại trạm thanh toán đỗ xe tầng B1.','ar':'وقوف مجاني لمدة 8 ساعات يوم الخروج. تحقق من ذلك في مكتب دفع ركن السيارات بالطابق B1.','ru':'Бесплатная парковка 8 часов в день выписки. Подтвердите на стойке оплаты парковки B1.','th':'จอดฟรี 8 ชั่วโมงในวันออกจากโรงพยาบาล ยืนยันที่สถานีชำระค่าจอดรถชั้น B1','zh':'出院当天停车8小时免费，在地下1层停车结算处确认后离开。'}
,'자궁수축을 감소시키는 경구약으로 혈압저하가 있을 수 있어 어지러움 증상이 있을 경우 즉시 알리도록 합니다.':{'en':'This oral medication reduces contractions. It may lower blood pressure - notify us immediately if dizzy.','vi':'Thuốc uống này giảm co thắt. Có thể hạ huyết áp - báo ngay nếu chóng mặt.','ar':'هذا الدواء الفموي يقلل الانقباضات. قد يخفض ضغط الدم - أبلغي فوراً إذا شعرتِ بدوار.','ru':'Таблетки снижают сокращения. Возможно снижение давления - немедленно сообщите если кружится голова.','th':'ยาเม็ดนี้ลดการหดตัว อาจทำให้ความดันต่ำ แจ้งทันทีหากรู้สึกเวียนหัว','zh':'此口服药可减少宫缩，可能导致血压下降，如有头晕请立即通知。'}
,'내일 5시에 자궁 수축 검사 및 내진을 할 것입니다. 이후 관장을 시행 예정입니다.':{'en':'At 5 AM tomorrow, we will perform a contraction test and internal exam, followed by an enema.','vi':'Vào 5 giờ sáng mai, chúng tôi sẽ kiểm tra co thắt và khám âm đạo, sau đó thụt tháo.','ar':'في الساعة 5 صباح الغد، سنجري اختبار انقباضات وفحصاً داخلياً، يتبعه حقنة شرجية.','ru':'Завтра в 5:00 проведём тест на сокращения и внутренний осмотр, затем клизму.','th':'เช้าพรุ่งนี้ 5 โมง จะทำการทดสอบการหดตัวและตรวจภายใน จากนั้นสวนอุจจาระ','zh':'明天5点将进行宫缩检测和内诊，之后进行灌肠。'}
,'양수색은 원래 무색입니다. 색의 변화(빨강, 녹색 등)가 있으면 바로 말해주세요.':{'en':'Amniotic fluid is normally clear. Tell us immediately if you notice any color change (red, green, etc.).','vi':'Nước ối bình thường không màu. Báo ngay nếu có thay đổi màu (đỏ, xanh, v.v.).','ar':'السائل الأمنيوسي شفاف طبيعياً. أبلغي فوراً إذا لاحظتِ أي تغير في اللون.','ru':'Амниотическая жидкость обычно прозрачная. Сообщите немедленно при любом изменении цвета.','th':'น้ำคร่ำปกติจะไม่มีสี แจ้งทันทีหากสีเปลี่ยน (แดง เขียว ฯลฯ)','zh':'羊水正常为无色，如发现颜色变化（红色、绿色等）请立即告知。'}

,'태동검사를 할 거예요. 똑바로 누운 자세로 20분 정도 걸립니다. 소변 보고 오실 필요 있으신가요?':{'en':'We are going to perform a fetal movement test. The test is done while lying flat on your back and takes about 20 minutes. Do you need to use the restroom?','vi':'Chúng tôi sẽ thực hiện kiểm tra cử động thai nhi. Nằm ngửa khoảng 20 phút. Bạn có cần đi vệ sinh không?','ar':'سنجري اختبار حركة الجنين. يستغرق 20 دقيقة مع الاستلقاء. هل تحتاجين للحمام؟','ru':'Мы проведём тест на движения плода. Лёжа на спине около 20 минут. Вам нужно в туалет?','th':'เราจะทำการทดสอบการเคลื่อนไหวของทารก นอนหงายประมาณ 20 นาที คุณต้องใช้ห้องน้ำไหม?','zh':'我们将进行胎动检测，请平躺约20分钟。您需要先去洗手间吗？'}
,'태동이 있을 때마다 이 버튼을 눌러주세요.':{'en':'Please press this button whenever you feel fetal movement.','vi':'Hãy nhấn nút này mỗi khi cảm thấy thai nhi cử động.','ar':'اضغطي هذا الزر كلما شعرتِ بحركة الجنين.','ru':'Нажимайте кнопку каждый раз, когда чувствуете движение плода.','th':'กรุณากดปุ่มนี้ทุกครั้งที่รู้สึกว่าลูกดิ้น','zh':'每次感到胎动时请按此按钮。'}
,'검사 중 배뭉침이 몇 번 있었는지 세어주시고, 검사가 끝나면 알려주세요.':{'en':'During the test, please count how many times your abdomen tightens, and let me know when the test is finished.','vi':'Trong khi kiểm tra, hãy đếm số lần bụng căng và cho tôi biết khi xong.','ar':'أثناء الاختبار عدي كم مرة تشدد بطنك وأخبريني عند الانتهاء.','ru':'Во время теста считайте сколько раз напрягается живот и сообщите мне по окончании.','th':'ระหว่างการทดสอบนับจำนวนครั้งที่ท้องแข็งและแจ้งฉันเมื่อเสร็จ','zh':'检测期间请数腹部绷紧的次数，检测结束后告诉我。'}
,'배뭉침이 몇 번 있으셨나요?':{'en':'How many times did you feel abdominal tightening?','vi':'Bạn cảm thấy bụng căng bao nhiêu lần?','ar':'كم مرة شعرتِ بشد البطن؟','ru':'Сколько раз напрягался живот?','th':'คุณรู้สึกท้องแข็งกี่ครั้ง?','zh':'您感到腹部绷紧了几次？'}
,'감염예방을 위해 분만실은 출입이 통제됩니다.':{'en':'The delivery ward is access-controlled to prevent infection.','vi':'Khu sinh được kiểm soát ra vào để phòng ngừa nhiễm trùng.','ar':'يُتحكم في الدخول إلى جناح الولادة لمنع العدوى.','ru':'Вход в родильное отделение ограничен для профилактики инфекций.','th':'หอผู้ป่วยคลอดถูกควบคุมการเข้าออกเพื่อป้องกันการติดเชื้อ','zh':'为防止感染，分娩室实行出入管控。'}
,'면회시간 외에는 출입이 제한되며, 출입증을 착용한 보호자 1명만 출입 가능합니다.':{'en':'Entry is restricted outside visiting hours. Only 1 guardian wearing a visitor pass is allowed.','vi':'Ngoài giờ thăm, chỉ 1 người thân có thẻ ra vào được phép vào.','ar':'يُقيَّد الدخول خارج أوقات الزيارة. يُسمح لمرافق واحد فقط يرتدي بطاقة الزيارة.','ru':'В неприёмные часы вход закрыт. Допускается только 1 сопровождающий с пропуском.','th':'นอกเวลาเยี่ยม อนุญาตเฉพาะผู้ดูแล 1 คนที่มีบัตรผ่าน','zh':'非探视时间禁止入内，仅持探视证的1名家属可进入。'}
,'분만 중이거나 시술이 이루어지는 경우 면회가 제한됩니다.':{'en':'Visiting is restricted during labor or procedures.','vi':'Thăm bị hạn chế khi đang chuyển dạ hoặc thực hiện thủ thuật.','ar':'تُقيَّد الزيارة أثناء المخاض أو الإجراءات الطبية.','ru':'Посещение ограничено во время родов или процедур.','th':'การเยี่ยมถูกจำกัดระหว่างการคลอดหรือทำหัตถการ','zh':'分娩或进行操作期间禁止探视。'}
,'인터폰을 누르고 출입 가능 여부를 확인합니다.':{'en':'Press the interphone and confirm entry is permitted.','vi':'Nhấn interphone và xác nhận có thể vào.','ar':'اضغطي على جهاز الاتصال الداخلي وتأكدي من إمكانية الدخول.','ru':'Нажмите домофон и уточните разрешение на вход.','th':'กดอินเตอร์โฟนและยืนยันการอนุญาตเข้า','zh':'按对讲机确认是否可以进入。'}
,'문이 열리면 입실합니다.':{'en':'Enter when the door opens.','vi':'Vui lòng vào khi cửa mở.','ar':'ادخلي عندما يُفتح الباب.','ru':'Войдите, когда откроется дверь.','th':'เข้าเมื่อประตูเปิด','zh':'门开后进入。'}
,'방문객 명부를 작성하고 알콜젤로 손위생 시행 후 병실로 입실합니다.':{'en':'Fill in the visitor log, perform hand hygiene with alcohol gel, then enter the room.','vi':'Điền sổ khách thăm, vệ sinh tay bằng gel cồn rồi vào phòng.','ar':'سجلي في سجل الزوار، ونظفي يديك بجل الكحول، ثم ادخلي إلى الغرفة.','ru':'Запишитесь в журнал посетителей, проведите гигиену рук и войдите в палату.','th':'กรอกสมุดบันทึกผู้เยี่ยม ทำความสะอาดมือด้วยเจลแอลกอฮอล์แล้วเข้าห้อง','zh':'填写访客登记表，使用酒精凝胶进行手部卫生，然后进入病房。'}
,'평일 1일 1회 18:00 ~ 20:00':{'en':'Weekdays, once daily: 18:00–20:00','vi':'Ngày thường, 1 lần/ngày: 18:00–20:00','ar':'أيام الأسبوع، مرة يومياً: 18:00–20:00','ru':'Будни, 1 раз в день: 18:00–20:00','th':'วันธรรมดา วันละ 1 ครั้ง: 18:00–20:00','zh':'工作日，每日1次：18:00–20:00'}
,'회진은 오전, 오후 1일 1~2회 이루어집니다.':{'en':'Rounds are conducted 1-2 times daily, in the morning and afternoon.','vi':'Khám buồng 1-2 lần mỗi ngày vào buổi sáng và chiều.','ar':'تُجرى الجولة 1-2 مرات يومياً صباحاً ومساءً.','ru':'Обход проводится 1-2 раза в день утром и днём.','th':'แพทย์ตรวจเยี่ยม 1-2 ครั้งต่อวัน ทั้งเช้าและบ่าย','zh':'上下午各查房1～2次。'}
,'추가 면담을 원하시는 경우 간호사에게 요청해 주세요.':{'en':'If you wish for an additional consultation, please ask the nurse.','vi':'Nếu cần tư vấn thêm, hãy yêu cầu y tá.','ar':'إذا أردتِ استشارة إضافية، يرجى إبلاغ الممرضة.','ru':'Если нужна дополнительная консультация, попросите медсестру.','th':'หากต้องการปรึกษาเพิ่มเติม กรุณาแจ้งพยาบาล','zh':'如需额外面谈，请告知护士。'}
,'담당 간호사에게 사전에 요청해 주세요.':{'en':'Please request in advance from your nurse.','vi':'Vui lòng yêu cầu trước với y tá.','ar':'يرجى الطلب مسبقاً من الممرضة.','ru':'Пожалуйста, сообщите медсестре заранее.','th':'กรุณาแจ้งพยาบาลล่วงหน้า','zh':'请提前告知责任护士。'}
,'아침 06:00 / 점심 11:00 / 저녁 17:00 이전':{'en':'Breakfast by 06:00 / Lunch by 11:00 / Dinner by 17:00','vi':'Sáng trước 06:00 / Trưa trước 11:00 / Tối trước 17:00','ar':'الفطور قبل 06:00 / الغداء قبل 11:00 / العشاء قبل 17:00','ru':'Завтрак до 06:00 / Обед до 11:00 / Ужин до 17:00','th':'เช้าก่อน 06:00 / เที่ยงก่อน 11:00 / เย็นก่อน 17:00','zh':'早餐06:00前 / 午餐11:00前 / 晚餐17:00前'}
,'아침 04:30 / 점심 10:00 / 저녁 15:00 이전':{'en':'Breakfast by 04:30 / Lunch by 10:00 / Dinner by 15:00','vi':'Sáng trước 04:30 / Trưa trước 10:00 / Tối trước 15:00','ar':'الفطور قبل 04:30 / الغداء قبل 10:00 / العشاء قبل 15:00','ru':'Завтрак до 04:30 / Обед до 10:00 / Ужин до 15:00','th':'เช้าก่อน 04:30 / เที่ยงก่อน 10:00 / เย็นก่อน 15:00','zh':'早餐04:30前 / 午餐10:00前 / 晚餐15:00前'}
,'화재위험이 있는 전열기구는 반입이 불가합니다.':{'en':'Heating appliances that pose fire risks are not allowed.','vi':'Không được mang thiết bị sưởi có nguy cơ cháy nổ.','ar':'الأجهزة الكهربائية التي تشكل خطر حريق ممنوعة.','ru':'Нагревательные приборы с риском пожара запрещены.','th':'ห้ามนำเครื่องทำความร้อนที่มีความเสี่ยงไฟไหม้','zh':'禁止携带有火灾危险的电热器具。'}
,'렌즈, 화장, 매니큐어, 장신구는 모두 제거해 주세요.':{'en':'Please remove contact lenses, makeup, nail polish, and jewelry.','vi':'Hãy tháo kính áp tròng, trang điểm, sơn móng và trang sức.','ar':'يرجى إزالة العدسات والمكياج وطلاء الأظافر والمجوهرات.','ru':'Снимите линзы, макияж, лак и украшения.','th':'กรุณาถอดคอนแทคเลนส์ เครื่องสำอาง ยาทาเล็บ และเครื่องประดับ','zh':'请取下隐形眼镜、卸妆、去除指甲油并摘掉饰品。'}
,'병원 이용 시 불만·불편한 사항이 있으시면 담당 간호사나 수간호사에게 언제든지 편안하게 말씀해 주시면 적극적으로 해결해 드리겠습니다.':{'en':'If you have any complaints or inconveniences, please feel free to speak with your nurse or head nurse at any time.','vi':'Nếu có khiếu nại hoặc bất tiện, hãy thoải mái nói với y tá hoặc trưởng y tá bất cứ lúc nào.','ar':'إذا كانت لديكِ أي شكاوى أو ملاحظات أثناء استخدام خدمات المستشفى، يرجى إبلاغ الممرضة أو رئيسة التمريض في أي وقت، وسنعمل على حلها بأفضل شكل ممكن.','ru':'Если у вас есть жалобы или неудобства, пожалуйста, сообщите медсестре или старшей медсестре.','th':'หากมีข้อร้องเรียนหรือความไม่สะดวก กรุณาแจ้งพยาบาลหรือหัวหน้าพยาบาลได้ทุกเวลา','zh':'如有不满或不便，请随时向责任护士或护士长反映，我们将积极解决。'}
,'병실 고객의 소리함에 비치된 카드에 칭찬 또는 불만·불편사항을 작성해 주시면 적극적으로 해결해 드리겠습니다.':{'en':'You may write compliments or complaints on the card in the patient feedback box in your room.','vi':'Bạn có thể viết lời khen hoặc khiếu nại lên thẻ trong hộp góp ý tại phòng.','ar':'يمكنكِ أيضاً كتابة كلمات الشكر أو الشكاوى أو الملاحظات على البطاقة الموجودة في صندوق آراء المرضى داخل الغرفة.','ru':'Вы можете написать похвалу или жалобу на карточке в ящике для отзывов в палате.','th':'คุณสามารถเขียนคำชมหรือข้อร้องเรียนในบัตรที่กล่องความคิดเห็นในห้องได้','zh':'您可以在病房意见箱中的卡片上写下表扬或意见。'}
,'식사에 나오는 음식은 밥과 국만 한 공기 기준으로 써주세요. (반찬 제외)':{'en':'For meals, record only rice and soup - one bowl each. (Side dishes excluded)','vi':'Chỉ ghi cơm và canh - một bát mỗi loại. (Không tính món phụ)','ar':'يرجى تسجيل الماء والمشروبات والأطعمة ذات المحتوى العالي من السوائل بالمليلتر (ml) وليس بعدد الأكواب. (لا حاجة لتسجيل الأطعمة قليلة المحتوى المائي مثل الخبز أو البسكويت أو الوجبات الخفيفة.)','ru':'Записывайте только рис и суп - по одной порции. (Гарниры не считаются)','th':'บันทึกเฉพาะข้าวและซุป - หนึ่งถ้วยต่อชนิด (ไม่รวมอาหารเคียง)','zh':'用餐只记录米饭和汤 - 各一碗。（不含配菜）'}
,'물이나 음료수 등 수분이 많은 음식은 1컵이 아닌 ml로 써주세요.':{'en':'For water, juice, or other liquids, write in ml, not cups.','vi':'Ghi chất lỏng bằng ml, không phải cốc.','ar':'اكتبي كمية الماء والمشروبات بالمليلتر (ml) وليس بعدد الأكواب.','ru':'Жидкости записывайте в мл, не в стаканах.','th':'เขียนของเหลวเป็น ml ไม่ใช่ถ้วย','zh':'液体请以ml记录，不要用杯。'}
,'수분함량이 거의 없는 빵, 과자 같은 음식은 안 적어도 됩니다.':{'en':'Dry foods like bread or crackers with little moisture do not need to be recorded.','vi':'Thực phẩm khô như bánh mì không cần ghi.','ar':'يرجى الرجوع إلى "الجدول المرجعي" الموجود على ظهر ورقة التسجيل.','ru':'Сухие продукты записывать не нужно.','th':'อาหารแห้งเช่นขนมปังไม่ต้องบันทึก','zh':'干性食物无需记录。'}
,'아래 사진 순서대로 소변기를 두고 사용하고 눈금으로 소변량을 측정해 주세요.':{'en':'Place the urinal as shown in the photo and measure urine volume using the scale.','vi':'Đặt bô tiểu theo hình và đo lượng nước tiểu bằng vạch chia.','ar':'يرجى استخدام وعاء قياس البول وقياس كمية البول باستخدام التدريج الموجود عليه.','ru':'Установите мочеприёмник как на фото и измерьте объём по шкале.','th':'วางกระโถนตามภาพและวัดปริมาณปัสสาวะโดยใช้สเกล','zh':'按图示放置尿壶，用刻度测量尿量。'}
,'소변기는 사용 후 물로 세척하여 건조해 주세요. (병원에서 1일 1회 소독)':{'en':'After use, rinse the urinal with water and let it dry. (Hospital disinfects once daily)','vi':'Sau dùng rửa bằng nước và để khô. (Khử trùng 1 lần/ngày)','ar':'بعد استخدام وعاء قياس البول، اغسليه بالماء وجففيه.','ru':'После использования ополосните и высушите. (Дезинфекция 1 раз в день)','th':'ล้างด้วยน้ำหลังใช้และปล่อยให้แห้ง (ฆ่าเชื้อวันละ 1 ครั้ง)','zh':'使用后用水冲洗并晾干。（每日消毒1次）'}
,'대변은 횟수로 적어주시고 대변 볼 때 소변은 횟수로 써주세요.':{'en':'Record bowel movements by count. If you urinate during a bowel movement, also record it by count.','vi':'Ghi số lần đại tiện. Tiểu tiện khi đại tiện cũng ghi số lần.','ar':'اكتبي عدد مرات التبرز، وإذا تم التبول أثناء التبرز فيرجى تسجيل ذلك أيضاً.','ru':'Дефекации записывайте по количеству раз. Мочеиспускание при этом тоже.','th':'บันทึกการถ่ายอุจจาระเป็นจำนวนครั้ง ปัสสาวะระหว่างนั้นก็บันทึก','zh':'大便以次数记录。同时排尿也以次数记录。'}
,'묽은변이나 설사가 있는 경우 간호사에게 말해주세요.':{'en':'If you have loose stools or diarrhea, please tell the nurse.','vi':'Nếu tiêu chảy, báo y tá.','ar':'إذا كان لديكِ إسهال، يرجى إبلاغ الممرضة.','ru':'При диарее сообщите медсестре.','th':'หากมีท้องเสีย กรุณาแจ้งพยาบาล','zh':'如有腹泻，请告知护士。'}
,'사진을 참고하여 지하 1층 편의점에서 구매 후 사용해 주세요.':{'en':'Please purchase from the convenience store on B1 as shown in the photo, then use.','vi':'Mua tại cửa hàng tiện lợi tầng B1 theo hình rồi sử dụng.','ar':'يرجى الرجوع إلى الصورة وشراء المنتج من المتجر في الطابق السفلي B1.','ru':'Купите в магазине на B1 как показано на фото.','th':'ซื้อจากร้านสะดวกซื้อชั้น B1 ตามภาพแล้วนำไปใช้','zh':'请按图片在地下1层便利店购买后使用。'}
,'패드 교환 시 버리지 마시고 침대 발치 쪽 거치대에 보관해 주세요.':{'en':'When changing pads, do not throw them away - keep them on the rack at the foot of your bed.','vi':'Khi thay miếng lót, không vứt đi - để trên giá ở chân giường.','ar':'عند تغيير الفوطة، لا ترميها، بل ضعيها على الرف الموجود عند أسفل السرير.','ru':'При смене прокладок не выбрасывайте - храните на стойке у ног кровати.','th':'เมื่อเปลี่ยนแผ่นอนามัย อย่าทิ้ง - เก็บไว้บนราวที่ปลายเตียง','zh':'更换护垫时请勿丢弃——放在床脚的挂架上保存。'}
,'진통, 출산, 회복을 할 수 있는 가족분만실 사용을 원하시나요? 출생 당일만 입원료가 10만원입니다. 사용하신다면 동의서 서명 부탁드립니다.':{'en':'Would you like to use the Family Delivery Room (for labor, delivery, and recovery)? There is an additional fee of 100,000 KRW on the day of delivery. If so, please sign the consent form.','vi':'Bạn có muốn sử dụng Phòng sinh gia đình không? Phí thêm 100.000 won vào ngày sinh. Vui lòng ký giấy đồng ý.','ar':'هل تريدين استخدام غرفة الولادة العائلية؟ رسوم إضافية 100,000 وون يوم الولادة. يرجى التوقيع على نموذج الموافقة.','ru':'Хотите использовать семейную родильную палату? Дополнительная плата 100 000 вон в день родов. Пожалуйста, подпишите согласие.','th':'คุณต้องการใช้ห้องคลอดครอบครัวไหม? ค่าเพิ่มเติม 100,000 วอนในวันคลอด กรุณาเซ็นใบยินยอม','zh':'您是否想使用家庭分娩室？分娩当天额外收费100,000韩元，如需使用请签署同意书。'}
,'항생제반응검사':{'en':'Antibiotic skin test','vi':'Kiểm tra phản ứng kháng sinh','ar':'اختبار تفاعل المضاد الحيوي','ru':'Кожный тест на антибиотик','th':'ทดสอบปฏิกิริยายาปฏิชีวนะ','zh':'抗生素皮试'}
,'약 부작용':{'en':'Medication side effects','vi':'Tác dụng phụ của thuốc','ar':'الآثار الجانبية للدواء','ru':'Побочные эффекты лекарств','th':'ผลข้างเคียงของยา','zh':'药物副作用'}
,'수술 전 처치표':{'en':'Pre-surgery checklist','vi':'Bảng kiểm tra trước phẫu thuật','ar':'قائمة التحقق قبل الجراحة','ru':'Предоперационный чеклист','th':'รายการตรวจสอบก่อนผ่าตัด','zh':'术前处置表'}
,'수술 전 주의사항':{'en':'Pre-surgery precautions','vi':'Lưu ý trước phẫu thuật','ar':'احتياطات ما قبل الجراحة','ru':'Меры предосторожности перед операцией','th':'ข้อควรระวังก่อนผ่าตัด','zh':'术前注意事项'}
,'수술 후 주의사항':{'en':'Post-surgery precautions','vi':'Lưu ý sau phẫu thuật','ar':'احتياطات ما بعد الجراحة','ru':'Меры предосторожности после операции','th':'ข้อควรระวังหลังผ่าตัด','zh':'术后注意事项'}
,'퇴원 절차':{'en':'Discharge procedure','vi':'Quy trình xuất viện','ar':'إجراءات الخروج','ru':'Процедура выписки','th':'ขั้นตอนการออกจากโรงพยาบาล','zh':'出院程序'}
,'퇴원 후 주의사항':{'en':'Post-discharge precautions','vi':'Lưu ý sau xuất viện','ar':'احتياطات ما بعد الخروج','ru':'Меры предосторожности после выписки','th':'ข้อควรระวังหลังออกจากโรงพยาบาล','zh':'出院后注意事项'}
,'입원 수속 안내':{'en':'Admission procedure guide','vi':'Hướng dẫn thủ tục nhập viện','ar':'دليل إجراءات الدخول','ru':'Руководство по госпитализации','th':'คู่มือขั้นตอนการรับเข้า','zh':'入院手续指南'}

,'태동검사를 할 거예요. 똑바로 누운 자세로 20분 정도 걸립니다. 소변 보고 오실 필요 있으신가요?':{'en':'We are going to perform a fetal movement test. The test is done while lying flat on your back and takes about 20 minutes. Do you need to use the restroom?','vi':'Chúng tôi sẽ thực hiện kiểm tra cử động thai nhi. Nằm ngửa khoảng 20 phút. Bạn có cần đi vệ sinh không?','ar':'سنجري اختبار حركة الجنين. يستغرق 20 دقيقة. هل تحتاجين للحمام؟','ru':'Мы проведём тест на движения плода. Лёжа на спине около 20 минут. Вам нужно в туалет?','th':'เราจะทำการทดสอบการเคลื่อนไหวของทารก นอนหงายประมาณ 20 นาที คุณต้องใช้ห้องน้ำไหม?','zh':'我们将进行胎动检测，请平躺约20分钟。您需要先去洗手间吗？'}

    s1:{name:'جولة الطبيب والاستشارة',items:['تُجرى الجولة 1-2 مرات يومياً صباحاً ومساءً.','إذا أردتِ استشارة إضافية، يرجى إبلاغ الممرضة.']},
    s2:{name:'معلومات الزيارة',time:'أيام الأسبوع، مرة يومياً: 18:00–20:00',limits:['يُتحكم في الدخول لجناح الولادة لمنع العدوى.','يُقيَّد الدخول يُقيَّد الدخول خارج أوقات الزيارة، ويُسمح بالدخول لمرافق واحد فقط يحمل بطاقة دخول.','تُقيَّد الزيارة أثناء المخاض أو الإجراءات.','الأطفال دون 12 عاماً والمصابون بأمراض معدية ممنوعون من الزيارة.'],proc:['اضغطي الإنتيرفون وتأكدي من إمكانية الدخول.','ادخلي عندما تُفتح الباب.','سجلي في سجل الزوار، نظفي يديك بجل الكحول ثم ادخلي الغرفة.'],highlight:'يوم الولادة/العملية\n① شخص مرافق واحد يمكنه البقاء إذا لم تكن هناك أعراض تنفسية\n② يمكن لشخصين إضافيين الزيارة لمدة ساعة'},
    s3:{name:'مواعيد الوجبات',times:[['الإفطار','07:30~08:00'],['الغداء','12:30~13:00'],['العشاء','17:50~18:30']],cancel:'يرجى الطلب مسبقاً من الممرضة.',normal:'الإفطار قبل 06:00 / الغداء قبل 11:00 / العشاء قبل 17:00',diabetic:'الإفطار قبل 04:30 / الغداء قبل 10:00 / العشاء قبل 15:00'},
    s4:{name:'ملاحظات إضافية',items:['الأجهزة الكهربائية التي تشكل خطر حريق ممنوعة.','يرجى إزالة العدسات والمكياج وطلاء الأظافر والمجوهرات.']},
    s5:{name:'آراء المرضى',items:['إذا كان لديكِ أي شكاوى أو مشكلات، يرجى إبلاغ الممرضة أو رئيسة التمريض في أي وقت.','يمكنكِ أيضاً كتابة إطراء أو شكاوى في البطاقة الموجودة في صندوق آراء المرضى.']},

  ru:{
    title:'Информация об отделении',
    s1:{name:'Обход врача и консультации',items:['Обход проводится 1–2 раза в день утром и днём.','Если нужна дополнительная консультация, попросите медсестру.']},
    s2:{name:'Информация о посещениях',time:'Будни, 1 раз в день: 18:00–20:00',limits:['Вход в родильное отделение ограничен для профилактики инфекций.','В неприёмные часы вход закрыт; допускается только 1 сопровождающий с пропуском.','Посещение ограничено во время родов или процедур.','Дети до 12 лет и лица с инфекционными заболеваниями не допускаются.'],proc:['Нажмите домофон и уточните разрешение на вход.','Войдите, когда откроется дверь.','Запишитесь в журнал посетителей, проведите гигиену рук и войдите в палату.'],highlight:'В день родов/операции\n① 1 сопровождающий может оставаться при отсутствии респираторных симптомов\n② Ещё 2 человека могут посетить в течение 1 часа'},
    s3:{name:'Время приёма пищи',times:[['Завтрак','07:30~08:00'],['Обед','12:30~13:00'],['Ужин','17:50~18:30']],cancel:'Пожалуйста, сообщите медсестре заранее.',normal:'Завтрак до 06:00 / Обед до 11:00 / Ужин до 17:00',diabetic:'Завтрак до 04:30 / Обед до 10:00 / Ужин до 15:00'},
    s4:{name:'Дополнительные требования',items:['Нагревательные приборы с риском пожара запрещены.','Пожалуйста, снимите линзы, макияж, лак и украшения.']},
    s5:{name:'Обратная связь',items:['Если у вас есть жалобы или неудобства, пожалуйста, сообщите медсестре или старшей медсестре в любое время.','Вы также можете написать похвалу или жалобу на карточке в ящике для отзывов в палате.']},

  th:{
    title:'ข้อมูลการพักรักษาในหอผู้ป่วยคลอด',
    s1:{name:'การตรวจเยี่ยมและการปรึกษา',items:['แพทย์ตรวจเยี่ยม 1–2 ครั้งต่อวัน ทั้งเช้าและบ่าย','หากต้องการปรึกษาเพิ่มเติม กรุณาแจ้งพยาบาล']},
    s2:{name:'ข้อมูลการเยี่ยม',time:'วันธรรมดา วันละ 1 ครั้ง: 18:00–20:00',limits:['ควบคุมการเข้าออกหอผู้ป่วยคลอดเพื่อป้องกันการติดเชื้อ','นอกเวลาเยี่ยม อนุญาตเฉพาะผู้ดูแล 1 คนที่มีบัตรผ่าน','การเยี่ยมถูกจำกัดระหว่างการคลอดหรือทำหัตถการ','เด็กอายุต่ำกว่า 12 ปีและผู้ป่วยโรคติดต่อไม่อนุญาตให้เยี่ยม'],proc:['กดอินเตอร์โฟนและยืนยันการอนุญาตเข้า','เข้าเมื่อประตูเปิด','กรอกสมุดบันทึกผู้เยี่ยม ทำความสะอาดมือด้วยเจลแอลกอฮอล์แล้วเข้าห้อง'],highlight:'วันคลอด/ผ่าตัด\n① ผู้ดูแล 1 คนอยู่ได้หากไม่มีอาการทางเดินหายใจ\n② อีก 2 คนสามารถเยี่ยมได้ไม่เกิน 1 ชั่วโมง'},
    s3:{name:'เวลาอาหาร',times:[['เช้า','07:30~08:00'],['เที่ยง','12:30~13:00'],['เย็น','17:50~18:30']],cancel:'กรุณาแจ้งพยาบาลล่วงหน้า',normal:'เช้าก่อน 06:00 / เที่ยงก่อน 11:00 / เย็นก่อน 17:00',diabetic:'เช้าก่อน 04:30 / เที่ยงก่อน 10:00 / เย็นก่อน 15:00'},
    s4:{name:'ข้อควรปฏิบัติอื่นๆ',items:['ห้ามนำเครื่องทำความร้อนที่มีความเสี่ยงไฟไหม้','กรุณาถอดคอนแทคเลนส์ เครื่องสำอาง ยาทาเล็บ และเครื่องประดับ']},
    s5:{name:'ความคิดเห็นของผู้ป่วย',items:['หากมีข้อร้องเรียนหรือความไม่สะดวก กรุณาแจ้งพยาบาลหรือหัวหน้าพยาบาลได้ทุกเวลา','คุณยังสามารถเขียนคำชมหรือข้อร้องเรียนในบัตรที่กล่องความคิดเห็นในห้องได้']},
  },
