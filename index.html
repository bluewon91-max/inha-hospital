<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--pk50:#FFF0F5;--pk100:#FFD6E7;--pk200:#FFB3CC;--pk400:#FF6699;--pk600:#CC3366;--pk800:#7A1F3D;}
.app{max-width:100%;width:100%;min-height:100vh;background:var(--pk50);display:flex;flex-direction:column;}
.hdr{background:linear-gradient(135deg,#E91E8C,#FF6699);padding:16px 16px 12px;}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
.logo{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid white;}
.logo img{width:100%;height:100%;object-fit:cover;}
.hdr h1{font-size:17px;font-weight:500;color:white;}
.hdr-sub{font-size:12px;color:rgba(255,255,255,0.85);}
.breadcrumb{font-size:11px;color:rgba(255,255,255,0.75);margin-top:3px;}
.back-btn{background:none;border:none;cursor:pointer;color:white;font-size:13px;opacity:0.9;margin-bottom:3px;padding:0;}
.screen{flex:1;padding:14px;display:none;overflow-y:auto;}
.screen.active{display:block;}
.scr-title{font-size:15px;font-weight:500;color:var(--pk800);margin-bottom:12px;}

/* 언어 선택 */
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.lang-btn{background:white;border:1.5px solid var(--pk200);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;}
.lang-btn:hover{border-color:var(--pk400);}
.flag-img{width:60px;height:40px;object-fit:cover;border-radius:6px;border:1px solid #eee;display:block;margin:0 auto 7px;}
.lang-name{font-size:13px;font-weight:500;color:var(--pk800);}
.lang-native{font-size:11px;color:var(--pk600);margin-top:2px;}

/* 카테고리 */
.cat-list{display:flex;flex-direction:column;gap:9px;}
.cat-btn{background:white;border:1.5px solid var(--pk200);border-radius:12px;padding:14px;cursor:pointer;display:flex;align-items:center;gap:10px;}
.cat-btn:hover{border-color:var(--pk400);}
.cat-icon{width:38px;height:38px;background:var(--pk100);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.cat-label{font-size:14px;font-weight:500;color:#333;}

/* 세부항목 */
.sub-list{display:flex;flex-direction:column;gap:7px;}

/* 메시지 카드 - 클릭시 확대 */
.msg-list{display:flex;flex-direction:column;gap:10px;}
.msg-item{background:white;border:1px solid var(--pk200);border-radius:12px;overflow:hidden;cursor:pointer;}
.msg-header{display:flex;align-items:center;gap:10px;padding:12px 14px;}
.msg-num{background:var(--pk400);color:white;border-radius:50%;width:22px;height:22px;font-size:11px;font-weight:500;text-align:center;line-height:22px;flex-shrink:0;}
.msg-kr{font-size:13px;color:#555;flex:1;line-height:1.5;}
.msg-arrow{color:var(--pk400);font-size:14px;flex-shrink:0;transition:transform 0.2s;}
.msg-body{display:none;padding:0 14px 14px 46px;}
.msg-body.open{display:block;}
.msg-tl{font-size:14px;font-weight:500;color:var(--pk800);line-height:1.6;background:var(--pk50);border-radius:8px;padding:10px 12px;}

/* NRS 이미지 */
.nrs-img{width:100%;border-radius:8px;margin:8px 0;}

/* special 화면 (I/O, Pad, 입원생활안내) */
.sp-card{background:white;border:1px solid var(--pk200);border-radius:12px;padding:14px;margin-bottom:10px;}
.sp-sec{margin-bottom:14px;}
.sp-title{font-size:13px;font-weight:500;color:var(--pk800);margin-bottom:7px;padding-bottom:6px;border-bottom:0.5px solid var(--pk100);}
.sp-sub{font-size:12px;font-weight:500;color:var(--pk600);margin:10px 0 4px;}
.sp-text{font-size:12px;color:#555;line-height:1.7;padding-left:10px;position:relative;margin-bottom:2px;}
.sp-text::before{content:"•";position:absolute;left:0;color:var(--pk400);}
.sp-sub-text{font-size:12px;color:#777;line-height:1.7;padding-left:20px;position:relative;margin-bottom:2px;}
.sp-sub-text::before{content:"-";position:absolute;left:10px;color:#bbb;}
.sp-highlight{background:var(--pk50);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:12px;color:var(--pk800);line-height:1.7;white-space:pre-line;}
.sp-img{width:100%;border-radius:8px;margin:8px 0;border:0.5px solid var(--pk100);}
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0;}
.time-card{background:var(--pk50);border-radius:7px;padding:8px;text-align:center;}
.time-label{font-size:11px;color:var(--pk600);font-weight:500;margin-bottom:3px;}
.time-val{font-size:11px;color:var(--pk800);font-weight:500;}
.ward-num{display:inline-flex;align-items:center;justify-content:center;background:var(--pk100);color:var(--pk800);border-radius:50%;width:22px;height:22px;font-size:11px;font-weight:500;flex-shrink:0;margin-right:6px;}
.ward-sec-title{display:flex;align-items:center;font-size:13px;font-weight:500;color:var(--pk800);margin-bottom:8px;padding-bottom:6px;border-bottom:0.5px solid var(--pk100);}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:8px 18px;border-radius:18px;font-size:12px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;}
</style>

<script>
const TRANS={"초음파 검사를 위해 소변을 봐야합니다. 저를 따라오면 화장실을 안내해 드릴게요.": {"en": "You need to urinate before the ultrasound. Please follow me to the restroom.", "vi": "Bạn cần đi tiểu trước khi siêu âm. Hãy theo tôi đến nhà vệ sinh.", "ar": "تحتاجين للتبول قبل الفحص. تفضلي معي إلى الحمام.", "ru": "Перед УЗИ нужно помочиться. Следуйте за мной в туалет.", "th": "คุณต้องปัสสาวะก่อนอัลตราซาวนด์ กรุณาตามฉันไปห้องน้ำ", "zh": "超声检查前需先排尿，请跟我去卫生间。"}, "속옷을 벗고 이 치마를 입고 나오세요.": {"en": "Remove your underwear and put on this gown.", "vi": "Cởi đồ lót và mặc váy này vào.", "ar": "اخلعي ملابسك الداخلية والبسي هذا الرداء.", "ru": "Снимите нижнее бельё и наденьте этот халат.", "th": "ถอดชุดชั้นในแล้วสวมเสื้อคลุมนี้", "zh": "脱下内衣，穿上这件检查服。"}, "침대에 누워서 기다리면 의사가 와서 진료를 볼 거예요.": {"en": "Please lie on the bed and wait. The doctor will come to examine you.", "vi": "Hãy nằm xuống giường và chờ. Bác sĩ sẽ đến khám.", "ar": "استلقي على السرير وانتظري. سيأتي الطبيب لفحصك.", "ru": "Лягте на кровать и подождите. Врач придёт вас осмотреть.", "th": "นอนบนเตียงและรอ แพทย์จะมาตรวจ", "zh": "请躺在床上等候，医生会来为您诊察。"}, "옷 갈아입고 나오세요. 침대에서 대기하시면 이송요원이 오실 거예요.": {"en": "Please change and wait on the bed. A transport staff will come for you.", "vi": "Thay đồ và chờ trên giường. Nhân viên vận chuyển sẽ đến.", "ar": "غيري ملابسك وانتظري على السرير. سيأتي موظف النقل.", "ru": "Переоденьтесь и подождите на кровати. Придёт транспортировщик.", "th": "เปลี่ยนเสื้อผ้าแล้วรอบนเตียง เจ้าหน้าที่จะมารับ", "zh": "请更衣后在床上等候，转运人员会来接您。"}, "1층 응급실 내 응급 원무과에서 입원 수속 후 환자팔찌를 받아서 올라와 대기해 주세요.": {"en": "Complete admission at the ER admin office (1F), receive your patient wristband, then come back up and wait.", "vi": "Làm thủ tục nhập viện tại phòng hành chính tầng 1, nhận vòng tay bệnh nhân rồi lên chờ.", "ar": "أكملي إجراءات الدخول في مكتب الطوارئ (الطابق 1)، استلمي سوار المريض ثم ارجعي وانتظري.", "ru": "Оформите госпитализацию в приёмном отделении (1 этаж), получите браслет пациента и поднимитесь ждать.", "th": "ดำเนินการรับเข้าที่แผนกฉุกเฉินชั้น 1 รับสายรัดข้อมือผู้ป่วย แล้วขึ้นมารอ", "zh": "请在1楼急诊行政办公室完成入院手续，领取患者腕带后上来等候。"}, "국가에서 지원해주는 병상입니다. 입실 시 동의서 서명이 필요합니다. 하루 입원료는 약 59,000원입니다.": {"en": "This is a government-subsidized room. Consent form required upon admission. Daily charge approx. 59,000 KRW.", "vi": "Đây là giường được nhà nước hỗ trợ. Cần ký giấy đồng ý khi nhập phòng. Phí hàng ngày khoảng 59.000 won.", "ar": "هذا سرير مدعوم حكومياً. يلزم توقيع نموذج موافقة عند الدخول. الرسوم اليومية حوالي 59,000 وون.", "ru": "Это место с государственной субсидией. При заселении нужна подпись на согласии. Стоимость в день ~59 000 вон.", "th": "เตียงนี้ได้รับการสนับสนุนจากรัฐ ต้องเซ็นใบยินยอมเมื่อเข้าพัก ค่าห้องต่อวันประมาณ 59,000 วอน", "zh": "这是政府补贴病床，入住时需签署同意书，每日住院费约59,000韩元。"}, "3인실입니다.": {"en": "This is a 3-bed room.", "vi": "Đây là phòng 3 người.", "ar": "هذه غرفة ثلاثية.", "ru": "Это трёхместная палата.", "th": "นี่คือห้อง 3 เตียง", "zh": "这是三人间病房。"}, "화장실은 가족분만실 1에서 사용하시면 됩니다.": {"en": "Please use the restroom in Family Delivery Room 1.", "vi": "Vui lòng sử dụng nhà vệ sinh tại Phòng sinh gia đình số 1.", "ar": "يرجى استخدام الحمام في غرفة الولادة العائلية 1.", "ru": "Пожалуйста, пользуйтесь туалетом в семейной родильной палате №1.", "th": "กรุณาใช้ห้องน้ำในห้องคลอดครอบครัว 1", "zh": "请使用家庭分娩室1的卫生间。"}, "7층 4인실 입원료를 내고, 분만실 안에 있는 2인실 병실을 사용할 것입니다.": {"en": "You will pay the 7F 4-bed room rate and use the 2-bed room inside the delivery ward.", "vi": "Bạn trả phí phòng 4 người tầng 7 và sử dụng phòng 2 người trong khu sinh.", "ar": "ستدفعين رسوم غرفة الأربعة أسرة في الطابق 7 وتستخدمين غرفة سريرين داخل جناح الولادة.", "ru": "Вы платите за четырёхместную палату (7 этаж) и используете двухместную палату в родильном отделении.", "th": "คุณชำระค่าห้อง 4 เตียงชั้น 7 และใช้ห้อง 2 เตียงในหอผู้ป่วยคลอด", "zh": "您将按7楼四人间病房的收费标准收费，暂时入住分娩室内的双人病房。"}, "고위험 임산부 집중치료실 자리가 생기면 그쪽으로 병실 변경 예정입니다.": {"en": "You will be transferred to the High-Risk Maternity ICU when a bed becomes available.", "vi": "Bạn sẽ được chuyển đến ICU sản phụ nguy cơ cao khi có chỗ trống.", "ar": "سيتم نقلك إلى وحدة العناية المركزة لأمراض النساء عالية المخاطر عند توفر سرير.", "ru": "При появлении места вас переведут в реанимацию для беременных высокого риска.", "th": "เมื่อมีเตียงว่างในห้อง ICU สูติกรรมความเสี่ยงสูง คุณจะถูกย้ายไป", "zh": "待高危孕产妇监护病房有床位后，将安排您转入该病房。"}, "주치의 회진은 오전, 오후 1일 1~2회 이루어집니다.": {"en": "The attending physician makes rounds 1–2 times daily, morning and afternoon.", "vi": "Bác sĩ điều trị thăm khám 1–2 lần mỗi ngày vào buổi sáng và chiều.", "ar": "يقوم الطبيب المعالج بجولة 1-2 مرات يومياً صباحاً ومساءً.", "ru": "Лечащий врач обходит 1–2 раза в день, утром и днём.", "th": "แพทย์ประจำตรวจเยี่ยมวันละ 1–2 ครั้ง ทั้งตอนเช้าและบ่าย", "zh": "主治医生每天上下午各查房1～2次。"}, "면회시간: 평일 18:00~20:00, 보호자 1명만 출입 가능합니다.": {"en": "Visiting hours: Weekdays 18:00–20:00. Only 1 guardian is allowed.", "vi": "Giờ thăm bệnh: Ngày thường 18:00–20:00. Chỉ 1 người thân được vào.", "ar": "ساعات الزيارة: أيام الأسبوع 18:00–20:00. يُسمح بشخص مرافق واحد فقط.", "ru": "Часы посещения: будни 18:00–20:00. Разрешён только 1 сопровождающий.", "th": "เวลาเยี่ยม: วันธรรมดา 18:00–20:00 อนุญาตผู้ดูแล 1 คนเท่านั้น", "zh": "探视时间：平日18:00–20:00，只允许1名家属进入。"}, "아침 07:30, 점심 12:30, 저녁 17:50에 식사가 제공됩니다.": {"en": "Meals are provided at 07:30 (breakfast), 12:30 (lunch), and 17:50 (dinner).", "vi": "Bữa ăn được phục vụ lúc 07:30 (sáng), 12:30 (trưa) và 17:50 (tối).", "ar": "تُقدَّم الوجبات في 07:30 (فطور) و12:30 (غداء) و17:50 (عشاء).", "ru": "Питание в 07:30 (завтрак), 12:30 (обед) и 17:50 (ужин).", "th": "อาหารเสิร์ฟเวลา 07:30 (เช้า), 12:30 (เที่ยง) และ 17:50 (เย็น)", "zh": "餐食时间：早餐07:30，午餐12:30，晚餐17:50。"}, "화재위험이 있는 전열기구 반입 불가, 렌즈·화장·매니큐어·장신구 제거해 주세요.": {"en": "No heating appliances allowed. Please remove contact lenses, makeup, nail polish, and jewelry.", "vi": "Không được mang thiết bị sưởi. Hãy tháo kính áp tròng, trang điểm, sơn móng và trang sức.", "ar": "ممنوع إدخال الأجهزة الكهربائية. يرجى إزالة العدسات والمكياج وطلاء الأظافر والمجوهرات.", "ru": "Нагревательные приборы запрещены. Снимите контактные линзы, макияж, лак и украшения.", "th": "ห้ามนำเครื่องทำความร้อน กรุณาถอดคอนแทคเลนส์ เครื่องสำอาง ยาทาเล็บ และเครื่องประดับ", "zh": "禁止携带电热设备，请取下隐形眼镜、卸妆、去除指甲油并摘掉饰品。"}, "태동검사를 할 거예요. 똑바로 누운 자세로 20분 정도 걸립니다.": {"en": "We are going to perform a fetal movement test. The test is done while lying flat on your back and takes about 20 minutes. Do you need to use the restroom?", "vi": "Chúng tôi sẽ kiểm tra cử động thai nhi. Nằm ngửa, khoảng 20 phút.", "ar": "سنجري اختبار حركة الجنين. استلقي على ظهرك — يستغرق حوالي 20 دقيقة.", "ru": "Будем проводить тест движений плода. Лягте на спину — займёт около 20 минут.", "th": "เราจะทำการทดสอบการเคลื่อนไหวของทารก นอนหงาย ประมาณ 20 นาที", "zh": "我们将进行胎动监测，请平躺，大约需要20分钟。"}, "태동이 있을 때 이 버튼을 눌러주세요.": {"en": "Please press this button whenever you feel fetal movement.", "vi": "Nhấn nút này khi cảm thấy thai nhi cử động.", "ar": "اضغطي على هذا الزر عند الشعور بحركة الجنين.", "ru": "Нажмите эту кнопку, когда почувствуете движение ребёнка.", "th": "กรุณากดปุ่มนี้เมื่อรู้สึกว่าลูกดิ้น", "zh": "感到胎动时请按此按钮。"}, "배뭉침이 있을 때 복부통증이 있었나요?": {"en": "Did you have abdominal pain when your abdomen tightened?", "vi": "Bạn có đau bụng khi co thắt không?", "ar": "هل شعرتِ بألم في البطن أثناء الانقباضات؟", "ru": "Были ли боли в животе во время схваток?", "th": "คุณมีอาการปวดท้องระหว่างการหดตัวไหม?", "zh": "肚子发硬（宫缩）时会有腹痛吗？"}, "초음파 검사 시행할 거예요. 소변 보고 병실 밖으로 나오면 안내해드릴게요.": {"en": "We will do an ultrasound. Please use the restroom first, then come outside your room.", "vi": "Chúng tôi sẽ siêu âm. Đi vệ sinh trước rồi ra ngoài phòng.", "ar": "سنجري فحصاً بالموجات فوق الصوتية. اذهبي للحمام أولاً ثم اخرجي من الغرفة.", "ru": "Будем делать УЗИ. Сходите в туалет и выйдите из палаты.", "th": "เราจะทำอัลตราซาวนด์ ใช้ห้องน้ำก่อนแล้วออกมาหน้าห้อง", "zh": "我们将进行超声检查，请先排尿。排尿后到病房外面来，我会带您去检查。"}, "누워 계시면 선생님이 와서 봐주십니다. 기다려주세요.": {"en": "Please lie down and wait. The doctor will come to you.", "vi": "Nằm xuống và chờ. Bác sĩ sẽ đến khám.", "ar": "استلقي وانتظري. سيأتي الطبيب إليك.", "ru": "Лягте и подождите. Врач придёт к вам.", "th": "นอนและรอ แพทย์จะมาหาคุณ", "zh": "请躺下等候，医生会来找您。"}, "피검사를 시행하겠습니다.": {"en": "We are going to draw blood for a blood test.", "vi": "Chúng tôi sẽ lấy máu xét nghiệm.", "ar": "سنأخذ عينة دم للفحص.", "ru": "Будем брать кровь на анализ.", "th": "เราจะเจาะเลือดเพื่อตรวจ", "zh": "我们要为您抽血化验。"}, "주사 없는 팔에서 시행하겠습니다.": {"en": "We will use the arm without an IV line.", "vi": "Chúng tôi sẽ lấy từ cánh tay không có IV.", "ar": "سنأخذ من الذراع الخالية من الوريد.", "ru": "Возьмём кровь из руки без капельницы.", "th": "เราจะใช้แขนที่ไม่มีสาย IV", "zh": "我们将从没有静脉注射的手臂采血。"}, "소변검사를 시행하겠습니다.": {"en": "We are going to collect a urine sample.", "vi": "Chúng tôi sẽ lấy mẫu nước tiểu.", "ar": "سنأخذ عينة بول.", "ru": "Будем собирать анализ мочи.", "th": "เราจะเก็บตัวอย่างปัสสาวะ", "zh": "我们要采集尿液样本。"}, "소변 보기 전 소독솜으로 요도 부위를 소독해주세요.": {"en": "Before urinating, please clean the urethral area with the disinfectant wipe.", "vi": "Trước khi đi tiểu, lau vùng niệu đạo bằng gạc khử trùng.", "ar": "قبل التبول، نظفي منطقة مجرى البول بمسحة مطهرة.", "ru": "Перед мочеиспусканием протрите область уретры дезинфицирующей салфеткой.", "th": "ก่อนปัสสาวะ กรุณาเช็ดบริเวณท่อปัสสาวะด้วยผ้าฆ่าเชื้อ", "zh": "排尿前请用消毒棉片清洁尿道区域。"}, "첫 소변은 버리고, 중간 소변을 종이컵에 받아주시면 됩니다.": {"en": "Discard the first stream, then collect the midstream urine in the paper cup.", "vi": "Bỏ phần đầu, lấy phần giữa vào cốc giấy.", "ar": "تخلصي من الجزء الأول، ثم اجمعي البول الأوسط في الكوب الورقي.", "ru": "Первую порцию вылейте, среднюю соберите в бумажный стакан.", "th": "ทิ้งปัสสาวะส่วนแรก แล้วเก็บส่วนกลางในถ้วยกระดาษ", "zh": "丢弃初段尿，将中段尿收集在纸杯中。"}, "파란뚜껑이 있는 통에 옮겨 담아서 통만 저에게 주세요.": {"en": "Transfer the urine to the blue-lid container and give me just the container.", "vi": "Chuyển nước tiểu vào hộp nắp xanh và đưa hộp cho tôi.", "ar": "انقلي البول إلى الوعاء ذي الغطاء الأزرق وأعطيني الوعاء فقط.", "ru": "Перелейте мочу в контейнер с синей крышкой и отдайте мне только контейнер.", "th": "เทปัสสาวะลงในภาชนะฝาสีน้ำเงินแล้วส่งภาชนะให้ฉัน", "zh": "将尿液转入蓝色瓶盖的容器中，只把容器交给我。"}, "심전도 검사를 시행하겠습니다.": {"en": "We are going to perform an ECG.", "vi": "Chúng tôi sẽ thực hiện điện tâm đồ.", "ar": "سنجري تخطيط القلب الكهربائي.", "ru": "Будем проводить ЭКГ.", "th": "เราจะทำการตรวจคลื่นไฟฟ้าหัวใจ", "zh": "我们要为您做心电图检查。"}, "검사 중 움직이지 말고, 말을 하지 말아주세요. 상의를 벗어야 합니다.": {"en": "Please do not move or speak during the test. You will need to remove your top.", "vi": "Không cử động hay nói chuyện trong khi kiểm tra. Cần cởi áo trên.", "ar": "لا تتحركي أو تتكلمي أثناء الفحص. ستحتاجين لخلع الجزء العلوي.", "ru": "Не двигайтесь и не говорите во время процедуры. Нужно снять верх.", "th": "อย่าขยับหรือพูดระหว่างการตรวจ ต้องถอดเสื้อด้านบน", "zh": "检查期间请勿移动或说话，需要脱去上衣。"}, "흉부엑스레이 검사를 시행하겠습니다.": {"en": "We are going to take a chest X-ray.", "vi": "Chúng tôi sẽ chụp X-quang ngực.", "ar": "سنجري صورة أشعة سينية للصدر.", "ru": "Будем делать рентген грудной клетки.", "th": "เราจะทำการเอกซเรย์ทรวงอก", "zh": "我们要为您拍胸部X光片。"}, "목걸이, 귀걸이, 속옷은 제거해주세요.": {"en": "Please remove your necklace, earrings, and bra.", "vi": "Hãy tháo vòng cổ, bông tai và áo ngực.", "ar": "يرجى إزالة العقد والأقراط والحمالة.", "ru": "Снимите ожерелье, серьги и бюстгальтер.", "th": "กรุณาถอดสร้อยคอ ต่างหู และชุดชั้นใน", "zh": "请取下项链、耳环和内衣。"}, "배는 가리고 찍어서 태아에게 문제가 되지 않습니다.": {"en": "Your abdomen will be shielded, so it is safe for your baby.", "vi": "Bụng sẽ được che chắn nên không ảnh hưởng đến thai nhi.", "ar": "سيتم تغطية البطن لذا فهو آمن للجنين.", "ru": "Живот будет защищён, поэтому это безопасно для ребёнка.", "th": "ท้องจะถูกป้องกัน จึงปลอดภัยสำหรับทารก", "zh": "腹部会有遮挡保护，对胎儿安全。"}, "자궁수축을 줄여주는 주사약입니다.": {"en": "This is an injection to reduce uterine contractions.", "vi": "Đây là thuốc tiêm để giảm co thắt tử cung.", "ar": "هذا حقن لتقليل انقباضات الرحم.", "ru": "Это инъекция для снижения маточных сокращений.", "th": "นี่คือยาฉีดเพื่อลดการหดตัวของมดลูก", "zh": "这是减少子宫收缩的注射药物。"}, "투약 후 1시간 후에 자궁수축 모니터링을 시행합니다.": {"en": "Uterine contraction monitoring will be done one hour after administration.", "vi": "Sẽ theo dõi co thắt tử cung 1 giờ sau khi tiêm.", "ar": "سيتم مراقبة انقباضات الرحم بعد ساعة من الحقن.", "ru": "Маточные сокращения будут контролироваться через 1 час после инъекции.", "th": "จะตรวจสอบการหดตัวของมดลูก 1 ชั่วโมงหลังการฉีด", "zh": "给药1小时后，我们将监测子宫收缩情况。"}, "부작용: 가슴두근거림, 맥박 상승이 있을 수 있으므로 불편감이 있을 시 콜벨을 눌러주세요.": {"en": "Side effects may include palpitations and an increased pulse, so please press the call bell if you feel uncomfortable.", "vi": "Tác dụng phụ: đánh trống ngực, tăng nhịp tim. Nhấn chuông nếu khó chịu.", "ar": "الآثار الجانبية: خفقان وارتفاع معدل ضربات القلب. اضغطي الجرس إذا شعرتِ بعدم ارتياح.", "ru": "Побочные эффекты: сердцебиение, учащённый пульс. Нажмите кнопку вызова при дискомфорте.", "th": "ผลข้างเคียง: ใจสั่น อัตราการเต้นของหัวใจเพิ่ม กดกริ่งถ้ารู้สึกไม่สบาย", "zh": "可能出现心悸、心率加快等副作用，如有不适请按呼叫铃。"}, "자궁수축을 줄여주는 주사제입니다.": {"en": "This injection reduces uterine contractions.", "vi": "Thuốc tiêm này giảm co thắt tử cung.", "ar": "هذا الحقن يقلل انقباضات الرحم.", "ru": "Этот препарат снижает маточные сокращения.", "th": "ยาฉีดนี้ลดการหดตัวของมดลูก", "zh": "此注射剂可减少子宫收缩。"}, "주입 초기에는 얼굴 열감, 주사 부위 불편감이 있을 수 있습니다.": {"en": "At the beginning of the infusion, you may feel facial flushing or discomfort at the injection site, so please press the call bell if you feel uncomfortable.", "vi": "Ban đầu có thể cảm thấy nóng mặt hoặc khó chịu tại chỗ tiêm.", "ar": "قد تشعرين في البداية بحرارة في الوجه أو انزعاج في موضع الحقن.", "ru": "Вначале возможны приливы жара к лицу или дискомфорт в месте инъекции.", "th": "อาจรู้สึกร้อนที่ใบหน้าหรือไม่สบายที่บริเวณฉีดยาในช่วงแรก", "zh": "初期可能出现面部潮热或注射部位不适。"}, "주입 시작 4시간 이후에 마그네슘 농도 확인을 위해 피검사를 시행합니다.": {"en": "A blood test will be done 4 hours after infusion starts to check magnesium levels.", "vi": "Xét nghiệm máu sẽ được thực hiện 4 giờ sau khi bắt đầu truyền để kiểm tra nồng độ magiê.", "ar": "سيُجرى فحص دم بعد 4 ساعات من بدء التسريب للتحقق من مستويات المغنيسيوم.", "ru": "Анализ крови на уровень магния будет проведён через 4 часа после начала инфузии.", "th": "จะทำการตรวจเลือดเพื่อตรวจระดับแมกนีเซียม 4 ชั่วโมงหลังเริ่มการให้สารน้ำ", "zh": "开始输注4小时后将进行血液检测以检查镁浓度。"}, "자궁수축을 감소시키는 약으로 특별한 부작용은 없습니다.": {"en": "This medication reduces contractions with no significant side effects.", "vi": "Thuốc này giảm co thắt và không có tác dụng phụ đáng kể.", "ar": "هذا الدواء يقلل الانقباضات ولا توجد آثار جانبية تذكر.", "ru": "Этот препарат снижает сокращения, значимых побочных эффектов нет.", "th": "ยานี้ลดการหดตัวโดยไม่มีผลข้างเคียงที่สำคัญ", "zh": "此药可抑制子宫收缩，一般无明显副作用。"}, "자궁수축을 감소시키는 경구약으로 혈압저하가 있을 수 있어 어지러움 증상이 있을 경우 즉시 알리도록 합니다.": {"en": "This oral medication reduces contractions. It may lower blood pressure — notify us immediately if dizzy.", "vi": "Thuốc uống này giảm co thắt. Có thể hạ huyết áp — báo ngay nếu chóng mặt.", "ar": "هذا الدواء الفموي يقلل الانقباضات. قد يخفض ضغط الدم — أبلغي فوراً إذا شعرتِ بدوار.", "ru": "Таблетки снижают сокращения. Возможно снижение давления — немедленно сообщите, если кружится голова.", "th": "ยาเม็ดนี้ลดการหดตัว อาจทำให้ความดันต่ำ แจ้งทันทีหากรู้สึกเวียนหัว", "zh": "此口服药可减少宫缩，可能导致血压下降，如有头晕请立即通知。"}, "자궁수축을 유발하는 주사제로 유도분만이나 분만 후 질출혈이 있을 경우 사용합니다.": {"en": "This injection induces contractions, used for labor induction or postpartum vaginal bleeding.", "vi": "Thuốc tiêm này gây co thắt, dùng cho khởi phát chuyển dạ hoặc chảy máu sau sinh.", "ar": "هذا الحقن يحفز الانقباضات، يُستخدم لتحريض المخاض أو النزيف المهبلي بعد الولادة.", "ru": "Препарат вызывает сокращения — применяется для индукции родов или при послеродовом кровотечении.", "th": "ยาฉีดนี้กระตุ้นการหดตัว ใช้สำหรับการชักนำการคลอดหรือเลือดออกทางช่องคลอดหลังคลอด", "zh": "此注射剂可诱发宫缩，用于引产或产后阴道出血。"}, "사용할 항생제에 알러지 반응 유무를 확인하는 검사로 팔 안쪽에 소량의 약물을 주입하는 검사입니다.": {"en": "This test checks for antibiotic allergy by injecting a small amount into the inner arm.", "vi": "Kiểm tra dị ứng kháng sinh bằng cách tiêm một lượng nhỏ vào mặt trong cánh tay.", "ar": "اختبار لتحديد الحساسية للمضاد الحيوي بحقن كمية صغيرة في الجزء الداخلي من الذراع.", "ru": "Тест на аллергию к антибиотику: небольшое количество вводится во внутреннюю поверхность руки.", "th": "ทดสอบการแพ้ยาปฏิชีวนะโดยฉีดยาจำนวนเล็กน้อยที่ด้านในของแขน", "zh": "通过在手臂内侧注射少量药物来检测抗生素过敏反应。"}, "조산의 가능성이 있는 경우 태어날 아기의 폐성숙을 도와주는 약으로 엉덩이 근육에 하루에 한번 총 2일 동안 투여합니다.": {"en": "If preterm birth is possible, this injection matures the baby's lungs — given once daily for 2 days in the buttock.", "vi": "Nếu có nguy cơ sinh non, thuốc này giúp phổi bé trưởng thành — tiêm bắp mông 1 lần/ngày trong 2 ngày.", "ar": "إذا كان الولادة المبكرة محتملة، يساعد هذا الحقن على نضوج رئتي الطفل — حقن في عضلة الأرداف مرة يومياً لمدة يومين.", "ru": "При риске преждевременных родов препарат ускоряет созревание лёгких — вводится в ягодицу раз в день 2 дня.", "th": "หากมีความเสี่ยงคลอดก่อนกำหนด ยานี้ช่วยพัฒนาปอดทารก ฉีดที่กล้ามเนื้อสะโพกวันละครั้ง 2 วัน", "zh": "如有早产风险，此药可促进胎儿肺成熟，每天在臀部肌肉注射一次，共注射2天。"}, "아침식사 전에 소변본 뒤 체중을 재주세요.": {"en": "Please weigh yourself after urinating, before breakfast.", "vi": "Hãy cân sau khi đi tiểu, trước bữa sáng.", "ar": "زني وزنك بعد التبول وقبل الإفطار.", "ru": "Взвеситесь после мочеиспускания, до завтрака.", "th": "กรุณาชั่งน้ำหนักหลังปัสสาวะก่อนอาหารเช้า", "zh": "请在排尿后、早餐前称体重。"}, "배뭉침이 있나요?": {"en": "Are you having contractions?", "vi": "Bạn có cảm thấy co thắt không?", "ar": "هل تشعرين بانقباضات؟", "ru": "Есть ли схватки?", "th": "คุณมีอาการเจ็บครรภ์ไหม?", "zh": "您有宫缩吗？"}, "복부통증이 있나요?": {"en": "Do you have abdominal pain?", "vi": "Bạn có đau bụng không?", "ar": "هل تشعرين بألم في البطن؟", "ru": "Есть ли боли в животе?", "th": "คุณมีอาการปวดท้องไหม?", "zh": "您有腹痛吗？"}, "태동 있나요?": {"en": "Are you feeling the baby move?", "vi": "Bạn có cảm nhận thai nhi cử động không?", "ar": "هل تشعرين بحركة الجنين؟", "ru": "Чувствуете движение ребёнка?", "th": "คุณรู้สึกว่าลูกดิ้นไหม?", "zh": "您感到胎动吗？"}, "불편하면 콜벨을 눌러주세요.": {"en": "If uncomfortable, please press the call bell.", "vi": "Nếu khó chịu, hãy nhấn chuông gọi y tá.", "ar": "إذا شعرتِ بعدم ارتياح، اضغطي جرس الاستدعاء.", "ru": "При дискомфорте нажмите кнопку вызова.", "th": "ถ้ารู้สึกไม่สบาย กรุณากดกริ่งเรียกพยาบาล", "zh": "如有不适请按呼叫铃。"}, "통증이 어떻게 되세요? 0은 통증 없음, 10은 극심한 통증입니다.": {"en": "How is your pain? 0 = no pain, 10 = worst pain possible.", "vi": "Mức độ đau của bạn? 0 = không đau, 10 = đau nhất.", "ar": "كيف ألمك؟ 0 = لا ألم، 10 = أشد ألم ممكن.", "ru": "Какова ваша боль? 0 = нет боли, 10 = сильнейшая боль.", "th": "ความเจ็บปวดของคุณเป็นอย่างไร? 0 = ไม่เจ็บ, 10 = เจ็บมากที่สุด", "zh": "您的疼痛程度如何？0=无痛，10=最剧烈的疼痛。"}, "두통, 상복부통증, 시야흐림이 있나요?": {"en": "Do you have a headache, upper abdominal pain, or blurred vision?", "vi": "Bạn có đau đầu, đau bụng trên hoặc mờ mắt không?", "ar": "هل تعانين من صداع أو ألم في البطن العلوي أو ضبابية في الرؤية؟", "ru": "Есть ли головная боль, боль в верхней части живота или нарушение зрения?", "th": "คุณมีอาการปวดหัว ปวดท้องส่วนบน หรือตามัวไหม?", "zh": "您有头痛、上腹痛或视力模糊吗？"}, "양수색은 원래 무색입니다. 색의 변화(빨강, 녹색 등)가 있으면 바로 말해주세요.": {"en": "Amniotic fluid is normally clear. Tell us immediately if you notice any color change (red, green, etc.).", "vi": "Nước ối bình thường không màu. Báo ngay nếu có thay đổi màu (đỏ, xanh, v.v.).", "ar": "السائل الأمنيوسي شفاف طبيعياً. أبلغي فوراً إذا لاحظتِ أي تغير في اللون.", "ru": "Амниотическая жидкость обычно прозрачная. Сообщите немедленно при любом изменении цвета.", "th": "น้ำคร่ำปกติจะไม่มีสี แจ้งทันทีหากสีเปลี่ยน (แดง เขียว ฯลฯ)", "zh": "羊水正常为无色，如发现颜色变化（红色、绿色等）请立即告知。"}, "30분 이내에 pad 1장이 젖을 정도의 출혈이나 덩어리로 질출혈이 있으면 바로 말해주세요.": {"en": "Tell us immediately if a pad becomes soaked within 30 minutes or if you pass blood clots.", "vi": "Báo ngay nếu một miếng lót thấm đẫm trong 30 phút hoặc có cục máu.", "ar": "أبلغي فوراً إذا ابتلت فوطة كاملة خلال 30 دقيقة أو خرجت جلطات دموية.", "ru": "Немедленно сообщите, если прокладка промокает за 30 минут или выходят сгустки крови.", "th": "แจ้งทันทีหากผ้าอนามัยเปียกภายใน 30 นาที หรือมีก้อนเลือดออก", "zh": "如果30分钟内卫生巾完全湿透或排出血块，请立即告知。"}, "투약 후 불편한 점은 없나요?": {"en": "Any discomfort after the medication?", "vi": "Có khó chịu gì sau khi dùng thuốc không?", "ar": "هل تشعرين بأي انزعاج بعد الدواء؟", "ru": "Есть ли дискомфорт после приёма лекарства?", "th": "มีความไม่สบายหลังจากใช้ยาไหม?", "zh": "用药后有任何不适吗？"}, "진통, 출산, 회복을 할 수 있는 가족분만실 사용을 원하시나요? 출생 당일만 입원료가 10만원입니다. 사용하신다면 동의서 서명 부탁드립니다.": {"en": "Would you like to use the Family Delivery Room (for labor, delivery, and recovery)? There is an additional fee of 100,000 KRW on the day of delivery. If so, please sign the consent form.", "vi": "Bạn có muốn sử dụng Phòng sinh gia đình (cho chuyển dạ, sinh và hồi phục)? Phí thêm 100.000 won vào ngày sinh. Nếu có, vui lòng ký giấy đồng ý.", "ar": "هل تريدين استخدام غرفة الولادة العائلية؟ رسوم إضافية 100,000 وون يوم الولادة. يرجى التوقيع على نموذج الموافقة.", "ru": "Хотите использовать семейную родильную палату? Дополнительная плата 100 000 вон в день родов. Пожалуйста, подпишите согласие.", "th": "คุณต้องการใช้ห้องคลอดครอบครัวไหม? ค่าเพิ่มเติม 100,000 วอนในวันคลอด ถ้าต้องการกรุณาเซ็นใบยินยอม", "zh": "您是否希望使用家庭分娩室（用于待产、分娩及产后恢复）？分娩当天需额外支付10万韩元。如需使用，请签署同意书。"}, "보호자는 내일 보호자 출입증을 발급 받고 7층 분만실로 오시면 됩니다. 제가 내일 아침에 문자 보내드릴게요.": {"en": "Your guardian should obtain a visitor pass tomorrow and come to the delivery ward on the 7th floor. I will send a text message tomorrow morning.", "vi": "Người thân cần lấy thẻ ra vào vào ngày mai và đến khu sinh tầng 7. Tôi sẽ nhắn tin vào sáng mai.", "ar": "يجب على المرافق الحصول على تصريح الدخول غداً والقدوم إلى جناح الولادة في الطابق السابع. سأرسل رسالة نصية صباح الغد.", "ru": "Сопровождающий должен получить пропуск завтра и прийти в родильное отделение на 7-м этаже. Завтра утром пришлю сообщение.", "th": "ผู้ดูแลควรรับบัตรผ่านพรุ่งนี้และมาที่หอผู้ป่วยคลอดชั้น 7 ฉันจะส่งข้อความในเช้าวันพรุ่งนี้", "zh": "家属明天领取探视证后请来7楼分娩室，我明天早上会发短信通知。"}, "제대혈 있으신가요?": {"en": "Do you have a cord blood banking kit?", "vi": "Bạn có bộ kit lưu trữ máu cuống rốn không?", "ar": "هل لديك مجموعة بنك دم الحبل السري؟", "ru": "Есть ли у вас набор для банкирования пуповинной крови?", "th": "คุณมีชุดเก็บเลือดจากสายสะดือไหม?", "zh": "您有脐带血储存套装吗？"}, "항생제 반응검사, 회음부 부위 면도 시행 예정입니다.": {"en": "An antibiotic skin test and perineal shaving will be performed.", "vi": "Sẽ thực hiện kiểm tra dị ứng kháng sinh và cạo lông vùng đáy chậu.", "ar": "سيتم إجراء اختبار جلدي للمضادات الحيوية وحلاقة منطقة العجان.", "ru": "Будет проведён кожный тест на антибиотик и бритьё промежности.", "th": "จะทำการทดสอบผิวหนังสำหรับยาปฏิชีวนะและโกนขนบริเวณฝีเย็บ", "zh": "将进行抗生素皮试和会阴部剃毛。"}, "무통주사를 원하시나요? 원하시면 무통주사도 삽입할 예정입니다.": {"en": "Would you like an epidural? If so, we will administer it.", "vi": "Bạn có muốn gây tê ngoài màng cứng không? Nếu có, chúng tôi sẽ thực hiện.", "ar": "هل تريدين التخدير فوق الجافية؟ إذا كان الجواب نعم، سنقوم بذلك.", "ru": "Хотите эпидуральную анестезию? Если да, мы её сделаем.", "th": "คุณต้องการยาระงับปวดฉีดไหม? ถ้าต้องการเราจะดำเนินการ", "zh": "您需要无痛分娩（硬膜外麻醉）吗？如需要我们将为您实施。"}, "내진 시행 후, 자궁경부를 부드럽게 해주는 질정을 삽입할 예정입니다.": {"en": "After the pelvic exam, we will insert a vaginal suppository to help soften the cervix.", "vi": "Sau khi khám âm đạo, chúng tôi sẽ đặt viên đặt âm đạo để làm mềm cổ tử cung.", "ar": "بعد الفحص الداخلي، سنضع تحميلة مهبلية لتليين عنق الرحم.", "ru": "После внутреннего осмотра введём вагинальный суппозиторий для размягчения шейки матки.", "th": "หลังการตรวจภายใน จะใส่ยาเหน็บทางช่องคลอดเพื่อช่วยให้ปากมดลูกนุ่มขึ้น", "zh": "内诊后，将插入阴道栓剂以软化宫颈。"}, "밤 12시부터 물 포함해서 금식해주세요.": {"en": "Please fast from midnight, including water.", "vi": "Nhịn ăn uống từ nửa đêm, kể cả nước.", "ar": "الرجاء الامتناع عن الطعام والشراب بما في ذلك الماء من منتصف الليل.", "ru": "С полуночи ничего не есть и не пить, включая воду.", "th": "กรุณางดอาหารและน้ำตั้งแต่เที่ยงคืน รวมถึงน้ำเปล่า", "zh": "请从午夜起禁食禁水，包括水在内。"}, "내일 5시에 자궁 수축 검사 및 내진을 할 것입니다. 이후 관장을 시행 예정입니다.": {"en": "At 5 AM tomorrow, we will perform a contraction test and internal exam, followed by an enema.", "vi": "Vào 5 giờ sáng mai, chúng tôi sẽ kiểm tra co thắt và khám âm đạo, sau đó thụt tháo.", "ar": "في الساعة 5 صباح الغد، سنجري اختبار انقباضات وفحصاً داخلياً، يتبعه حقنة شرجية.", "ru": "Завтра в 5:00 проведём тест на сокращения и внутренний осмотр, затем клизму.", "th": "พรุ่งนี้เวลา 05.00 น. จะตรวจการหดรัดตัวของมดลูกและตรวจภายใน จากนั้นจะสวนอุจจาระ", "zh": "明天5点将进行宫缩检测和内诊，之后进行灌肠。"}, "자궁 수축제를 정맥주사로 주입 시작하겠습니다. 주입 속도를 20분-30분 간격으로 증량할 예정입니다.": {"en": "We will start administering a uterine contraction agent by IV. The infusion rate will be increased every 20–30 minutes.", "vi": "Chúng tôi sẽ bắt đầu truyền tĩnh mạch thuốc co thắt tử cung. Tốc độ truyền sẽ tăng dần mỗi 20–30 phút.", "ar": "سنبدأ إعطاء عامل انقباض الرحم عبر الوريد. سيزيد معدل التسريب كل 20–30 دقيقة.", "ru": "Начнём внутривенное введение утеротонического препарата. Скорость будет увеличиваться каждые 20–30 минут.", "th": "เราจะเริ่มให้ยากระตุ้นการหดตัวของมดลูกทางหลอดเลือดดำ อัตราการให้จะเพิ่มทุก 20–30 นาที", "zh": "我们将开始静脉注射子宫收缩剂，每20–30分钟增加一次输注速度。"}, "분만 진행 동안 내진을 자주 시행 할 것입니다. 팬티를 벗고 있으세요.": {"en": "Internal exams will be performed frequently during labor. Please remove your underwear.", "vi": "Sẽ thực hiện khám âm đạo thường xuyên trong quá trình chuyển dạ. Hãy tháo quần lót.", "ar": "سيتم إجراء فحوصات داخلية متكررة أثناء المخاض. يرجى خلع الملابس الداخلية.", "ru": "Во время родов будут часто проводиться внутренние осмотры. Снимите нижнее бельё.", "th": "ระหว่างการคลอด จะมีการตรวจภายในบ่อยครั้ง กรุณาถอดกางเกงชั้นในไว้", "zh": "分娩过程中将频繁进行内诊，请保持脱去内裤的状态。"}, "양수 흐르는 느낌, 대변 마려운 느낌, 진통 증가 시 콜벨 누르세요.": {"en": "Press the call bell if you feel amniotic fluid leaking, feel the urge to defecate, or if contractions increase.", "vi": "Nhấn chuông nếu cảm thấy nước ối chảy, buồn đại tiện hoặc cơn đau tăng.", "ar": "اضغطي الجرس إذا شعرتِ بتسرب السائل الأمنيوسي أو رغبة في التبرز أو زيادة الانقباضات.", "ru": "Нажмите кнопку, если чувствуете вытекание вод, позыв к дефекации или усиление схваток.", "th": "กดกริ่งหากรู้สึกน้ำคร่ำไหล อยากถ่าย หรือเจ็บครรภ์มากขึ้น", "zh": "如感到羊水流出、想排便或阵痛加剧，请按呼叫铃。"}, "태아에게 산소공급을 위해 산소마스크를 해드릴게요.": {"en": "We will place an oxygen mask on you to supply oxygen to the baby.", "vi": "Chúng tôi sẽ đeo mặt nạ oxy cho bạn để cung cấp oxy cho bé.", "ar": "سنضع قناع الأكسجين لتزويد الجنين بالأكسجين.", "ru": "Мы наденем кислородную маску для подачи кислорода ребёнку.", "th": "เราจะสวมหน้ากากออกซิเจนให้คุณเพื่อส่งออกซิเจนให้ทารก", "zh": "我们将为您戴上氧气面罩以向胎儿供氧。"}, "자궁수축이 있을 때 들이쉬고 내쉬고 심호흡 하세요. -> 3초 동안 코로 들이마시고, 3초간 입으로 내쉬세요.": {"en": "When you have a contraction, breathe deeply in and out. → Inhale through your nose for 3 seconds, exhale through your mouth for 3 seconds.", "vi": "Khi có cơn co, hít thở sâu vào và ra. → Hít vào bằng mũi 3 giây, thở ra bằng miệng 3 giây.", "ar": "عند الانقباض، تنفسي بعمق. → شهيق من الأنف 3 ثوانٍ، زفير من الفم 3 ثوانٍ.", "ru": "При схватке дышите глубоко. → Вдох через нос 3 секунды, выдох через рот 3 секунды.", "th": "เมื่อมีการหดตัว ให้หายใจเข้าออกลึกๆ → หายใจเข้าทางจมูก 3 วินาที หายใจออกทางปาก 3 วินาที", "zh": "宫缩时请深呼吸：用鼻子吸气3秒，用嘴呼气3秒。"}, "힘주기 설명 첨부 -> 배가 뭉치면 깊게 호흡 두 번한 후 숨을 참고 10초 동안 길게 대변보듯이 힘주세요.": {"en": "Pushing instructions: When you feel a contraction, take two deep breaths, hold, then push hard for 10 seconds as if having a bowel movement.", "vi": "Hướng dẫn rặn: Khi co thắt, hít sâu hai lần, nín thở rồi rặn mạnh 10 giây như khi đại tiện.", "ar": "تعليمات الدفع: عند الانقباض، خذي نفسين عميقين، احبسي النفس ثم ادفعي بقوة 10 ثوانٍ كما لو كنتِ تتبرزين.", "ru": "Инструкция по потугам: при схватке два глубоких вдоха, задержите дыхание и тужьтесь 10 секунд как при дефекации.", "th": "วิธีเบ่ง: เมื่อมีการหดตัว หายใจลึก 2 ครั้ง กลั้นหายใจแล้วเบ่งแรง 10 วินาทีเหมือนถ่ายอุจจาระ", "zh": "用力说明：宫缩时深呼吸两次，屏气后像排便一样用力10秒。"}, "아기 만출시> 힘주지 말고 짧게 짧게 호흡하세요. 저를 따라서 호흡하세요.": {"en": "As the baby is coming out, stop pushing and take short, quick breaths. Follow my breathing.", "vi": "Khi bé ra: ngừng rặn và thở ngắn nhanh. Hãy thở theo tôi.", "ar": "عند خروج الطفل: توقفي عن الدفع وتنفسي بسرعة وقصر. اتبعي تنفسي.", "ru": "При рождении ребёнка: не тужьтесь, дышите короткими частыми вдохами. Дышите за мной.", "th": "เมื่อทารกออก หยุดเบ่งและหายใจสั้นๆ เร็วๆ หายใจตามฉัน", "zh": "胎儿即将娩出时：不要用力，请做短促而快速的呼吸，并跟着我一起呼吸。"}, "2시간 동안 금식 유지해주세요.": {"en": "Please fast for 2 hours.", "vi": "Vui lòng nhịn ăn trong 2 giờ.", "ar": "الرجاء الصيام لمدة ساعتين.", "ru": "Пожалуйста, не ешьте и не пейте 2 часа.", "th": "กรุณางดอาหารและน้ำ 2 ชั่วโมง", "zh": "请禁食2小时。"}, "분만 후 4시간 이내로 소변 보셔야합니다. 화장실 가고 싶으면 콜벨 누르세요.": {"en": "You must urinate within 4 hours after delivery. Press the call bell when you need to use the restroom.", "vi": "Bạn phải đi tiểu trong vòng 4 giờ sau sinh. Nhấn chuông khi cần đi vệ sinh.", "ar": "يجب التبول خلال 4 ساعات من الولادة. اضغطي الجرس عند الحاجة للحمام.", "ru": "Необходимо помочиться в течение 4 часов после родов. Нажмите кнопку, когда нужно в туалет.", "th": "ต้องปัสสาวะภายใน 4 ชั่วโมงหลังคลอด กดกริ่งเมื่อต้องการไปห้องน้ำ", "zh": "分娩后4小时内必须排尿，需要上厕所时请按呼叫铃。"}, "오로가 나오는 것은 정상입니다. 피덩어리가 나오거나, 계속 피가 흐르는 느낌이 있으면 콜벨 누르세요.": {"en": "Postpartum discharge (lochia) is normal. Press the call bell if you pass blood clots or feel continuous bleeding.", "vi": "Dịch hậu sản là bình thường. Nhấn chuông nếu có cục máu hoặc cảm thấy chảy máu liên tục.", "ar": "الإفرازات النفاسية طبيعية. اضغطي الجرس إذا خرجت جلطات أو شعرتِ بنزيف مستمر.", "ru": "Послеродовые выделения (лохии) — это нормально. Нажмите кнопку при сгустках или непрерывном кровотечении.", "th": "น้ำคาวปลาเป็นเรื่องปกติ กดกริ่งหากมีก้อนเลือดหรือรู้สึกเลือดไหลต่อเนื่อง", "zh": "恶露是正常现象，如排出血块或感到持续出血请按呼叫铃。"}, "2시간 동안 지켜보고, 괜찮으면 일반병동 퇴실 예정입니다.": {"en": "We will monitor you for 2 hours, and if all is well, you will be transferred to the general ward.", "vi": "Chúng tôi sẽ theo dõi 2 giờ, nếu ổn sẽ chuyển về khoa thường.", "ar": "سنراقبك لمدة ساعتين، وإذا كان كل شيء على ما يرام ستُنقلين إلى الجناح العام.", "ru": "Понаблюдаем 2 часа, и при всём в порядке переведём в общую палату.", "th": "จะเฝ้าดูคุณ 2 ชั่วโมง ถ้าทุกอย่างปกติจะย้ายไปหอผู้ป่วยทั่วไป", "zh": "观察2小时，如无异常将转至普通病房。"}, "퇴원 할 때까지, 자궁 저부를 자주 확인 할 예정입니다.": {"en": "We will frequently check your uterine fundus until discharge.", "vi": "Chúng tôi sẽ kiểm tra đáy tử cung thường xuyên cho đến khi xuất viện.", "ar": "سنتحقق من قاع الرحم بشكل متكرر حتى الخروج.", "ru": "Будем регулярно проверять дно матки до выписки.", "th": "จะตรวจยอดมดลูกบ่อยๆ จนกว่าจะออกจากโรงพยาบาล", "zh": "直到出院前将定期检查子宫底部。"}, "병동 퇴실하시면, 좌욕 하세요.": {"en": "Once you are transferred to the ward, please take a sitz bath.", "vi": "Khi chuyển về khoa, hãy ngâm bồn.", "ar": "عند انتقالك إلى الجناح، يرجى الاستحمام بالجلوس.", "ru": "При переводе в палату принимайте сидячую ванну.", "th": "เมื่อย้ายไปหอผู้ป่วย กรุณาแช่น้ำนั่ง", "zh": "转至病房后请进行坐浴。"}, "물을 포함하여 아무것도 먹지마세요.": {"en": "Do not eat or drink anything, including water.", "vi": "Không ăn uống bất cứ thứ gì, kể cả nước.", "ar": "لا تأكلي أو تشربي أي شيء بما في ذلك الماء.", "ru": "Ничего не ешьте и не пейте, включая воду.", "th": "อย่ากินหรือดื่มอะไรทั้งนั้น รวมถึงน้ำเปล่า", "zh": "请勿进食或饮水，包括水在内。"}, "흔들리는 치아, 임플란트, 교정기가 있나요?": {"en": "Do you have loose teeth, implants, or braces?", "vi": "Bạn có răng lung lay, cấy ghép răng hoặc niềng răng không?", "ar": "هل لديكِ أسنان متحركة أو زراعات أسنان أو تقويم أسنان؟", "ru": "Есть ли шатающиеся зубы, импланты или брекеты?", "th": "คุณมีฟันที่โยก รากเทียม หรือเครื่องมือจัดฟันไหม?", "zh": "您有松动的牙齿、种植牙或牙套吗？"}, "안경이나 렌즈 착용하나요?": {"en": "Do you wear glasses or contact lenses?", "vi": "Bạn đeo kính hay kính áp tròng không?", "ar": "هل تلبسين نظارات أو عدسات لاصقة؟", "ru": "Носите ли очки или контактные линзы?", "th": "คุณสวมแว่นตาหรือคอนแทคเลนส์ไหม?", "zh": "您是否佩戴眼镜或隐形眼镜？"}, "귀걸이, 목걸이, 반지 등의 장신구를 착용하고 있나요?": {"en": "Are you wearing any earrings, necklaces, rings, or other jewelry?", "vi": "Bạn có đang đeo khuyên tai, vòng cổ, nhẫn hay trang sức nào không?", "ar": "هل ترتدين أقراطاً أو قلائد أو خواتم أو مجوهرات أخرى؟", "ru": "Есть ли на вас серьги, цепочки, кольца или другие украшения?", "th": "คุณสวมต่างหู สร้อยคอ แหวน หรือเครื่องประดับอื่นๆ ไหม?", "zh": "您是否佩戴耳环、项链、戒指等饰品？"}, "손톱, 발톱, 매니큐어가 있나요?": {"en": "Do you have nail polish on your fingernails or toenails?", "vi": "Bạn có sơn móng tay hoặc móng chân không?", "ar": "هل لديك طلاء أظافر على أصابع اليد أو القدم؟", "ru": "Есть ли лак на ногтях рук или ног?", "th": "คุณมีการทาเล็บมือหรือเล็บเท้าไหม?", "zh": "您的手指甲或脚趾甲上有指甲油吗？"}, "자정부터 물 포함해서 아무것도 먹지마세요.": {"en": "Do not eat or drink anything from midnight, including water.", "vi": "Không ăn uống từ nửa đêm, kể cả nước.", "ar": "لا تأكلي أو تشربي شيئاً من منتصف الليل بما في ذلك الماء.", "ru": "С полуночи ничего не есть и не пить, включая воду.", "th": "อย่ากินหรือดื่มอะไรตั้งแต่เที่ยงคืน รวมถึงน้ำ", "zh": "从午夜（晚上12点）起请禁食禁水，包括白开水在内。"}, "귀걸이, 목걸이, 반지 등의 장신구 제거하세요.": {"en": "Please remove all jewelry including earrings, necklaces, and rings.", "vi": "Hãy tháo tất cả trang sức bao gồm khuyên tai, vòng cổ và nhẫn.", "ar": "يرجى إزالة جميع المجوهرات بما في ذلك الأقراط والقلائد والخواتم.", "ru": "Снимите все украшения: серьги, цепочки, кольца.", "th": "กรุณาถอดเครื่องประดับทั้งหมด รวมถึงต่างหู สร้อยคอ และแหวน", "zh": "请取下所有饰品，包括耳环、项链和戒指。"}, "손톱, 발톱의 매니큐어와 화장은 지워주세요.": {"en": "Please remove nail polish and makeup.", "vi": "Hãy tẩy sơn móng và trang điểm.", "ar": "يرجى إزالة طلاء الأظافر والمكياج.", "ru": "Снимите лак с ногтей и смойте макияж.", "th": "กรุณาล้างยาทาเล็บและเครื่องสำอาง", "zh": "请去除指甲油和妆容。"}, "수술실 갈 때에는 속옷 포함해서 다 벗고 수술복만 입어야 해요.": {"en": "When going to the operating room, remove all clothing including underwear and wear only the surgical gown.", "vi": "Khi vào phòng mổ, cởi tất cả kể cả đồ lót và chỉ mặc áo phẫu thuật.", "ar": "عند الذهاب لغرفة العمليات، اخلعي كل شيء بما في ذلك الملابس الداخلية والبسي ثوب الجراحة فقط.", "ru": "В операционную идите, сняв всё включая нижнее бельё, в одном хирургическом халате.", "th": "เมื่อเข้าห้องผ่าตัด ถอดทุกอย่างรวมถึงชุดชั้นในและสวมเฉพาะชุดผ่าตัด", "zh": "前往手术室时，脱去包括内衣在内的所有衣物，只穿手术服。"}, "금식해주세요.": {"en": "Please fast (no food or drink).", "vi": "Vui lòng nhịn ăn uống.", "ar": "يرجى الصيام (لا طعام ولا شراب).", "ru": "Пожалуйста, соблюдайте голодание.", "th": "กรุณางดอาหารและน้ำ", "zh": "请禁食（不得进食饮水）。"}, "30분 이내에 pad 1장이 젖을 정도의 질출혈이 있으면 말해주세요.": {"en": "Please tell us if a pad becomes soaked within 30 minutes.", "vi": "Báo cho chúng tôi nếu một miếng lót thấm đẫm trong 30 phút.", "ar": "أخبرينا إذا ابتلت فوطة كاملة خلال 30 دقيقة.", "ru": "Сообщите нам, если прокладка промокает за 30 минут.", "th": "แจ้งเจ้าหน้าที่หากมีเลือดออกทางช่องคลอดจนผ้าอนามัยเปียกเต็ม 1 แผ่นภายใน 30 นาที", "zh": "如果30分钟内卫生巾完全湿透，请告知我们。"}, "무통주사가 지속적으로 들어가고 있어요. 통증 증가 시 버튼을 누르면 약물이 더 들어갑니다.": {"en": "Pain relief medication is continuously infusing. Press the button for an extra dose if pain increases.", "vi": "Thuốc giảm đau đang được truyền liên tục. Nhấn nút để thêm liều nếu đau tăng.", "ar": "دواء تخفيف الألم يُعطى باستمرار. اضغطي الزر للحصول على جرعة إضافية إذا زاد الألم.", "ru": "Обезболивающее поступает непрерывно. Нажмите кнопку для дополнительной дозы при усилении боли.", "th": "ยาแก้ปวดกำลังให้อย่างต่อเนื่อง หากปวดมากขึ้น กรุณากดปุ่มเพื่อรับยาเพิ่ม", "zh": "止痛药正在持续输注，如疼痛加剧请按按钮追加剂量。"}, "(척수마취 시) 6시간 동안 고개를 들지 마세요.": {"en": "(Spinal anesthesia) Do not lift your head for 6 hours.", "vi": "(Gây tê tủy sống) Không nhấc đầu trong 6 giờ.", "ar": "(تخدير نخاع العمود الفقري) لا ترفعي رأسك لمدة 6 ساعات.", "ru": "(Спинальная анестезия) Не поднимайте голову 6 часов.", "th": "(การระงับความรู้สึกทางไขสันหลัง) อย่ายกหัวเป็นเวลา 6 ชั่วโมง", "zh": "（脊髓麻醉）6小时内请勿抬头。"}, "(전신마취 시) 2시간 동안 자지 말고 심호흡을 자주하시고, 가래가 있다면 뱉으세요.": {"en": "(General anesthesia) Stay awake for 2 hours, breathe deeply frequently, and cough up any phlegm.", "vi": "(Gây mê toàn thân) Thức 2 giờ, hít thở sâu thường xuyên và khạc đờm nếu có.", "ar": "(تخدير عام) ابقي مستيقظة لساعتين، تنفسي بعمق بشكل متكرر، وابصقي أي بلغم.", "ru": "(Общая анестезия) Не спите 2 часа, часто дышите глубоко и откашливайте мокроту.", "th": "(การดมยาสลบ) กรุณาอย่านอนหลับเป็นเวลา 2 ชั่วโมง หายใจลึกๆ บ่อยๆ และหากมีเสมหะให้ไอและบ้วนออก", "zh": "（全身麻醉）2小时内保持清醒，频繁深呼吸，有痰请咳出。"}, "퇴원계에서 수납안내 연락을 받으면 핸드폰으로 문자가 발송됩니다.": {"en": "You will receive a text message when it is time to pay at the discharge counter.", "vi": "Bạn sẽ nhận tin nhắn khi đến lúc thanh toán tại quầy xuất viện.", "ar": "ستتلقين رسالة نصية عندما يحين وقت الدفع في مكتب الخروج.", "ru": "Вы получите смс, когда придёт время оплаты у стойки выписки.", "th": "คุณจะได้รับข้อความเมื่อถึงเวลาชำระเงินที่เคาน์เตอร์จำหน่าย", "zh": "出院结算处通知缴费后，相关信息将以短信形式发送到您的手机。"}, "1층 퇴원계에서 진료비를 수납합니다.": {"en": "Pay your medical bill at the discharge desk on the 1st floor.", "vi": "Thanh toán viện phí tại quầy xuất viện tầng 1.", "ar": "ادفعي الفاتورة الطبية في مكتب الخروج بالطابق الأول.", "ru": "Оплатите счёт у стойки выписки на 1-м этаже.", "th": "ชำระค่ารักษาพยาบาลที่เคาน์เตอร์ออกจากโรงพยาบาลชั้น 1", "zh": "请在1楼出院窗口缴纳医疗费用。"}, "1층 퇴원약 받는 곳에서 퇴원약을 받고 약 설명을 듣습니다.": {"en": "Collect your discharge medication and receive instructions at the 1st floor pharmacy.", "vi": "Nhận thuốc ra viện và nghe hướng dẫn tại nhà thuốc tầng 1.", "ar": "احصلي على دواء الخروج واستمعي للتعليمات في صيدلية الطابق الأول.", "ru": "Получите лекарства при выписке и инструкции в аптеке на 1-м этаже.", "th": "รับยาออกจากโรงพยาบาลและรับคำแนะนำที่ร้านขายยาชั้น 1", "zh": "在1楼药房领取出院药并听取用药说明。"}, "퇴원 당일 8시간 무료주차, 지하 1층 주차정산소에서 확인하고 귀가합니다.": {"en": "Free parking for 8 hours on discharge day. Validate at the B1 parking payment office.", "vi": "Miễn phí đỗ xe 8 giờ vào ngày xuất viện. Xác nhận tại trạm thanh toán đỗ xe tầng B1.", "ar": "وقوف مجاني لمدة 8 ساعات يوم الخروج. تحقق من ذلك في مكتب دفع ركن السيارات بالطابق B1.", "ru": "Бесплатная парковка 8 часов в день выписки. Подтвердите на стойке оплаты парковки B1.", "th": "จอดฟรี 8 ชั่วโมงในวันออกจากโรงพยาบาล ยืนยันที่สถานีชำระค่าจอดรถชั้น B1", "zh": "出院当天停车8小时免费，在地下1层停车结算处确认后离开。"}, "자궁수축이 규칙적으로 있을 때, 통증이 동반될 때 병원에 와야합니다.": {"en": "Come to the hospital if you have regular contractions accompanied by pain.", "vi": "Đến bệnh viện khi có cơn co đều đặn kèm đau.", "ar": "تعالي إلى المستشفى عند وجود انقباضات منتظمة مصحوبة بألم.", "ru": "Приходите в больницу при регулярных схватках с болью.", "th": "มาโรงพยาบาลเมื่อมีการหดตัวสม่ำเสมอพร้อมกับความเจ็บปวด", "zh": "如有规律宫缩并伴有疼痛，请来医院。"}, "맑은 분비물이 흐를 때 병원을 방문해야합니다.": {"en": "Visit the hospital if you have clear fluid leaking.", "vi": "Đến bệnh viện nếu có dịch trong chảy ra.", "ar": "زوري المستشفى إذا كان هناك سائل شفاف يتسرب.", "ru": "Обратитесь в больницу при вытекании прозрачной жидкости.", "th": "มาโรงพยาบาลหากมีของเหลวใสไหลออก", "zh": "如有清澈液体流出，请来医院就诊。"}, "태동이 1시간에 2-3번도 안느껴질 때 병원에 와야합니다.": {"en": "Come to the hospital if you feel fewer than 2–3 fetal movements per hour.", "vi": "Đến bệnh viện nếu cảm thấy ít hơn 2–3 cử động thai nhi mỗi giờ.", "ar": "تعالي إلى المستشفى إذا شعرتِ بأقل من 2–3 حركات جنينية في الساعة.", "ru": "Обратитесь в больницу, если менее 2–3 движений плода в час.", "th": "มาโรงพยาบาลหากรู้สึกทารกดิ้นน้อยกว่า 2–3 ครั้งต่อชั่วโมง", "zh": "如果每小时感到的胎动少于2-3次，请来医院。"}, "질출혈이 있을 때 병원에 와야합니다.": {"en": "Come to the hospital if you have vaginal bleeding.", "vi": "Đến bệnh viện nếu có chảy máu âm đạo.", "ar": "تعالي إلى المستشفى إذا كان هناك نزيف مهبلي.", "ru": "Обратитесь в больницу при вагинальном кровотечении.", "th": "มาโรงพยาบาลหากมีเลือดออกทางช่องคลอด", "zh": "如有阴道出血，请来医院。"}, "검사 중 배뭉침이 몇 번 있었는지 세어주시고, 검사가 끝나면 알려주세요.": {"en": "During the test, please count how many times your abdomen tightens, and let me know when the test is finished.", "vi": "Trong khi kiểm tra, hãy đếm số lần bụng căng và cho tôi biết khi xong.", "ar": "أثناء الاختبار عدي كم مرة تشدد بطنك وأخبريني عند الانتهاء.", "ru": "Во время теста считайте сколько раз напрягается живот и сообщите мне по окончании.", "th": "ระหว่างการทดสอบนับจำนวนครั้งที่ท้องแข็งและแจ้งฉันเมื่อเสร็จ", "zh": "检测期间请数腹部绷紧的次数，检测结束后告诉我。"}, "배뭉침이 몇 번 있으셨나요?": {"en": "How many times did you feel abdominal tightening?", "vi": "Bạn cảm thấy bụng căng bao nhiêu lần?", "ar": "كم مرة شعرتِ بشد البطن؟", "ru": "Сколько раз напрягался живот?", "th": "คุณรู้สึกท้องแข็งกี่ครั้ง?", "zh": "您感到腹部绷紧了几次？"}, "분만실 입원생활 안내": {"en": "Delivery Ward Life Guide", "vi": "Hướng dẫn nội trú khu sinh", "ar": "دليل الإقامة في جناح الولادة", "ru": "Руководство по жизни в родильном отделении", "th": "คู่มือการพักในหอผู้ป่วยคลอด", "zh": "分娩室住院生活须知"}, "소변량이 감소할 수 있어 소변량 모니터링이 필요합니다.": {"en": "Urine output may decrease, so urine output monitoring is necessary.", "vi": "Lượng nước tiểu có thể giảm, cần theo dõi lượng nước tiểu.", "ar": "قد ينخفض إدرار البول لذا من الضروري مراقبته.", "ru": "Количество мочи может уменьшиться, необходим её мониторинг.", "th": "ปริมาณปัสสาวะอาจลดลง จึงจำเป็นต้องติดตามปริมาณปัสสาวะ", "zh": "尿量可能减少，因此需要监测尿量。"}, "임신성 고혈압의 경우 경련 예방을 위해 사용될 수 있습니다.": {"en": "In cases of pregnancy-induced hypertension, it may be used to prevent seizures.", "vi": "Trong trường hợp tăng huyết áp thai kỳ, có thể dùng để ngăn ngừa co giật.", "ar": "في حالات ارتفاع ضغط الدم الحملي قد يُستخدم لمنع النوبات.", "ru": "При гестационной гипертензии может применяться для профилактики судорог.", "th": "ในกรณีความดันโลหิตสูงขณะตั้งครรภ์อาจใช้เพื่อป้องกันอาการชัก", "zh": "妊娠期高血压时，可用于预防惊厥。"}, "입원 수속 안내": {"en": "Admission Procedure Guide", "vi": "Hướng dẫn thủ tục nhập viện", "ar": "دليل إجراءات الدخول", "ru": "Руководство по госпитализации", "th": "คู่มือขั้นตอนการรับเข้า", "zh": "入院手续指南"}, "주입 초기에는 얼굴 열감, 주사 부위 불편감이 있을 수 있으므로 불편감이 있을 시 콜벨을 눌러주세요.": {"en": "At the beginning of the infusion, you may feel facial flushing or discomfort at the injection site, so please press the call bell if you feel uncomfortable.", "vi": "Lúc đầu truyền có thể cảm thấy nóng mặt hoặc khó chịu tại chỗ tiêm, hãy nhấn chuông nếu không thoải mái.", "ar": "في بداية التسريب قد تشعرين بحرارة في الوجه أو انزعاج في موضع الحقن، اضغطي الجرس إذا شعرتِ بعدم ارتياح.", "ru": "В начале инфузии возможны приливы жара и дискомфорт - нажмите кнопку вызова при дискомфорте.", "th": "ช่วงแรกอาจรู้สึกร้อนที่ใบหน้าหรือไม่สบายที่บริเวณฉีดยา กดกริ่งถ้าไม่สบาย", "zh": "输注初期可能出现面部潮热或注射部位不适，如有不适请按呼叫铃。"}, "태동검사를 할 거예요. 똑바로 누운 자세로 20분 정도 걸립니다. 소변 보고 오실 필요 있으신가요?": {"en": "We are going to perform a fetal movement test. The test is done while lying flat on your back and takes about 20 minutes. Do you need to use the restroom?", "vi": "Chúng tôi sẽ thực hiện kiểm tra cử động thai nhi. Nằm ngửa khoảng 20 phút. Bạn có cần đi vệ sinh không?", "ar": "سنجري اختبار حركة الجنين. يستغرق 20 دقيقة. هل تحتاجين للحمام؟", "ru": "Мы проведём тест на движения плода. Лёжа на спине около 20 минут. Вам нужно в туалет?", "th": "เราจะทำการทดสอบการเคลื่อนไหวของทารก นอนหงายประมาณ 20 นาที คุณต้องใช้ห้องน้ำไหม?", "zh": "我们将进行胎动检测，请平躺约20分钟。您需要先去洗手间吗？"}, "태동이 있을 때마다 이 버튼을 눌러주세요.": {"en": "Please press this button whenever you feel fetal movement.", "vi": "Hãy nhấn nút này mỗi khi cảm thấy thai nhi cử động.", "ar": "اضغطي هذا الزر كلما شعرتِ بحركة الجنين.", "ru": "Нажимайте кнопку каждый раз, когда чувствуете движение плода.", "th": "กรุณากดปุ่มนี้ทุกครั้งที่รู้สึกว่าลูกดิ้น", "zh": "每次感到胎动时请按此按钮。"}, "항생제반응검사": {"en": "Antibiotic skin test", "vi": "Kiểm tra phản ứng kháng sinh", "ar": "اختبار تفاعل المضاد الحيوي", "ru": "Кожный тест на антибиотик", "th": "ทดสอบปฏิกิริยายาปฏิชีวนะ", "zh": "抗生素皮试"}, "배가 뭉치면 깊게 호흡 두 번한 후 숨을 참고 10초 동안 길게 대변보듯이 힘주세요.": {"en": "When you feel a contraction, take two deep breaths, hold your breath, and push hard for 10 seconds as if having a bowel movement.", "vi": "Khi co thắt, hít sâu hai lần, nín thở rồi rặn mạnh 10 giây như khi đại tiện.", "ar": "عند الانقباض خذي نفسين عميقين احبسي النفس ثم ادفعي بقوة 10 ثوانٍ كما لو كنتِ تتبرزين.", "ru": "При схватке два глубоких вдоха, задержите дыхание и тужьтесь 10 секунд как при дефекации.", "th": "เมื่อมีการหดตัว หายใจลึก 2 ครั้ง กลั้นหายใจแล้วเบ่งแรง 10 วินาทีเหมือนถ่ายอุจจาระ", "zh": "宫缩时深呼吸两次，屏气后像排便一样用力10秒。"}, "태아 활동 감소가 있어 좌측위 또는 우측위로 누워주세요.": {"en": "Due to decreased fetal movement, please lie on your left or right side.", "vi": "Do thai nhi giảm hoạt động, vui lòng nằm nghiêng sang trái hoặc phải.", "ar": "نظراً لانخفاض حركة الجنين، يرجى الاستلقاء على جانبكِ الأيسر أو الأيمن.", "ru": "В связи со снижением активности плода, пожалуйста, лягте на левый или правый бок.", "th": "เนื่องจากทารกเคลื่อนไหวลดลง กรุณานอนตะแคงซ้ายหรือขวา", "zh": "由于胎动减少，请侧卧（左侧或右侧）。"}, "태아 활동 감소가 있어 산소 마스크 적용하겠습니다. 심호흡 해주세요.": {"en": "Due to decreased fetal movement, we will apply an oxygen mask. Please breathe deeply.", "vi": "Do thai nhi giảm hoạt động, chúng tôi sẽ đặt mặt nạ oxy. Vui lòng thở sâu.", "ar": "نظراً لانخفاض حركة الجنين، سنضع قناع الأكسجين. يرجى التنفس بعمق.", "ru": "В связи со снижением активности плода мы наложим кислородную маску. Пожалуйста, дышите глубоко.", "th": "เนื่องจากทารกเคลื่อนไหวลดลง เราจะสวมหน้ากากออกซิเจน กรุณาหายใจลึกๆ", "zh": "由于胎动减少，将为您佩戴氧气面罩，请深呼吸。"}, "검사 후 입원이 결정되었습니다. 1층 응급실 내 응급 원무과에서 입원 수속 후 환자팔찌를 받아서 올라와 대기해 주세요.": {"en": "Hospitalization has been decided after examination. Please complete admission at the emergency administration office on the 1st floor, receive your patient wristband, and come back up to wait.", "vi": "Đã quyết định nhập viện sau khi kiểm tra. Vui lòng hoàn thành thủ tục nhập viện tại phòng hành chính cấp cứu tầng 1, nhận vòng tay bệnh nhân rồi lên chờ.", "ar": "تقرر الدخول إلى المستشفى بعد الفحص. يرجى إكمال إجراءات الدخول في مكتب الطوارئ بالطابق الأول واستلام سوار المريض ثم العودة والانتظار.", "ru": "После обследования принято решение о госпитализации. Пройдите оформление в приёмном отделении на 1 этаже, получите браслет пациента и поднимитесь ждать.", "th": "ตัดสินใจรับเข้าโรงพยาบาลหลังการตรวจ กรุณาดำเนินการรับเข้าที่แผนกธุรการฉุกเฉินชั้น 1 รับสายรัดข้อมือผู้ป่วย แล้วขึ้นมารอ", "zh": "检查后决定住院。请到1楼急诊住院处办理入院手续，领取患者腕带后上楼等候。"}, "DR (7층)": {"en": "DR (7th Floor)", "vi": "DR (Tầng 7)", "ar": "DR (الطابق 7)", "ru": "DR (7 этаж)", "th": "DR (ชั้น 7)", "zh": "DR（7楼）"}, "NST (태동검사)": {"en": "NST (Fetal Movement Test)", "vi": "NST (Kiểm tra cử động thai)", "ar": "NST (اختبار حركة الجنين)", "ru": "NST (Тест движений плода)", "th": "NST (การทดสอบการเคลื่อนไหวของทารก)", "zh": "NST（胎动检查）"}, "속옷을 벗고 누워계시면 선생님이 와서 봐주십니다. 기다려주세요.": {"en": "Please remove your underwear and lie down. The doctor will come to see you. Please wait.", "vi": "Vui lòng cởi đồ lót và nằm xuống. Bác sĩ sẽ đến khám. Vui lòng chờ.", "ar": "يرجى خلع ملابسكِ الداخلية والاستلقاء. سيأتي الطبيب لفحصكِ. يرجى الانتظار.", "ru": "Пожалуйста, снимите нижнее бельё и лягте. Врач придёт вас осмотреть. Подождите.", "th": "กรุณาถอดชุดชั้นในและนอนลง แพทย์จะมาตรวจ กรุณารอ", "zh": "请脱下内裤后躺好，医生会过来为您检查，请稍等。"}, "EKG (심전도)": {"en": "EKG (Electrocardiogram)", "vi": "EKG (Điện tâm đồ)", "ar": "EKG (تخطيط القلب)", "ru": "ЭКГ (Электрокардиограмма)", "th": "EKG (คลื่นไฟฟ้าหัวใจ)", "zh": "EKG（心电图）"}, "BST (혈당측정)": {"en": "BST (Blood Sugar Test)", "vi": "BST (Đo đường huyết)", "ar": "BST (قياس سكر الدم)", "ru": "BST (Измерение сахара крови)", "th": "BST (การวัดน้ำตาลในเลือด)", "zh": "BST（血糖测量）"}, "식이조절시 : 하루 4번 혈당 측정합니다.<br>아침식사 전, 매식사 시간으로부터 1시간 후": {"en": "Diet control: Blood sugar is measured 4 times a day.<br>Before breakfast, and 1 hour after the start of each meal.", "vi": "Kiểm soát chế độ ăn: Đo đường huyết 4 lần/ngày.<br>Trước bữa sáng và 1 giờ sau khi bắt đầu mỗi bữa ăn.", "ar": "عند ضبط النظام الغذائي: يُقاس سكر الدم 4 مرات يومياً.<br>قبل الإفطار وبعد ساعة من بدء كل وجبة.", "ru": "При диетическом контроле: сахар крови измеряется 4 раза в день.<br>До завтрака и через 1 час после начала каждого приёма пищи.", "th": "ควบคุมอาหาร: วัดน้ำตาลในเลือด 4 ครั้ง/วัน<br>ก่อนอาหารเช้า และ 1 ชั่วโมงหลังเริ่มทานอาหารแต่ละมื้อ", "zh": "饮食控制时：每天测量4次血糖。<br>早餐前及每餐开始后1小时。"}, "인슐린 투약시 : 하루 7번 혈당 측정합니다.<br>매 식사전, 매식사 시작시간으로부터 1시간 후, 자기 전": {"en": "Insulin administration: Blood sugar is measured 7 times a day.<br>Before each meal, 1 hour after the start of each meal, and before bed.", "vi": "Khi dùng insulin: Đo đường huyết 7 lần/ngày.<br>Trước mỗi bữa ăn, 1 giờ sau khi bắt đầu mỗi bữa và trước khi ngủ.", "ar": "عند إعطاء الأنسولين: يُقاس سكر الدم 7 مرات يومياً.<br>قبل كل وجبة وبعد ساعة من بدء كل وجبة وقبل النوم.", "ru": "При введении инсулина: сахар крови измеряется 7 раз в день.<br>До каждого приёма пищи, через 1 час после начала и перед сном.", "th": "เมื่อใช้อินซูลิน: วัดน้ำตาลในเลือด 7 ครั้ง/วัน<br>ก่อนทานอาหารทุกมื้อ 1 ชั่วโมงหลังเริ่มทานอาหารทุกมื้อ และก่อนนอน", "zh": "使用胰岛素时：每天测量7次血糖。<br>每餐前、每餐开始后1小时及睡前。"}, "약물 주입 초기에 얼굴의 화끈거림, 갈증, 정맥 주사 부위 불편감, 약간의 어지러움을 느낄 수 있으나 1시간 정도 지나면 증상이 호전 됩니다.": {"en": "At the beginning of the infusion, you may feel facial flushing, thirst, discomfort at the injection site, or slight dizziness, but these symptoms will improve after about 1 hour.", "vi": "Lúc đầu truyền, bạn có thể cảm thấy nóng mặt, khát nước, khó chịu tại chỗ tiêm hoặc hơi chóng mặt, nhưng các triệu chứng sẽ cải thiện sau khoảng 1 giờ.", "ar": "في بداية التسريب قد تشعرين بحرارة في الوجه والعطش وعدم الارتياح في موضع الحقن وشيء من الدوار، لكن هذه الأعراض ستتحسن بعد نحو ساعة.", "ru": "В начале инфузии вы можете почувствовать жар в лице, жажду, дискомфорт в месте инъекции или лёгкое головокружение, но эти симптомы улучшатся примерно через 1 час.", "th": "ในช่วงแรกของการให้ยาอาจรู้สึกร้อนที่ใบหน้า กระหายน้ำ ไม่สบายที่บริเวณฉีดยา หรือเวียนหัวเล็กน้อย แต่อาการจะดีขึ้นหลังจากประมาณ 1 ชั่วโมง", "zh": "输注初期可能出现面部潮热、口渴、注射部位不适或轻微头晕，约1小时后症状会改善。"}, "기타 부작용<br>- 소화기계 : 구토, 구강 건조<br>- 근육신경계 : 두통, 힘빠짐, 어지러움": {"en": "Other side effects<br>- Digestive: nausea/vomiting, dry mouth<br>- Musculoskeletal/neurological: headache, weakness, dizziness", "vi": "Tác dụng phụ khác<br>- Tiêu hóa: buồn nôn/nôn, khô miệng<br>- Cơ thần kinh: đau đầu, mệt mỏi, chóng mặt", "ar": "آثار جانبية أخرى<br>- الجهاز الهضمي: غثيان/قيء، جفاف الفم<br>- الجهاز العصبي العضلي: صداع، ضعف، دوار", "ru": "Другие побочные эффекты<br>- ЖКТ: тошнота/рвота, сухость во рту<br>- Мышечно-нервная система: головная боль, слабость, головокружение", "th": "ผลข้างเคียงอื่นๆ<br>- ระบบทางเดินอาหาร: คลื่นไส้/อาเจียน ปากแห้ง<br>- ระบบประสาทกล้ามเนื้อ: ปวดหัว อ่อนแรง เวียนหัว", "zh": "其他副作用<br>- 消化系统：恶心/呕吐、口干<br>- 肌肉神经系统：头痛、乏力、头晕"}, "Tractocile 비용 설명<br>- 급여의 경우 : 국가에서 4 cycle까지 지원하여 1 cycle에 대략 8 만원대입니다.<br>- 비급여의 경우 : 1 cycle에 대략 40 만원대입니다.<br>** 비용은 변동가능성 있으므로 대략적으로 생각해주세요 **": {"en": "Tractocile cost information<br>- Covered: Government supports up to 4 cycles, approx. 80,000 KRW/cycle.<br>- Not covered: Approx. 400,000 KRW/cycle.<br>** Costs may vary, please consider this as an estimate. **", "vi": "Thông tin chi phí Tractocile<br>- Bảo hiểm: Nhà nước hỗ trợ đến 4 chu kỳ, khoảng 80.000 won/chu kỳ.<br>- Không bảo hiểm: Khoảng 400.000 won/chu kỳ.<br>** Chi phí có thể thay đổi, vui lòng xem đây là ước tính. **", "ar": "معلومات تكلفة Tractocile<br>- مع التأمين: تدعم الحكومة حتى 4 دورات، بتكلفة تقريبية 80,000 وون للدورة.<br>- بدون تأمين: حوالي 400,000 وون للدورة.<br>** قد تتغير التكاليف، يرجى اعتبار هذا تقديراً تقريبياً. **", "ru": "Стоимость Tractocile<br>- При страховке: государство субсидирует до 4 курсов, ~80,000 вон/курс.<br>- Без страховки: ~400,000 вон/курс.<br>** Стоимость может изменяться, это приблизительная оценка. **", "th": "ข้อมูลค่าใช้จ่าย Tractocile<br>- มีประกัน: รัฐสนับสนุนสูงสุด 4 รอบ ~80,000 วอน/รอบ<br>- ไม่มีประกัน: ~400,000 วอน/รอบ<br>** ค่าใช้จ่ายอาจเปลี่ยนแปลง กรุณาถือเป็นการประมาณการ **", "zh": "Tractocile费用说明<br>- 医保适用时：国家最多补助4个疗程，每个疗程患者自付费用约8万韩元。<br>- 非医保（自费）时：每个疗程约40万韩元。<br>实际费用可能因情况不同而有所变动，仅供参考。"}, "항생제 희석된 주사와 생리식염수 주사를 두 번 투약 합니다. 통증 있습니다.": {"en": "We will administer two injections: a diluted antibiotic and normal saline. There will be some pain.", "vi": "Chúng tôi sẽ tiêm hai lần: kháng sinh pha loãng và nước muối sinh lý. Sẽ có đau.", "ar": "سنعطيكِ حقنتين: مضاد حيوي مخفف ومحلول ملحي. ستشعرين ببعض الألم.", "ru": "Мы введём два укола: разведённый антибиотик и физраствор. Будет небольшая боль.", "th": "เราจะฉีดสองครั้ง: ยาปฏิชีวนะที่เจือจางและน้ำเกลือ จะมีอาการเจ็บบ้าง", "zh": "将进行两次注射：稀释的抗生素和生理盐水。会有一些疼痛。"}, "15분~20분 뒤에 주사부위에 팽진이나 발적이 있는지 확인하겠습니다.": {"en": "After 15-20 minutes, we will check the injection site for swelling or redness.", "vi": "Sau 15-20 phút, chúng tôi sẽ kiểm tra vị trí tiêm xem có sưng hoặc đỏ không.", "ar": "بعد 15-20 دقيقة سنتحقق من موضع الحقن للتأكد من عدم وجود تورم أو احمرار.", "ru": "Через 15-20 минут проверим место инъекции на наличие отёка или покраснения.", "th": "หลังจาก 15-20 นาที เราจะตรวจดูบริเวณฉีดยาว่ามีอาการบวมหรือแดงไหม", "zh": "15-20分钟后，我们将检查注射部位是否有肿胀或发红。"}, "NRS (통증 점수)": {"en": "NRS (Pain Score)", "vi": "NRS (Điểm đau)", "ar": "NRS (درجة الألم)", "ru": "NRS (Шкала боли)", "th": "NRS (คะแนนความเจ็บปวด)", "zh": "NRS（疼痛评分）"}, "PIH (임신성고혈압)": {"en": "PIH (Pregnancy-Induced Hypertension)", "vi": "PIH (Tăng huyết áp thai kỳ)", "ar": "PIH (ارتفاع ضغط الدم الحملي)", "ru": "PIH (Гипертензия беременных)", "th": "PIH (ความดันโลหิตสูงขณะตั้งครรภ์)", "zh": "PIH（妊娠高血压）"}, "PROM (양수파막)": {"en": "PROM (Premature Rupture of Membranes)", "vi": "PROM (Vỡ ối sớm)", "ar": "PROM (انفجار الأغشية المبكر)", "ru": "PROM (Преждевременный разрыв оболочек)", "th": "PROM (ถุงน้ำคร่ำแตกก่อนกำหนด)", "zh": "PROM（胎膜早破）"}, "I/O (음수량 및 배설량)": {"en": "I/O (Fluid Intake and Output)", "vi": "I/O (Lượng vào và ra)", "ar": "I/O (كمية السوائل الداخلة والخارجة)", "ru": "I/O (Водный баланс)", "th": "I/O (ปริมาณน้ำเข้าและออก)", "zh": "I/O（出入量）"}, "Pad Count": {"en": "Pad Count", "vi": "Đếm băng vệ sinh", "ar": "عدد الفوط", "ru": "Подсчёт прокладок", "th": "นับแผ่นอนามัย", "zh": "护垫计数"}, "(무통주사 삽입 시) 무통주사 주입을 위한 관을 삽입하겠습니다. 옆으로 돌아누워 목은 숙이고 양 무릎은 굽혀 가슴에 붙이는 자세를 취해주세요. 국소마취 할 때 바늘이 들어가 통증이 있을 수 있고 시술과정 중 불편감이 있을 수 있습니다. 시술하는 동안 움직이시면 안됩니다.": {"en": "(Epidural insertion) We will insert a tube for the epidural. Please lie on your side, tuck your chin, and bring both knees up to your chest. There may be pain when the needle is inserted for local anesthesia and discomfort during the procedure. Please do not move during the procedure.", "vi": "(Khi đặt gây tê ngoài màng cứng) Chúng tôi sẽ đặt ống để tiêm thuốc tê. Vui lòng nằm nghiêng, cúi đầu và gập cả hai đầu gối vào ngực. Có thể đau khi kim đâm vào và khó chịu trong quá trình thực hiện. Vui lòng không cử động.", "ar": "(عند إدخال التخدير فوق الجافية) سنُدخل أنبوباً لحقن دواء التخدير. يرجى الاستلقاء على الجانب وإمالة الرأس للأمام وثني الركبتين نحو الصدر. قد تشعرين بألم عند إدخال الإبرة وانزعاج خلال الإجراء. يرجى عدم التحرك.", "ru": "(При установке эпидурального катетера) Мы введём трубку для эпидуральной анестезии. Лягте на бок, опустите подбородок и согните оба колена к груди. При введении иглы может быть боль и дискомфорт. Пожалуйста, не двигайтесь во время процедуры.", "th": "(เมื่อใส่ยาระงับปวด) เราจะใส่สายสำหรับยาระงับปวด กรุณานอนตะแคง ก้มคอ และงอเข่าทั้งสองข้างขึ้นมาที่หน้าอก อาจมีอาการเจ็บเมื่อเข็มเข้าและไม่สบายระหว่างทำหัตถการ กรุณาอย่าขยับ", "zh": "（插入无痛分娩导管时）我们将插入导管。请侧卧，低头，双膝弯曲贴近胸部。局部麻醉时可能会痛，操作中可能有不适感。操作期间请勿移动。"}, "(무통주사 삽입 후) 무통주사가 들어가는 관만 삽입한 상태입니다. 초산모기준 3~4 cm, 경산모기준 3 cm 정도의 자궁 경부 개대 시 무통주사 약물 투약예정입니다.": {"en": "(After epidural insertion) Only the tube has been inserted. We plan to administer the epidural when the cervix is dilated about 3-4 cm for first-time mothers and about 3 cm for mothers who have given birth before.", "vi": "(Sau khi đặt gây tê) Chỉ mới đặt ống dẫn thuốc. Chúng tôi dự định tiêm thuốc khi cổ tử cung mở khoảng 3-4 cm với sản phụ lần đầu và khoảng 3 cm với sản phụ đã sinh trước.", "ar": "(بعد إدخال التخدير) تم إدخال الأنبوب فقط. نخطط لإعطاء دواء التخدير عند اتساع عنق الرحم نحو 3-4 سم للأمهات لأول مرة ونحو 3 سم للأمهات اللواتي أنجبن من قبل.", "ru": "(После установки катетера) Пока введена только трубка. Препарат введём при раскрытии шейки матки на 3-4 см у первородящих и на 3 см у повторнородящих.", "th": "(หลังใส่ยาระงับปวด) ใส่เพียงสายสำหรับยาระงับปวดแล้ว วางแผนจะให้ยาเมื่อปากมดลูกเปิดประมาณ 3-4 ซม. สำหรับมารดาครรภ์แรก และประมาณ 3 ซม. สำหรับมารดาที่เคยคลอดแล้ว", "zh": "（无痛分娩导管置入后）目前仅放置了导管，尚未开始给药。计划在初产妇宫口开大约3–4厘米、经产妇约3厘米时开始注入无痛分娩药物。"}, "(무통주사 투약 시) 부작용으로 저혈압 및 어지러움, 가슴답답함, 요저류 등이 있을 수 있습니다. 10분 간격으로 혈압 측정하겠습니다. 증상 있을 시 간호사 호출벨을 눌러주세요.": {"en": "(During epidural administration) Side effects may include low blood pressure, dizziness, chest tightness, and urinary retention. We will measure your blood pressure every 10 minutes. Please press the nurse call bell if you have any symptoms.", "vi": "(Khi tiêm thuốc gây tê) Tác dụng phụ có thể gồm hạ huyết áp, chóng mặt, tức ngực và bí tiểu. Chúng tôi sẽ đo huyết áp mỗi 10 phút. Vui lòng nhấn chuông gọi y tá nếu có triệu chứng.", "ar": "(عند إعطاء دواء التخدير) قد تشمل الآثار الجانبية انخفاض ضغط الدم والدوار وضيق الصدر واحتباس البول. سنقيس ضغط الدم كل 10 دقائق. يرجى الضغط على جرس استدعاء الممرضة عند ظهور أي أعراض.", "ru": "(При введении препарата) Побочные эффекты: низкое давление, головокружение, стеснение в груди, задержка мочи. Измеряем давление каждые 10 минут. Нажмите кнопку вызова медсестры при симптомах.", "th": "(ขณะให้ยาระงับปวด) ผลข้างเคียงอาจรวมถึงความดันโลหิตต่ำ เวียนหัว แน่นหน้าอก ปัสสาวะคั่ง เราจะวัดความดันทุก 10 นาที กรุณากดกริ่งเรียกพยาบาลหากมีอาการ", "zh": "（注射无痛分娩药物时）副作用可能包括低血压、头晕、胸闷和尿潴留。每10分钟测量一次血压。如有症状请按呼叫铃。"}, "관장을 위해 왼쪽으로 돌아누워 주세요. 약이 들어간 후 5~10 분 정도 최대한 참아주시고 대변 보시면 알려주세요.": {"en": "Please turn to lie on your left side for the enema. After the medication is administered, please hold it in for about 5-10 minutes as long as possible, and let us know when you need to have a bowel movement.", "vi": "Vui lòng nằm nghiêng sang trái để thụt tháo. Sau khi thuốc được đưa vào, hãy cố nhịn khoảng 5-10 phút và cho chúng tôi biết khi cần đại tiện.", "ar": "يرجى الاستلقاء على جانبكِ الأيسر من أجل الحقنة الشرجية. بعد إعطاء الدواء احتفظي به لمدة 5-10 دقائق قدر الإمكان وأخبرينا عندما تحتاجين للتبرز.", "ru": "Пожалуйста, повернитесь на левый бок для клизмы. После введения постарайтесь удержать около 5-10 минут и сообщите нам, когда почувствуете позыв к дефекации.", "th": "กรุณานอนตะแคงซ้ายเพื่อทำการสวนอุจจาระ หลังจากใส่ยาแล้ว กรุณากลั้นไว้ประมาณ 5–10 นาทีให้นานที่สุด และแจ้งเจ้าหน้าที่เมื่อถ่ายอุจจาระแล้ว", "zh": "请向左侧卧以进行灌肠。药物注入后请尽量忍住5-10分钟，需要排便时请告知我们。"}, "NPO (금식)": {"en": "NPO (Nothing by Mouth / Fasting)", "vi": "NPO (Nhịn ăn uống)", "ar": "NPO (الصيام - ممنوع الأكل والشرب)", "ru": "NPO (Ничего через рот / Голодание)", "th": "NPO (งดอาหารและน้ำ)", "zh": "NPO（禁食）"}, "수술 전 처치표": {"en": "Pre-operative Treatment Chart", "vi": "Bảng xử lý trước phẫu thuật", "ar": "جدول العلاج قبل الجراحة", "ru": "Лист предоперационной подготовки", "th": "แบบบันทึกการเตรียมก่อนผ่าตัด", "zh": "术前处置表"}, "수술 전 주의사항": {"en": "Pre-operative Precautions", "vi": "Lưu ý trước phẫu thuật", "ar": "تعليمات ما قبل الجراحة", "ru": "Меры предосторожности перед операцией", "th": "ข้อควรระวังก่อนผ่าตัด", "zh": "术前注意事项"}, "유치도뇨관 삽입 : 수술실 가기전에 유치도뇨관 삽입하겠습니다.(제왕절개)": {"en": "Urinary catheter insertion: We will insert a urinary catheter before going to the operating room. (Cesarean section)", "vi": "Đặt ống thông tiểu: Chúng tôi sẽ đặt ống thông tiểu trước khi vào phòng mổ. (Mổ lấy thai)", "ar": "إدخال قسطرة بولية: سيتم إدخال قسطرة بولية قبل الذهاب إلى غرفة العمليات. (عملية قيصرية)", "ru": "Установка мочевого катетера: мы установим катетер перед операционной. (Кесарево сечение)", "th": "การใส่สายสวนปัสสาวะ: เราจะใส่สายสวนปัสสาวะก่อนเข้าห้องผ่าตัด (การผ่าคลอด)", "zh": "留置导尿管：手术前将为您插入导尿管。（剖腹产）"}, "수술부위 면도 : 클리퍼를 이용하여 제모합니다.": {"en": "Surgical site shaving: We will remove hair using a clipper.", "vi": "Cạo lông vùng phẫu thuật: Chúng tôi sẽ loại bỏ lông bằng tông đơ.", "ar": "حلاقة منطقة الجراحة: سيتم إزالة الشعر باستخدام ماكينة الحلاقة.", "ru": "Бритьё операционного поля: мы удалим волосы с помощью машинки.", "th": "การโกนขนบริเวณผ่าตัด: เราจะใช้ที่โกนขนไฟฟ้าในการกำจัดขน", "zh": "手术部位备皮：使用电动剃毛器进行备皮。"}, "수술 후 주의사항": {"en": "Post-operative Precautions", "vi": "Lưu ý sau phẫu thuật", "ar": "تعليمات ما بعد الجراحة", "ru": "Меры предосторожности после операции", "th": "ข้อควรระวังหลังผ่าตัด", "zh": "术后注意事项"}, "자궁저부 위치 확인 하겠습니다. 출혈 확인을 위해 필요한 절차이니 협조 부탁드립니다.": {"en": "We will check the position of the uterine fundus. This is a necessary procedure to check for bleeding, so please cooperate.", "vi": "Chúng tôi sẽ kiểm tra vị trí đáy tử cung. Đây là thủ thuật cần thiết để kiểm tra xuất huyết, vui lòng hợp tác.", "ar": "سنتحقق من موضع قاع الرحم. هذا إجراء ضروري للتحقق من النزيف لذا يرجى التعاون.", "ru": "Мы проверим положение дна матки. Это необходимая процедура для контроля кровотечения, пожалуйста, сотрудничайте.", "th": "เราจะตรวจสอบตำแหน่งยอดมดลูก นี่เป็นขั้นตอนที่จำเป็นเพื่อตรวจสอบการมีเลือดออก กรุณาให้ความร่วมมือ", "zh": "我们将检查子宫底位置，这是检查出血的必要步骤，请配合。"}, "퇴원 후 주의사항": {"en": "Post-discharge Precautions", "vi": "Lưu ý sau xuất viện", "ar": "تعليمات ما بعد الخروج من المستشفى", "ru": "Меры предосторожности после выписки", "th": "ข้อควรระวังหลังออกจากโรงพยาบาล", "zh": "出院后注意事项"}, "입원정보조사를 하겠습니다. 환자분은 본인 핸드폰으로 번역앱을 켜주세요.": {"en": "We will conduct an admission survey. Please open a translation app on your phone.", "vi": "Chúng tôi sẽ tiến hành khảo sát nhập viện. Vui lòng mở ứng dụng dịch trên điện thoại.", "ar": "سنجري استبيان معلومات الدخول. يرجى فتح تطبيق الترجمة على هاتفكِ.", "ru": "Мы проведём опрос для госпитализации. Пожалуйста, откройте приложение-переводчик на телефоне.", "th": "เราจะทำการสำรวจข้อมูลการรับเข้า กรุณาเปิดแอปแปลภาษาบนโทรศัพท์", "zh": "我们将进行入院信息调查。请在手机上打开翻译应用。"}, "왜 병원에 오셨나요?": {"en": "Why did you come to the hospital?", "vi": "Tại sao bạn đến bệnh viện?", "ar": "لماذا أتيتِ إلى المستشفى؟", "ru": "Почему вы пришли в больницу?", "th": "ทำไมคุณถึงมาโรงพยาบาล?", "zh": "您为什么来住院？"}, "키, 몸무게가 어떻게 되나요?": {"en": "What is your height and weight?", "vi": "Chiều cao và cân nặng của bạn là bao nhiêu?", "ar": "ما طولكِ ووزنكِ؟", "ru": "Каков ваш рост и вес?", "th": "ส่วนสูงและน้ำหนักของคุณเป็นเท่าไหร่?", "zh": "您的身高和体重是多少？"}, "임신 전 체중은 몇 kg 인가요?": {"en": "What was your weight before pregnancy (kg)?", "vi": "Cân nặng trước khi mang thai của bạn là bao nhiêu kg?", "ar": "ما وزنكِ قبل الحمل (كجم)؟", "ru": "Каков был ваш вес до беременности (кг)?", "th": "น้ำหนักของคุณก่อนตั้งครรภ์คือกี่กิโลกรัม?", "zh": "您怀孕前的体重是多少公斤？"}, "90일 내에 다른 병원에 입원한 적이 있나요?": {"en": "Have you been hospitalized at another hospital within the past 90 days?", "vi": "Bạn có nhập viện ở bệnh viện khác trong vòng 90 ngày qua không?", "ar": "هل تم إدخالكِ إلى مستشفى آخر خلال الـ 90 يوماً الماضية؟", "ru": "Были ли вы госпитализированы в другую больницу за последние 90 дней?", "th": "คุณเคยเข้ารับการรักษาในโรงพยาบาลอื่นในช่วง 90 วันที่ผ่านมาไหม?", "zh": "您在过去90天内曾在其他医院住院吗？"}, "과거에 앓았던 질환이 있나요?": {"en": "Do you have any past medical history?", "vi": "Bạn có tiền sử bệnh lý nào không?", "ar": "هل لديكِ تاريخ مرضي سابق؟", "ru": "Есть ли у вас заболевания в анамнезе?", "th": "คุณมีประวัติการเจ็บป่วยในอดีตไหม?", "zh": "您过去曾患过什么疾病吗？"}, "복용중인 약물이 있나요?": {"en": "Are you currently taking any medications?", "vi": "Bạn có đang dùng thuốc nào không?", "ar": "هل تتناولين أي أدوية حالياً؟", "ru": "Принимаете ли вы какие-либо лекарства?", "th": "คุณกำลังรับประทานยาอะไรอยู่ไหม?", "zh": "您目前正在服用任何药物吗？"}, "수술한 적이 있나요?": {"en": "Have you ever had surgery?", "vi": "Bạn đã từng phẫu thuật chưa?", "ar": "هل خضعتِ لأي عملية جراحية من قبل؟", "ru": "Были ли у вас операции?", "th": "คุณเคยผ่าตัดมาก่อนไหม?", "zh": "您曾经做过手术吗？"}, "약물, 음식에 알러지가 있나요?": {"en": "Do you have any allergies to medications or food?", "vi": "Bạn có dị ứng với thuốc hoặc thực phẩm nào không?", "ar": "هل لديكِ حساسية من أي أدوية أو أطعمة؟", "ru": "Есть ли у вас аллергия на лекарства или продукты?", "th": "คุณมีอาการแพ้ยาหรืออาหารไหม?", "zh": "您对药物或食物有过敏反应吗？"}, "수혈 받은 적이 있나요? / (있었던 경우) 수혈 부작용이 있었나요?": {"en": "Have you ever received a blood transfusion? / (If yes) Did you have any transfusion reactions?", "vi": "Bạn đã từng được truyền máu chưa? / (Nếu có) Bạn có phản ứng truyền máu không?", "ar": "هل تلقيتِ نقل دم من قبل؟ / (إن كان نعم) هل كانت لديكِ أي ردود فعل على نقل الدم؟", "ru": "Получали ли вы переливание крови? / (Если да) Были ли реакции?", "th": "คุณเคยได้รับการถ่ายเลือดไหม? / (ถ้าใช่) คุณมีปฏิกิริยาจากการถ่ายเลือดไหม?", "zh": "您曾经输过血吗？/(如有)输血时有过不良反应吗？"}, "가족 중에 결핵, 당뇨, 고혈압, 종양이 있나요?": {"en": "Does anyone in your family have tuberculosis, diabetes, hypertension, or tumors?", "vi": "Trong gia đình bạn có ai bị lao, tiểu đường, cao huyết áp hoặc khối u không?", "ar": "هل يوجد في عائلتكِ من يعاني من السل أو السكري أو ارتفاع ضغط الدم أو الأورام؟", "ru": "Есть ли в семье туберкулёз, диабет, гипертония или опухоли?", "th": "มีคนในครอบครัวของคุณเป็นวัณโรค เบาหวาน ความดันโลหิตสูง หรือเนื้องอกไหม?", "zh": "您的家族成员中有人患结核病、糖尿病、高血压或肿瘤吗？"}, "분만예정일이 언제인가요?": {"en": "What is your expected due date?", "vi": "Ngày dự sinh của bạn là khi nào?", "ar": "ما هو تاريخ الولادة المتوقع؟", "ru": "Какова ваша предполагаемая дата родов?", "th": "วันกำหนดคลอดของคุณคือเมื่อไหร่?", "zh": "您的预产期是什么时候？"}, "자녀가 몇 명이고 자녀의 성별은 무엇인가요?": {"en": "How many children do you have and what are their genders?", "vi": "Bạn có mấy con và giới tính của chúng là gì?", "ar": "كم عدد أطفالكِ وما جنسهم؟", "ru": "Сколько у вас детей и какого они пола?", "th": "คุณมีลูกกี่คนและลูกเป็นเพศอะไร?", "zh": "您有几个孩子？他们的性别是什么？"}, "조산으로 출생한 자녀수는 몇 명인가요?": {"en": "How many of your children were born prematurely?", "vi": "Có bao nhiêu con của bạn sinh non?", "ar": "كم عدد أطفالكِ الذين وُلدوا قبل الأوان؟", "ru": "Сколько детей родились преждевременно?", "th": "ลูกของคุณกี่คนที่คลอดก่อนกำหนด?", "zh": "您有几个孩子是早产的？"}, "자연유산이나 인공유산을 한 적이 있나요?": {"en": "Have you ever had a miscarriage or induced abortion?", "vi": "Bạn đã từng sảy thai tự nhiên hoặc phá thai không?", "ar": "هل سبق أن تعرضتِ لإجهاض تلقائي أو اصطناعي؟", "ru": "Были ли у вас выкидыш или аборт?", "th": "คุณเคยแท้งเองหรือทำแท้งไหม?", "zh": "您曾经有过自然流产或人工流产吗？"}, "자녀의 출산 방법은 자연분만? 제왕절개?": {"en": "What was the delivery method? Natural birth or cesarean section?", "vi": "Phương pháp sinh của con bạn là gì? Sinh thường hay mổ lấy thai?", "ar": "ما طريقة الولادة؟ ولادة طبيعية أم قيصرية؟", "ru": "Метод родов? Естественные роды или кесарево?", "th": "วิธีการคลอดของลูกคุณ? คลอดธรรมชาติหรือผ่าคลอด?", "zh": "之前分娩的方式是什么？顺产还是剖宫产？"}, "이전에 출산한 아기의 출산연월일과 분만방법, 아이의 성별, 몸무게, 출산한 병원을 알려주세요.": {"en": "Please tell us the date of birth, delivery method, gender, weight, and hospital for each previous birth.", "vi": "Vui lòng cho biết ngày sinh, phương pháp sinh, giới tính, cân nặng và bệnh viện cho mỗi lần sinh trước.", "ar": "يرجى إخبارنا بتاريخ الولادة وطريقتها والجنس والوزن والمستشفى لكل ولادة سابقة.", "ru": "Сообщите дату рождения, метод, пол, вес и больницу для каждых предыдущих родов.", "th": "กรุณาแจ้งวันเกิด วิธีคลอด เพศ น้ำหนัก และโรงพยาบาลสำหรับการคลอดครั้งก่อน", "zh": "请告知以往每次分娩的日期、分娩方式、婴儿性别、出生体重及分娩医院。"}, "산전진찰 어느 병원에서 받았나요?": {"en": "Which hospital did you receive prenatal care at?", "vi": "Bạn khám thai tại bệnh viện nào?", "ar": "في أي مستشفى تلقيتِ رعاية ما قبل الولادة؟", "ru": "В какой больнице вы наблюдались?", "th": "คุณฝากครรภ์ที่โรงพยาบาลไหน?", "zh": "您在哪家医院进行产前检查？"}, "정기적으로 잘 받았나요?": {"en": "Did you receive prenatal care regularly?", "vi": "Bạn có khám thai định kỳ đều đặn không?", "ar": "هل تلقيتِ الرعاية بانتظام؟", "ru": "Регулярно ли вы наблюдались?", "th": "คุณฝากครรภ์อย่างสม่ำเสมอไหม?", "zh": "您定期进行产前检查了吗？"}, "마지막으로 병원에 간 게 언제인가요?": {"en": "When did you last visit the hospital?", "vi": "Lần cuối bạn đến bệnh viện là khi nào?", "ar": "متى كانت آخر مرة ذهبتِ فيها إلى المستشفى؟", "ru": "Когда вы последний раз посещали больницу?", "th": "ครั้งล่าสุดที่คุณไปโรงพยาบาลคือเมื่อไหร่?", "zh": "您上次去医院是什么时候？"}, "이슬이나 양수, 진통이 있나요?": {"en": "Do you have bloody show, amniotic fluid leakage, or contractions?", "vi": "Bạn có ra nhớt hồng, rò nước ối hoặc đau bụng không?", "ar": "هل لديكِ إفرازات دموية أو تسرب للسائل الأمنيوسي أو انقباضات؟", "ru": "Есть ли кровянистые выделения, подтекание вод или схватки?", "th": "คุณมีมูกเลือด น้ำคร่ำรั่ว หรือเจ็บครรภ์ไหม?", "zh": "您有见红、破水或宫缩阵痛吗？"}, "산모와 남편의 혈액형을 알려주세요.": {"en": "Please tell us the blood types of the mother and father.", "vi": "Vui lòng cho biết nhóm máu của sản phụ và chồng.", "ar": "يرجى إخبارنا بفصيلتي دم الأم والأب.", "ru": "Сообщите группы крови матери и отца.", "th": "กรุณาแจ้งกรุ๊ปเลือดของมารดาและสามี", "zh": "请告知产妇和丈夫的血型。"}, "남편의 이름, 생년월일, 직업을 알려주세요.": {"en": "Please tell us your husband's name, date of birth, and occupation.", "vi": "Vui lòng cho biết tên, ngày sinh và nghề nghiệp của chồng.", "ar": "يرجى إخبارنا باسم زوجكِ وتاريخ ميلاده ومهنته.", "ru": "Сообщите имя, дату рождения и профессию мужа.", "th": "กรุณาแจ้งชื่อ วันเกิด และอาชีพของสามี", "zh": "请告知丈夫的姓名、出生日期和职业。"}, "마지막으로 음식 및 물 먹은 시간이 언제인가요?": {"en": "When did you last eat food or drink water?", "vi": "Lần cuối bạn ăn uống là khi nào?", "ar": "متى كانت آخر مرة تناولتِ فيها طعاماً أو ماءً؟", "ru": "Когда вы последний раз ели или пили?", "th": "ครั้งล่าสุดที่คุณรับประทานอาหารหรือดื่มน้ำคือเมื่อไหร่?", "zh": "您最后一次进食或喝水是什么时候？"}, "2주 동안 불편했던 증상이 있나요?": {"en": "Have you had any uncomfortable symptoms in the past 2 weeks?", "vi": "Bạn có triệu chứng khó chịu nào trong 2 tuần qua không?", "ar": "هل عانيتِ من أي أعراض غير مريحة خلال الأسبوعين الماضيين؟", "ru": "Были ли неприятные симптомы за последние 2 недели?", "th": "คุณมีอาการไม่สบายใดๆ ในช่วง 2 สัปดาห์ที่ผ่านมาไหม?", "zh": "您在过去2周内有任何不适症状吗？"}, "간염이나 성병이 있나요?": {"en": "Do you have hepatitis or any sexually transmitted diseases?", "vi": "Bạn có viêm gan hoặc bệnh lây truyền qua đường tình dục không?", "ar": "هل لديكِ التهاب كبدي أو أمراض منقولة جنسياً؟", "ru": "Есть ли гепатит или ЗППП?", "th": "คุณมีตับอักเสบหรือโรคติดต่อทางเพศสัมพันธ์ไหม?", "zh": "您有肝炎或性传播疾病吗？"}, "산전진찰 중 이상소견이 있었나요?": {"en": "Were there any abnormal findings during your prenatal checkups?", "vi": "Có phát hiện bất thường nào trong quá trình khám thai không?", "ar": "هل وُجدت أي نتائج غير طبيعية خلال فحوصات ما قبل الولادة؟", "ru": "Были ли отклонения во время дородовых осмотров?", "th": "มีผลผิดปกติใดๆ ในระหว่างการตรวจครรภ์ไหม?", "zh": "产前检查中是否有异常发现？"}, "안경이나 렌즈를 착용하나요?": {"en": "Do you wear glasses or contact lenses?", "vi": "Bạn có đeo kính hoặc kính áp tròng không?", "ar": "هل ترتدين نظارات أو عدسات لاصقة؟", "ru": "Носите ли вы очки или контактные линзы?", "th": "คุณสวมแว่นตาหรือคอนแทคเลนส์ไหม?", "zh": "您戴眼镜或隐形眼镜吗？"}, "임신 중 술이나 담배를 했나요?": {"en": "Did you drink alcohol or smoke during pregnancy?", "vi": "Bạn có uống rượu hoặc hút thuốc trong thời gian mang thai không?", "ar": "هل شربتِ الكحول أو دخنتِ خلال الحمل؟", "ru": "Употребляли ли алкоголь или курили во время беременности?", "th": "คุณดื่มแอลกอฮอล์หรือสูบบุหรี่ระหว่างตั้งครรภ์ไหม?", "zh": "您在怀孕期间饮酒或吸烟了吗？"}, "직업이 무엇인가요?": {"en": "What is your occupation?", "vi": "Nghề nghiệp của bạn là gì?", "ar": "ما مهنتكِ؟", "ru": "Какова ваша профессия?", "th": "อาชีพของคุณคืออะไร?", "zh": "您的职业是什么？"}, "최종학력이 무엇인가요?": {"en": "What is your highest level of education?", "vi": "Trình độ học vấn cao nhất của bạn là gì?", "ar": "ما هو أعلى مستوى تعليمي حصلتِ عليه؟", "ru": "Каков ваш наивысший уровень образования?", "th": "ระดับการศึกษาสูงสุดของคุณคืออะไร?", "zh": "您的最高学历是什么？"}, "결혼은 했나요? 결혼한 나이는 언제인가요?": {"en": "Are you married? How old were you when you got married?", "vi": "Bạn đã kết hôn chưa? Bạn kết hôn năm bao nhiêu tuổi?", "ar": "هل أنتِ متزوجة؟ كم كان عمركِ عند الزواج؟", "ru": "Вы замужем? В каком возрасте вышли замуж?", "th": "คุณแต่งงานแล้วไหม? คุณแต่งงานตอนอายุเท่าไหร่?", "zh": "您已婚吗？结婚时几岁？"}, "종교는 무엇인가요?": {"en": "What is your religion?", "vi": "Tôn giáo của bạn là gì?", "ar": "ما هو دينكِ؟", "ru": "Какова ваша религия?", "th": "ศาสนาของคุณคืออะไร?", "zh": "您的宗教信仰是什么？"}, "부모님은 생존해 계신가요?": {"en": "Are your parents still alive?", "vi": "Bố mẹ bạn còn sống không?", "ar": "هل والداكِ على قيد الحياة؟", "ru": "Ваши родители живы?", "th": "พ่อแม่ของคุณยังมีชีวิตอยู่ไหม?", "zh": "您的父母还在世吗？"}, "형제, 자매가 몇 명인가요?": {"en": "How many siblings do you have?", "vi": "Bạn có mấy anh chị em?", "ar": "كم عدد إخوتكِ وأخواتكِ؟", "ru": "Сколько у вас братьев и сестёр?", "th": "คุณมีพี่น้องกี่คน?", "zh": "您有几个兄弟姐妹？"}, "당신과 남편의 핸드폰 번호를 알려주세요.": {"en": "Please tell us your and your husband's phone numbers.", "vi": "Vui lòng cho biết số điện thoại của bạn và chồng.", "ar": "يرجى إخبارنا برقم هاتفكِ ورقم هاتف زوجكِ.", "ru": "Сообщите номера телефонов вас и мужа.", "th": "กรุณาแจ้งหมายเลขโทรศัพท์ของคุณและสามี", "zh": "请告知您和丈夫的手机号码。"}, "주소 알려주세요.": {"en": "Please tell us your address.", "vi": "Vui lòng cho biết địa chỉ của bạn.", "ar": "يرجى إخبارنا بعنوانكِ.", "ru": "Сообщите ваш адрес.", "th": "กรุณาแจ้งที่อยู่ของคุณ", "zh": "请告知您的地址。"}, "신생아 족문기록지에 산모님의 지장을 찍겠습니다. 양엄지에 인주 찍을게요.": {"en": "We will record your thumbprints on the newborn footprint record sheet. We will apply ink to both thumbs.", "vi": "Chúng tôi sẽ ghi dấu ngón tay cái của bạn vào phiếu ghi dấu chân trẻ sơ sinh. Chúng tôi sẽ bôi mực lên cả hai ngón tay cái.", "ar": "سنسجل بصمتَي إبهامكِ في سجل بصمات قدم المولود. سنضع الحبر على كلا إبهاميكِ.", "ru": "Мы запишем отпечатки больших пальцев в карточку. Нанесём чернила на оба больших пальца.", "th": "เราจะบันทึกลายนิ้วหัวแม่มือของคุณในแบบบันทึกลายเท้าทารกแรกเกิด เราจะทาหมึกที่นิ้วหัวแม่มือทั้งสองข้าง", "zh": "我们将在新生儿足印记录表上采集您的拇指指印。请在双侧拇指上蘸印泥。"}, "퇴원계에서 수납안내 연락이 오면 문자로 핸드폰에 옵니다.": {"zh": "出院结算处通知缴费后，相关信息将以短信形式发送到您的手机。"}, "퇴원할 때까지 자궁저부 확인을 자주 할 것입니다.": {"th": "จะตรวจยอดมดลูกบ่อยๆ จนกว่าจะออกจากโรงพยาบาล"}};

(function(){
  const g=document.getElementById('lang-grid');
  LANGS.forEach(l=>{
    const d=document.createElement('div');d.className='lang-btn';
    d.innerHTML=`<img class="flag-img" src="${l.img}" alt="${l.native}"><div class="lang-name">${l.name}</div><div class="lang-native">${l.native}</div>`;
    d.onclick=()=>selectLang(l.code,l.name,l.native);
    g.appendChild(d);
  });
})();
